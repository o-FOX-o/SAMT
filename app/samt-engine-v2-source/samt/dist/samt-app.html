<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SAMT</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; text-size-adjust: 100%; }
body, h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }

:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-alt: #eef2f7;
  --text: #152033;
  --muted: #637083;
  --border: #d7dee8;
  --primary: #1f5eff;
  --primary-hover: #174bd1;
  --primary-text: #ffffff;
  --success: #16794d;
  --warning: #98620a;
  --danger: #b42318;
  --paused: #53657d;
  --focus: #7aa2ff;
  --shadow: 0 10px 28px rgba(28, 39, 56, 0.08);
  --radius-sm: 0.45rem;
  --radius: 0.75rem;
  --radius-lg: 1rem;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --content: 82rem;
  --header-height: 4.25rem;
  --mobile-nav-height: 4.25rem;
  --z-page: 10;
  --z-sticky: 20;
  --z-floating: 30;
  --z-popover: 40;
  --z-modal-backdrop: 90;
  --z-modal: 100;
  --z-toast: 110;
}

:root[data-mode="dark"] {
  --bg: #0d121b;
  --surface: #151c27;
  --surface-alt: #1b2533;
  --text: #edf2f8;
  --muted: #a2aec0;
  --border: #303b4b;
  --primary: #79a2ff;
  --primary-hover: #9ab9ff;
  --primary-text: #081121;
  --success: #4cd393;
  --warning: #f2ba54;
  --danger: #ff7d72;
  --paused: #9aacbf;
  --focus: #9dbaff;
  --shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
}

@media (prefers-color-scheme: dark) {
  :root[data-mode="system"] {
    --bg: #0d121b;
    --surface: #151c27;
    --surface-alt: #1b2533;
    --text: #edf2f8;
    --muted: #a2aec0;
    --border: #303b4b;
    --primary: #79a2ff;
    --primary-hover: #9ab9ff;
    --primary-text: #081121;
    --success: #4cd393;
    --warning: #f2ba54;
    --danger: #ff7d72;
    --paused: #9aacbf;
    --focus: #9dbaff;
    --shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
  }
}

html { min-width: 20rem; background: var(--bg); }
body {
  min-width: 20rem;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: break-word;
}
body.modal-open { overflow: hidden; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1 { font-size: clamp(1.75rem, 4vw, 2.6rem); line-height: 1.1; letter-spacing: -0.035em; }
h2 { font-size: clamp(1.2rem, 2vw, 1.55rem); line-height: 1.2; }
h3 { font-size: 1.05rem; line-height: 1.3; }
.muted { color: var(--muted); }
.eyebrow { color: var(--primary); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.app-shell { min-height: 100dvh; }
.app-header {
  position: sticky;
  z-index: var(--z-sticky);
  top: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-4);
  min-height: var(--header-height);
  padding: max(var(--space-3), env(safe-area-inset-top)) max(var(--space-4), env(safe-area-inset-right)) var(--space-3) max(var(--space-4), env(safe-area-inset-left));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
}
.brand { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; font-weight: 800; letter-spacing: 0.1em; }
.brand img { inline-size: 2.1rem; block-size: 2.1rem; object-fit: contain; }
.desktop-nav { display: flex; align-items: center; justify-content: center; gap: var(--space-1); min-width: 0; }
.header-actions { display: flex; align-items: center; gap: var(--space-2); }
.page-shell { width: min(100%, var(--content)); margin-inline: auto; padding: var(--space-6) max(var(--space-4), env(safe-area-inset-right)) calc(var(--space-6) + env(safe-area-inset-bottom)) max(var(--space-4), env(safe-area-inset-left)); }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
.page-head-copy { display: grid; gap: var(--space-2); min-width: 0; }
.section { display: grid; gap: var(--space-4); min-width: 0; }
.section + .section { margin-top: var(--space-6); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: var(--space-4); min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); min-width: 0; }
.home-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(18rem, 0.8fr); gap: var(--space-5); align-items: start; }
.stack { display: grid; gap: var(--space-3); min-width: 0; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-width: 0; }
.split { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-width: 0; }
.mobile-nav { display: none; }

.card {
  min-width: 0;
  padding: var(--space-5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}
.card-plain { box-shadow: none; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-3);
  align-items: center;
  min-width: 0;
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: 0; }
.row-main { min-width: 0; }
.row-title { font-weight: 750; overflow-wrap: normal; word-break: normal; }
.row-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-1); color: var(--muted); font-size: 0.9rem; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 2.75rem;
  padding: 0.65rem 0.95rem;
  color: var(--text);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 700;
  line-height: 1.1;
}
.btn:hover { background: color-mix(in srgb, var(--surface-alt) 82%, var(--primary) 18%); }
.btn-primary { color: var(--primary-text); background: var(--primary); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-danger { color: #fff; background: var(--danger); border-color: var(--danger); }
.btn-ghost { background: transparent; }
.btn-small { min-height: 2.35rem; padding: 0.45rem 0.7rem; font-size: 0.9rem; }
.nav-link { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0.55rem 0.8rem; color: var(--muted); border-radius: var(--radius-sm); font-weight: 700; white-space: nowrap; }
.nav-link:hover, .nav-link[aria-current="page"] { color: var(--text); background: var(--surface-alt); }
.badge { display: inline-flex; align-items: center; min-height: 1.6rem; padding: 0.15rem 0.55rem; border-radius: 999px; color: var(--muted); background: var(--surface-alt); font-size: 0.78rem; font-weight: 750; }
.badge-success { color: var(--success); }
.badge-warning { color: var(--warning); }
.badge-danger { color: var(--danger); }
.metric { display: grid; gap: var(--space-1); min-width: 0; }
.metric-value { font-size: clamp(1.6rem, 5vw, 2.35rem); font-weight: 800; letter-spacing: -0.04em; }
.summary-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); }
.summary-strip > div { min-width: 0; padding: var(--space-4); background: var(--surface); }
.progress { overflow: hidden; height: 0.55rem; background: var(--surface-alt); border-radius: 999px; }
.progress > span { display: block; height: 100%; width: min(var(--progress, 0%), 100%); background: var(--primary); border-radius: inherit; }
.empty { padding: var(--space-6); text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
.toast { position: fixed; z-index: var(--z-toast); top: calc(env(safe-area-inset-top) + var(--space-4)); left: 50%; transform: translateX(-50%); width: min(calc(100vw - 2rem), 30rem); padding: var(--space-3) var(--space-4); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.status-dot { inline-size: 0.55rem; block-size: 0.55rem; border-radius: 50%; background: currentColor; }
.code-box { overflow: auto; max-height: 18rem; padding: var(--space-4); background: var(--surface-alt); border-radius: var(--radius-sm); font: 0.83rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.danger-zone { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); min-width: 0; }
.field { display: grid; gap: var(--space-2); min-width: 0; }
.field-full { grid-column: 1 / -1; }
.label { font-size: 0.9rem; font-weight: 750; }
.input, .select, .textarea {
  width: 100%;
  min-width: 0;
  min-height: 2.85rem;
  padding: 0.65rem 0.75rem;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.textarea { min-height: 7rem; resize: vertical; }
.field-error { color: var(--danger); font-size: 0.88rem; }
.segmented { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 2px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.segmented .btn { min-height: 2.4rem; background: transparent; border: 0; }
.segmented .btn[aria-pressed="true"] { color: var(--primary-text); background: var(--primary); }
.check { display: flex; align-items: start; gap: var(--space-2); }
.check input { margin-top: 0.25rem; }

.modal-backdrop {
  position: fixed;
  z-index: var(--z-modal-backdrop);
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  background: rgba(4, 8, 15, 0.66);
  backdrop-filter: blur(7px);
}
.modal-dialog {
  z-index: var(--z-modal);
  width: min(100%, 35rem);
  max-height: min(90dvh, 48rem);
  overflow: auto;
  padding: var(--space-5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
}
.modal-dialog-wide { width: min(100%, 48rem); }
.modal-head { display: flex; align-items: start; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: var(--space-2); margin-top: var(--space-5); }

@media (max-width: 900px) {
  .home-layout, .grid-2 { grid-template-columns: 1fr; }
}

@media (max-width: 767px) {
  :root { --header-height: 3.9rem; }
  .app-header { grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); }
  .desktop-nav { display: none; }
  .brand { font-size: 0.95rem; }
  .brand img { inline-size: 1.9rem; block-size: 1.9rem; }
  .page-shell { padding-top: var(--space-5); padding-bottom: calc(var(--mobile-nav-height) + var(--space-5) + env(safe-area-inset-bottom)); }
  .page-head { align-items: start; flex-direction: column; margin-bottom: var(--space-5); }
  .page-head > .inline { width: 100%; }
  .page-head > .inline .btn { flex: 1 1 auto; }
  .form-grid { grid-template-columns: 1fr; }
  .field-full { grid-column: auto; }
  .card { padding: var(--space-4); }
  .row { grid-template-columns: 1fr; align-items: start; }
  .row > .inline { width: 100%; }
  .row > .inline .btn { flex: 1 1 auto; }
  .summary-strip > div { padding: var(--space-3); }
  .summary-strip .metric-value { font-size: 1.45rem; }
  .mobile-nav {
    position: fixed;
    z-index: var(--z-floating);
    right: 0;
    bottom: 0;
    left: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    min-height: calc(var(--mobile-nav-height) + env(safe-area-inset-bottom));
    padding: 0.35rem max(0.35rem, env(safe-area-inset-right)) max(0.35rem, env(safe-area-inset-bottom)) max(0.35rem, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .mobile-nav .nav-link { justify-content: center; min-width: 0; min-height: 3.2rem; padding: 0.35rem 0.2rem; font-size: 0.72rem; text-align: center; white-space: normal; }
  .modal-dialog { width: calc(100vw - 2rem); padding: var(--space-4); }
}

@media (max-width: 360px) {
  .page-shell { padding-inline: 0.75rem; }
  .summary-strip { grid-template-columns: 1fr; }
  .summary-strip > div { display: flex; align-items: center; justify-content: space-between; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

</style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
(() => {
"use strict";
const modules = {
"js/main.js": function(module, exports, require) {
const { SamtEngine } = require("js/application/engine.js");
const { StructuredLogger } = require("js/application/events.js");
const { SystemClock } = require("js/infrastructure/clock.js");
const { LegacyBrowserRepository } = require("js/infrastructure/repository.js");
const { parseRoute, navigate } = require("js/ui/router.js");
const { moreNavigationMarkup } = require("js/ui/navigation.js");
const { ModalManager } = require("js/ui/modal-manager.js");
const { renderShell } = require("js/ui/shell.js");
const { renderHomeView } = require("js/ui/home-view.js");
const { renderActionsView, renderActionDetailView } = require("js/ui/actions-view.js");
const { renderBlocksView } = require("js/ui/blocks-view.js");
const { renderActionListsView } = require("js/ui/action-lists-view.js");
const { renderBlockDetailView } = require("js/ui/block-detail-view.js");
const { renderBlockEditView } = require("js/ui/block-edit-view.js");
const { renderAnalysisView } = require("js/ui/analysis-view.js");
const { renderHistoryView } = require("js/ui/history-view.js");
const { renderSettingsView } = require("js/ui/settings-view.js");
const { escapeHtml } = require("js/ui/format.js");

const appRoot = document.getElementById("app");
const modal = new ModalManager(document.getElementById("modal-root"));
const logger = new StructuredLogger(new URLSearchParams(location.search).has("debug"));
const repository = new LegacyBrowserRepository({ logger });
const engine = new SamtEngine({ repository, clock: new SystemClock(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/London", logger });

function applyMode() {
  const mode = engine.state?.settings?.appearanceMode || "system";
  document.documentElement.dataset.mode = mode;
}

function renderRoute() {
  const route = parseRoute();
  let content;
  try {
    if (route.name === "home") content = renderHomeView(engine.queries.getHomeViewModel());
    else if (route.name === "actions") content = renderActionsView(engine.queries.getActions());
    else if (route.name === "action-detail") {
      const action = engine.queries.getActionById(route.id);
      const logs = engine.queries.getState().actionLogs.filter((item) => item.actionId === route.id);
      content = renderActionDetailView(action, logs);
    } else if (route.name === "blocks") content = renderBlocksView(engine.queries.getBlocks());
    else if (route.name === "action-lists") content = renderActionListsView(engine.queries.getBlocks({ type: "action_list" }));
    else if (route.name === "block-detail") {
      const detail = engine.queries.getBlockDetail(route.id);
      const block = engine.queries.getBlockById(route.id);
      const progress = block.type === "target" ? (block.direction === "avoid" ? engine.queries.getAvoidStatus(route.id) : engine.queries.getTargetProgress(route.id)) : null;
      content = renderBlockDetailView(detail, progress);
    } else if (route.name === "block-edit") content = renderBlockEditView(engine.queries.getBlockById(route.id));
    else if (route.name === "analysis") content = renderAnalysisView(engine.queries.getAnalysisViewModel());
    else if (route.name === "history") content = renderHistoryView(engine.queries.getState().history);
    else if (route.name === "settings") content = renderSettingsView(engine.queries.getState());
    else content = '<main class="page-shell"><div class="empty"><h1>Page not found</h1><a class="btn" href="#/">Return Home</a></div></main>';
    appRoot.innerHTML = renderShell(route, content);
    document.querySelector("[data-edit-block-form]")?.addEventListener("submit", saveBlockForm);
  } catch (error) { showError(error); }
}

function showToast(message) {
  const element = document.createElement("div");
  element.className = "toast";
  element.setAttribute("role", "status");
  element.textContent = message;
  document.body.append(element);
  setTimeout(() => element.remove(), 2600);
}

async function showError(error) {
  logger.error("UI", error.message, { code: error.code, details: error.details });
  await modal.open({ title: "SAMT could not complete that", body: `<p>${escapeHtml(error.message || "Unknown error")}</p>${error.code ? `<p class="muted">${escapeHtml(error.code)}</p>` : ""}`, cancelLabel: "Close" });
}

function actionFields(action = null) {
  const completion = action?.completion || { method: "quantity", target: 1, minimumMinutes: 0 };
  return `<div class="form-grid"><label class="field field-full"><span class="label">Name</span><input class="input" name="name" maxlength="25" required value="${escapeHtml(action?.name || "")}"></label><label class="field"><span class="label">Direction</span><select class="select" name="direction"><option value="do" ${action?.direction !== "avoid" ? "selected" : ""}>Do</option><option value="avoid" ${action?.direction === "avoid" ? "selected" : ""}>Avoid</option></select></label><label class="field"><span class="label">Completion</span><select class="select" name="method"><option value="quantity" ${completion.method === "quantity" ? "selected" : ""}>Quantity</option><option value="time" ${completion.method === "time" ? "selected" : ""}>Time</option></select></label><label class="field"><span class="label">Quantity target</span><input class="input" type="number" min="1" step="1" name="target" value="${escapeHtml(completion.target ?? 1)}"></label><label class="field"><span class="label">Minimum minutes</span><input class="input" type="number" min="0" step="1" name="minimumMinutes" value="${escapeHtml(completion.minimumMinutes ?? 0)}"></label><label class="field field-full"><span class="label">Description</span><textarea class="textarea" name="description">${escapeHtml(action?.description || "")}</textarea></label></div>`;
}

async function editAction(id = null) {
  const existing = id ? engine.queries.getActionById(id) : null;
  const data = await modal.open({ title: existing ? `Edit ${existing.name}` : "Create Action", body: actionFields(existing), submitLabel: existing ? "Save" : "Create" });
  if (!data) return;
  const method = data.get("method");
  const value = { name: data.get("name"), description: data.get("description"), direction: data.get("direction"), completion: { method, target: Number(data.get("target") || 1), minimumMinutes: Number(data.get("minimumMinutes") || 0) }, result: existing?.result || { mode: "none", scoreMax: null, unitId: null, allowedUnitIds: [] }, tagIds: existing?.tagIds || [] };
  if (existing) await engine.updateAction(existing.id, value); else await engine.createAction(value);
  showToast(existing ? "Action updated." : "Action created.");
  renderRoute();
}

function blockFields(type = "routine") {
  const options = [["cycle", "Cycle"], ["routine", "Routine"], ["workflow", "Workflow"], ["project", "Project"], ["action_list", "Action List"], ["collection", "Collection"], ["target", "Target Block"]];
  return `<div class="form-grid"><label class="field field-full"><span class="label">Name</span><input class="input" name="name" maxlength="25" required></label><label class="field"><span class="label">Type</span><select class="select" name="type">${options.map(([value, label]) => `<option value="${value}" ${type === value ? "selected" : ""}>${label}</option>`).join("")}</select></label><label class="field"><span class="label">Direction</span><select class="select" name="direction"><option value="do">Do</option><option value="avoid">Avoid</option></select></label><label class="field"><span class="label">Target value (Target Block)</span><input class="input" type="number" min="1" step="1" name="targetValue" value="60"></label><label class="field"><span class="label">Target metric</span><select class="select" name="targetMetric"><option value="time">Time (minutes)</option><option value="quantity">Quantity</option><option value="completion_count">Completion count</option></select></label><label class="field"><span class="label">Period</span><select class="select" name="period"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="all_time">All time</option></select></label><label class="field field-full"><span class="label">Description</span><textarea class="textarea" name="description"></textarea></label></div>`;
}

async function createBlock(type = "routine") {
  const data = await modal.open({ title: type === "action_list" ? "Create Action List" : "Create Block", body: blockFields(type), submitLabel: "Create" });
  if (!data) return;
  const selectedType = data.get("type");
  const direction = data.get("direction");
  const typeConfig = selectedType === "target" ? { targetMetric: data.get("targetMetric"), targetValue: Number(data.get("targetValue")), targetUnit: data.get("targetMetric") === "time" ? "minutes" : null, period: { mode: data.get("period"), weekStart: 1 }, aggregation: "inclusive_unique", requireChildTargets: false, requiredChildBlockIds: [], ...(direction === "avoid" ? { avoidEvaluation: { mode: "binary_limit", metric: data.get("targetMetric") === "completion_count" ? "count" : data.get("targetMetric"), binaryLimit: Number(data.get("targetValue")), period: { mode: data.get("period"), weekStart: 1 } } } : {}) } : {};
  const value = { name: data.get("name"), description: data.get("description"), type: selectedType, direction, children: [], completion: { mode: ["action_list", "collection"].includes(selectedType) ? "open" : "manual", threshold: 0, requiredRelIds: [], afterThreshold: "allow_extra" }, typeConfig, projectTargets: [] };
  const created = await engine.createBlock(value);
  showToast("Block created.");
  navigate(`/blocks/${created.value.id}`);
}

async function logAction(id) {
  const action = engine.queries.getActionById(id);
  if (!action) return;
  const isTime = action.completion?.method === "time";
  const data = await modal.open({ title: `Log ${action.name}`, body: `<label class="field"><span class="label">${isTime ? "Minutes" : "Quantity"}</span><input class="input" name="value" type="number" min="${isTime ? 0.01 : 1}" step="${isTime ? 0.01 : 1}" required value="${isTime ? 30 : 1}"></label>${action.result?.mode !== "none" ? '<label class="field"><span class="label">Result</span><input class="input" name="result" type="number" step="any"></label>' : ""}<label class="field"><span class="label">Note</span><textarea class="textarea" name="note"></textarea></label>`, submitLabel: "Save log" });
  if (!data) return;
  const value = Number(data.get("value"));
  await engine.logAction(id, { ...(isTime ? { durationPerformed: value } : { quantityPerformed: value }), resultValue: data.get("result") === "" ? null : Number(data.get("result")), note: data.get("note") });
  showToast("One factual Action Log saved.");
  renderRoute();
}

async function quickLog() {
  const actions = engine.queries.getActions({ status: "active" });
  if (!actions.length) { await modal.open({ title: "Quick Log", body: '<p>Create an Action first.</p>', cancelLabel: "Close" }); return; }
  const data = await modal.open({ title: "Quick Log", body: `<label class="field"><span class="label">Action</span><select class="select" name="actionId">${actions.map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`).join("")}</select></label>`, submitLabel: "Continue" });
  if (data) await logAction(data.get("actionId"));
}

async function deleteDefinition(kind, id) {
  const object = kind === "action" ? engine.queries.getActionById(id) : engine.queries.getBlockById(id);
  if (!object) return;
  const confirmed = await modal.confirm({ title: `Delete ${object.name}?`, message: "It will disappear immediately from the live system and remain in the Bin for 10 days. Historical facts are not erased.", confirmLabel: "Move to Bin", destructive: true });
  if (!confirmed) return;
  await engine.deleteDefinition(kind, id);
  showToast(`${object.name} moved to Bin.`);
  if (parseRoute().id === id) navigate(kind === "action" ? "/actions" : "/blocks"); else renderRoute();
}

async function saveBlockForm(event) {
  event.preventDefault();
  const form = event.currentTarget;
  await engine.updateBlock(form.dataset.id, { name: form.elements.name.value, description: form.elements.description.value });
  showToast("Block updated without changing its ID.");
  navigate(`/blocks/${encodeURIComponent(form.dataset.id)}`);
}

function downloadJson(filename, value) {
  const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url; anchor.download = filename; anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importPackage() {
  const data = await modal.open({ title: "Import SAMT Package", body: '<label class="field"><span class="label">Choose JSON file</span><input class="input" name="file" type="file" accept="application/json,.json"></label><label class="field"><span class="label">Or paste JSON</span><textarea class="textarea" name="json"></textarea></label>', submitLabel: "Validate", wide: true });
  if (!data) return;
  const file = data.get("file");
  const text = file && file.size ? await file.text() : data.get("json");
  const preview = engine.prepareImport(text);
  const conflicts = preview.plan.filter((item) => !["new", "same_id_same"].includes(item.conflictType)).length;
  const confirmed = await modal.confirm({ title: "Import validated", message: `${preview.package.packageType}: ${preview.package.rootObjectIds.length} roots, ${preview.plan.filter((item) => item.conflictType === "new").length} new objects, ${conflicts} conflicts using safe defaults. Commit atomically?`, confirmLabel: "Import" });
  if (!confirmed) return;
  await engine.commitImport(preview);
  applyMode(); renderRoute(); showToast("Import complete. Restore Point created.");
}

async function startBlock(id) {
  const block = engine.queries.getBlockById(id);
  const detail = engine.queries.getBlockDetail(id);
  let activation = detail.activeActivation;
  if (!activation) activation = (await engine.activateBlock(id, { status: "manual" })).value;
  const periodMode = block.direction === "avoid" ? block.typeConfig?.avoidEvaluation?.period?.mode : block.typeConfig?.period?.mode;
  if (block.type === "target" && periodMode === "session") await engine.startPeriod(id);
  else if (block.type !== "target") await engine.startRun(id, activation.id);
  showToast(block.type === "target" ? (periodMode === "session" ? "Target session started." : "Target Block activated.") : "Run started.");
  renderRoute();
}

document.addEventListener("click", async (event) => {
  const control = event.target.closest("[data-action]");
  if (!control) return;
  const action = control.dataset.action;
  try {
    if (action === "new-action") await editAction();
    else if (action === "edit-action") await editAction(control.dataset.id);
    else if (action === "log-action") await logAction(control.dataset.id);
    else if (action === "quick-log") await quickLog();
    else if (action === "new-block") await createBlock();
    else if (action === "new-action-list") await createBlock("action_list");
    else if (action === "delete-action") await deleteDefinition("action", control.dataset.id);
    else if (action === "delete-block") await deleteDefinition("block", control.dataset.id);
    else if (action === "delete-log") { if (await modal.confirm({ title: "Delete this Action Log?", message: "The factual event and its contribution will be removed. A correction remains in History.", confirmLabel: "Delete Log", destructive: true })) { await engine.deleteActionLog(control.dataset.id); renderRoute(); } }
    else if (action === "start-block") await startBlock(control.dataset.id);
    else if (action === "close-period") { await engine.closePeriod(control.dataset.id); showToast("Session saved."); renderRoute(); }
    else if (action === "open-more") await modal.open({ title: "Navigate", body: moreNavigationMarkup(parseRoute()), cancelLabel: "Close" });
    else if (action === "set-mode") { await engine.setAppearanceMode(control.dataset.mode); applyMode(); renderRoute(); }
    else if (action === "export-backup") downloadJson(`samt-full-backup-${new Date().toISOString().slice(0, 10)}.json`, engine.makePackage("backup"));
    else if (action === "import-backup") await importPackage();
    else if (action === "undo-import") { if (await modal.confirm({ title: "Undo latest import?", message: "Restore the exact pre-import state?", confirmLabel: "Undo Import", destructive: true })) { await engine.undoImport(control.dataset.id); applyMode(); renderRoute(); } }
  } catch (error) { await showError(error); }
});

globalThis.addEventListener("hashchange", renderRoute);

async function boot() {
  try {
    await engine.initialize();
    applyMode();
    renderRoute();
    globalThis.samtEngine = engine;
  } catch (error) {
    appRoot.innerHTML = `<main class="page-shell"><section class="card danger-zone section"><h1>Your data was not changed</h1><p>${escapeHtml(error.message)}</p><p class="muted">Open the previous SAMT file and export a Full Backup if this browser address is isolated.</p></section></main>`;
    await showError(error);
  }
}

boot();


},
"js/application/engine.js": function(module, exports, require) {
const { StorageError } = require("js/shared/errors.js");
const { createId } = require("js/shared/ids.js");
const { deepClone } = require("js/shared/validation.js");
const { runLogicalTransaction } = require("js/infrastructure/transactions.js");
const { migrateInternalState, validateLegacyShape } = require("js/import-export/migrations.js");
const { validateState } = require("js/import-export/validator.js");
const { exportFullBackup, exportActionPackage, exportBlockPackage, exportStylePackage } = require("js/import-export/exporter.js");
const { prepareImport, rebuildImportCandidate } = require("js/import-export/importer.js");
const { createBackupRecord } = require("js/infrastructure/backup.js");
const { reconcileTemporalState } = require("js/application/lifecycle.js");
const { EventCollector, EVENTS, StructuredLogger, domainEvent } = require("js/application/events.js");
const { createQueries } = require("js/application/queries.js");
const { activateBlockCommand, advanceCycleCommand, commandContext, completeOccurrenceCommand, createActionCommand, createBlockCommand, deleteActionLogCommand, finishRunCommand, logActionCommand, moveDefinitionToBinCommand, pauseBlockCommand, startRunCommand, startPeriodCommand, closePeriodCommand, updateActionCommand, updateBlockCommand } = require("js/application/commands.js");

class SamtEngine {
  constructor({ repository, clock, timezone = "Europe/London", idFactory = createId, logger = new StructuredLogger(false) }) {
    this.repository = repository;
    this.clock = clock;
    this.timezone = timezone;
    this.idFactory = idFactory;
    this.logger = logger;
    this.events = new EventCollector();
    this.state = null;
    this.queries = createQueries(() => deepClone(this.state), () => ({ now: this.clock.now(), timezone: this.state?.settings?.timezone || this.timezone }));
  }

  async initialize() {
    const raw = await this.repository.load();
    const legacyValidation = validateLegacyShape(raw || {});
    if (raw && !legacyValidation.ok) throw new StorageError("Existing SAMT data failed pre-migration validation. Nothing was changed.", legacyValidation);
    if (raw) await this.repository.createMigrationBackup(raw);
    const migration = migrateInternalState(raw, { now: this.clock.now(), timezone: this.timezone });
    try {
      validateState(migration.state);
      const reconciled = reconcileTemporalState(migration.state, { now: this.clock.now(), timezone: migration.state.settings.timezone });
      validateState(reconciled.state);
      await this.repository.save(reconciled.state, raw);
      this.state = reconciled.state;
      reconciled.events.forEach((event) => this.events.emit(event));
      return { ok: true, value: this.queries.getState(), migrated: migration.changed, fresh: migration.fresh };
    } catch (error) {
      this.state = raw ? deepClone(raw) : null;
      throw new StorageError("SAMT migration was not committed. The original state remains available.", { cause: error.message, code: error.code });
    }
  }

  context() { return commandContext(this.clock.now(), this.idFactory, this.state?.settings?.timezone || this.timezone); }

  async transact(mutation) {
    if (!this.state) throw new StorageError("SAMT engine is not initialised.");
    const context = this.context();
    const outcome = await runLogicalTransaction({
      state: this.state,
      mutate: async (candidate) => {
        const result = await mutation(candidate, context);
        candidate.meta = { ...(candidate.meta || {}), updatedAt: context.now };
        return result;
      },
      validate: validateState,
      commit: (candidate, previous) => this.repository.save(candidate, previous)
    });
    this.state = outcome.state;
    for (const event of outcome.value?.events || []) this.events.emit(event);
    return { ok: true, value: deepClone(outcome.value?.value), events: deepClone(outcome.value?.events || []) };
  }

  createAction(input) { return this.transact((state, context) => createActionCommand(state, input, context)); }
  updateAction(id, patch) { return this.transact((state, context) => updateActionCommand(state, id, patch, context)); }
  logAction(id, input) { return this.transact((state, context) => logActionCommand(state, id, input, context)); }
  deleteActionLog(id) { return this.transact((state, context) => deleteActionLogCommand(state, id, context)); }
  createBlock(input) { return this.transact((state, context) => createBlockCommand(state, input, context)); }
  updateBlock(id, patch) { return this.transact((state, context) => updateBlockCommand(state, id, patch, context)); }
  activateBlock(id, config = {}) { return this.transact((state, context) => activateBlockCommand(state, id, config, context)); }
  pauseBlock(id, resumeAt) { return this.transact((state, context) => pauseBlockCommand(state, id, resumeAt, context)); }
  startRun(blockId, activationId = null) { return this.transact((state, context) => startRunCommand(state, blockId, activationId, context)); }
  finishRun(id) { return this.transact((state, context) => finishRunCommand(state, id, context)); }
  completeOccurrence(id, status = "completed") { return this.transact((state, context) => completeOccurrenceCommand(state, id, status, context)); }
  skipOccurrence(id) { return this.completeOccurrence(id, "skipped"); }
  advanceCycle(id) { return this.transact((state, context) => advanceCycleCommand(state, id, context)); }
  startPeriod(blockId) { return this.transact((state, context) => startPeriodCommand(state, blockId, context)); }
  closePeriod(periodId) { return this.transact((state, context) => closePeriodCommand(state, periodId, context)); }
  deleteDefinition(kind, id) { return this.transact((state, context) => moveDefinitionToBinCommand(state, kind, id, context)); }

  async reconcileTemporalState() {
    return this.transact((state, context) => {
      const outcome = reconcileTemporalState(state, { now: context.now, timezone: state.settings.timezone || this.timezone });
      return { value: { eventCount: outcome.events.length }, events: outcome.events };
    });
  }

  makePackage(type, rootIds = []) {
    const options = { id: this.idFactory("package"), now: this.clock.now() };
    if (type === "backup") return exportFullBackup(this.state, options);
    if (type === "action-package") return exportActionPackage(this.state, rootIds, options);
    if (type === "block-package") return exportBlockPackage(this.state, rootIds, options);
    if (type === "style-package") return exportStylePackage(this.state, rootIds, options);
    throw new Error(`Unsupported package type: ${type}`);
  }

  prepareImport(input) { return prepareImport(this.state, input); }

  async commitImport(preview) {
    return this.transact((state, context) => {
      const restorePoint = createBackupRecord(state, { id: context.id("restore"), now: context.now, reason: `Before ${preview.package.packageType} import`, packageId: preview.package.packageId });
      const candidate = rebuildImportCandidate(state, preview);
      candidate.restorePoints = [...(candidate.restorePoints || []), restorePoint];
      candidate.importHistory = [...(candidate.importHistory || []), { id: context.id("import"), packageId: preview.package.packageId, packageType: preview.package.packageType, importedAt: context.now, status: "completed", restorePointId: restorePoint.id }];
      for (const key of Object.keys(state)) delete state[key];
      Object.assign(state, candidate);
      const event = domainEvent(EVENTS.IMPORT_PERFORMED, { packageId: preview.package.packageId, restorePointId: restorePoint.id }, context.now);
      return { value: { restorePointId: restorePoint.id }, events: [event] };
    });
  }

  async undoImport(restorePointId) {
    return this.transact((state, context) => {
      const restore = state.restorePoints.find((item) => item.id === restorePointId);
      if (!restore) throw new StorageError("Import Restore Point was not found.");
      const restored = deepClone(restore.snapshot);
      restored.importHistory = [...(restored.importHistory || []), { id: context.id("import"), packageId: restore.packageId, packageType: "undo", importedAt: context.now, status: "undone" }];
      for (const key of Object.keys(state)) delete state[key];
      Object.assign(state, restored);
      return { value: true, events: [domainEvent(EVENTS.IMPORT_UNDONE, { restorePointId }, context.now)] };
    });
  }

  setAppearanceMode(mode) {
    return this.transact((state, context) => { state.settings.appearanceMode = ["light", "dark", "system"].includes(mode) ? mode : "system"; state.settings.updatedAt = context.now; return { value: state.settings.appearanceMode, events: [] }; });
  }
}

exports["SamtEngine"] = SamtEngine;
},

"js/shared/ids.js": function(module, exports, require) {
let fallbackSequence = 0;

function createId(prefix, randomUuid) {
  const generator = randomUuid || (globalThis.crypto && globalThis.crypto.randomUUID ? () => globalThis.crypto.randomUUID() : null);
  fallbackSequence += 1;
  const value = generator ? generator() : `${Math.floor(Math.random() * Number.MAX_SAFE_INTEGER).toString(36)}-${fallbackSequence.toString(36)}`;
  return `${prefix}_${value}`;
}

function stableTemporalId(kind, ownerId, start) {
  const compact = String(start).replace(/[^0-9A-Za-z]/g, "");
  return `${kind}_${ownerId}_${compact}`;
}

exports["createId"] = createId;

"js/shared/validation.js": function(module, exports, require) {
const { ConflictError, ValidationError } = require("js/shared/errors.js");

function invariant(condition, message, details) {
  if (!condition) throw new ValidationError(message, details);
}

function isPlainObject(value) {
  if (!value || typeof value !== "object") return false;
  const prototype = Object.getPrototypeOf(value);
  return prototype === Object.prototype || prototype === null;
}

function deepClone(value) {
  if (typeof structuredClone === "function") return structuredClone(value);
  return JSON.parse(JSON.stringify(value));
}

function normalizeName(value) {
  return String(value || "")
    .replace(/[^A-Za-z0-9 ]+/g, " ")
    .replace(/([A-Za-z])([0-9])/g, "$1 $2")
    .replace(/([0-9])([A-Za-z])/g, "$1 $2")
    .replace(/\s+/g, " ")
    .trim()
    .toLocaleLowerCase()
    .replace(/\b\w/g, (character) => character.toLocaleUpperCase())
    .slice(0, 25)
    .trim();
}

function normalizeUnitName(value) {
  return String(value || "").replace(/[^A-Za-z ]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 15);
}

function assertStableId(value, label = "Object") {
  invariant(typeof value === "string" && value.trim().length > 0, `${label} needs a stable ID.`);
  return value;
}

function assertUniqueIds(collections) {
  const seen = new Map();
  for (const [kind, items] of Object.entries(collections)) {
    for (const item of items || []) {
      assertStableId(item && item.id, kind);
      if (seen.has(item.id)) throw new ConflictError(`Duplicate stable ID: ${item.id}`, { first: seen.get(item.id), second: kind });
      seen.set(item.id, kind);
    }
  }
  return true;
}

function assertUniqueNormalizedNames(items, kind) {
  const names = new Map();
  for (const item of items || []) {
    const normalized = normalizeName(item.name);
    invariant(normalized.length > 0, `${kind} name is required.`, { id: item.id });
    const key = normalized.toLocaleLowerCase();
    if (names.has(key)) throw new ConflictError(`${kind} name already exists: ${normalized}`, { firstId: names.get(key), secondId: item.id });
    names.set(key, item.id);
  }
  return true;
}

function result(value) { return { ok: true, value }; }
function failure(error) { return { ok: false, error }; }

exports["invariant"] = invariant;
exports["isPlainObject"] = isPlainObject;
exports["deepClone"] = deepClone;
exports["normalizeName"] = normalizeName;
exports["normalizeUnitName"] = normalizeUnitName;
exports["assertStableId"] = assertStableId;
exports["assertUniqueIds"] = assertUniqueIds;
exports["assertUniqueNormalizedNames"] = assertUniqueNormalizedNames;
exports["result"] = result;
exports["failure"] = failure;
},
"js/infrastructure/transactions.js": function(module, exports, require) {
const { deepClone } = require("js/shared/validation.js");

async function runLogicalTransaction({ state, mutate, validate, commit }) {
  const previous = deepClone(state);
  const candidate = deepClone(state);
  const value = await mutate(candidate);
  validate(candidate);
  await commit(candidate, previous);
  return { state: candidate, value };
}

exports["runLogicalTransaction"] = runLogicalTransaction;
},
"js/import-export/migrations.js": function(module, exports, require) {
const { deepClone } = require("js/shared/validation.js");

const INTERNAL_STORAGE_VERSION = 2;
const PACKAGE_SCHEMA_VERSION = 2;
const LEGACY_SCHEMA_VERSION = "1.11.0";
const ENGINE_APP_VERSION = "2.0.0";

const ARRAY_KEYS = [
  "categories", "tags", "units", "actions", "blocks", "activationPresets", "activations", "runs", "occurrences",
  "actionLogs", "history", "analysisTargets", "targetPeriods", "avoidPeriods", "periodEvaluations", "styles",
  "restorePoints", "importHistory", "bin"
];

function createEmptyState(now, timezone = "Europe/London") {
  const state = {
    schemaVersion: LEGACY_SCHEMA_VERSION,
    appVersion: ENGINE_APP_VERSION,
    internalStorageVersion: INTERNAL_STORAGE_VERSION,
    meta: { createdAt: now, updatedAt: now, seedPolicy: "empty", engineArchitecture: "modular-v2" },
    settings: {
      onboardingCompleted: true,
      timezone,
      appearanceMode: "system",
      primaryProjectId: null,
      behaviourDefaults: {
        targets: { autoClose: true },
        cycles: { autoClose: true, position: "continue", missedItem: "keep" },
        routines: { expireUnfinishedOccurrence: true },
        actionLists: { expireConfiguredOccurrences: true }
      },
      createdAt: now,
      updatedAt: now
    }
  };
  for (const key of ARRAY_KEYS) state[key] = [];
  return state;
}

function validateLegacyShape(candidate) {
  if (!candidate || typeof candidate !== "object") return { ok: false, error: "Stored SAMT state is not an object." };
  for (const key of ["categories", "tags", "actions", "blocks", "actionLogs", "history"]) {
    if (candidate[key] != null && !Array.isArray(candidate[key])) return { ok: false, error: `Stored SAMT ${key} is invalid.` };
  }
  return { ok: true };
}

function migrateInternalState(candidate, { now, timezone = "Europe/London" }) {
  if (!candidate) return { state: createEmptyState(now, timezone), changed: true, fresh: true };
  const next = deepClone(candidate);
  for (const key of ARRAY_KEYS) if (!Array.isArray(next[key])) next[key] = [];
  next.meta = { ...(next.meta || {}), createdAt: next.meta?.createdAt || now, updatedAt: next.meta?.updatedAt || now, engineArchitecture: "modular-v2" };
  next.settings = {
    ...createEmptyState(now, timezone).settings,
    ...(next.settings || {}),
    timezone: next.settings?.timezone || timezone,
    behaviourDefaults: {
      ...createEmptyState(now, timezone).settings.behaviourDefaults,
      ...(next.settings?.behaviourDefaults || {})
    }
  };
  next.actions = next.actions.map((action) => {
    const sourceCompletion = action.completion || action.completionConfiguration || {};
    const method = sourceCompletion.method || action.completionMethod || "quantity";
    const sourceResult = action.result || action.resultConfiguration || { mode: action.resultType || "none" };
    return {
      ...action,
      direction: action.direction === "avoid" ? "avoid" : "do",
      tagIds: Array.isArray(action.tagIds) ? action.tagIds : [],
      completion: {
        ...sourceCompletion,
        method,
        target: Number(sourceCompletion.target ?? sourceCompletion.minimum ?? 1),
        minimumMinutes: Number(sourceCompletion.minimumMinutes ?? sourceCompletion.minutes ?? (method === "time" ? sourceCompletion.target : 0) ?? 0)
      },
      result: {
        mode: sourceResult.mode || action.resultType || "none",

"js/import-export/validator.js": function(module, exports, require) {
const { ImportError } = require("js/shared/errors.js");
const { assertUniqueIds, assertUniqueNormalizedNames } = require("js/shared/validation.js");
const { validateActionDefinition } = require("js/domain/actions.js");
const { validateBlockDefinition } = require("js/domain/blocks.js");
const { validateBlockGraph } = require("js/domain/relationships.js");
const { validateAvoidEvaluation } = require("js/domain/avoid.js");
const { normalizeTargetConfig, validateTargetConfig } = require("js/domain/targets.js");
const { PACKAGE_SCHEMA_VERSION, migratePackage } = require("js/import-export/migrations.js");

const ID_COLLECTIONS = ["categories", "tags", "units", "actions", "blocks", "activationPresets", "activations", "runs", "occurrences", "actionLogs", "history", "analysisTargets", "targetPeriods", "avoidPeriods", "periodEvaluations", "styles", "restorePoints", "importHistory", "bin"];

function validateState(state) {
  if (!state || typeof state !== "object") throw new ImportError("SAMT state must be an object.");
  for (const key of ID_COLLECTIONS) if (!Array.isArray(state[key])) throw new ImportError(`SAMT state is missing ${key}.`);
  assertUniqueIds(Object.fromEntries(ID_COLLECTIONS.map((key) => [key, state[key]])));
  assertUniqueNormalizedNames(state.categories, "Category");
  assertUniqueNormalizedNames(state.tags, "Tag");
  assertUniqueNormalizedNames(state.actions, "Action");
  assertUniqueNormalizedNames(state.blocks, "Block");
  const categoryIds = new Set(state.categories.map((item) => item.id));
  const tagIds = new Set(state.tags.map((item) => item.id));
  const unitIds = new Set(state.units.map((item) => item.id));
  for (const tag of state.tags) if (!categoryIds.has(tag.categoryId)) throw new ImportError("A Tag references a missing Category.", { tagId: tag.id });
  for (const input of state.actions) {
    const action = validateActionDefinition(input);
    if (action.tagIds.some((id) => !tagIds.has(id))) throw new ImportError("An Action references a missing Tag.", { actionId: action.id });
    if (action.result.mode === "measurement" && action.result.unitId && !unitIds.has(action.result.unitId)) throw new ImportError("An Action references a missing Unit.", { actionId: action.id });
  }
  for (const input of state.blocks) {
    const block = validateBlockDefinition(input);
    if (block.type === "target") validateTargetConfig(normalizeTargetConfig(block));
    if (block.direction === "avoid") validateAvoidEvaluation(block.typeConfig.avoidEvaluation || {});
  }
  validateBlockGraph(state);
  return { ok: true };
}

function validatePackage(input) {
  const pkg = migratePackage(input);
  if (!pkg || pkg.format !== "life-command") throw new ImportError("NOT A VALID LIFE COMMAND PACKAGE");
  if (Number(pkg.schemaVersion) > PACKAGE_SCHEMA_VERSION) throw new ImportError("THIS PACKAGE REQUIRES A NEWER LIFE COMMAND VERSION");
  if (Number(pkg.schemaVersion) !== PACKAGE_SCHEMA_VERSION) throw new ImportError("NOT A VALID LIFE COMMAND PACKAGE");
  if (!["action-package", "block-package", "style-package", "backup"].includes(pkg.packageType)) throw new ImportError("Package type is invalid.");
  if (typeof pkg.packageId !== "string" || !pkg.packageId || Number.isNaN(Date.parse(pkg.exportedAt)) || !Array.isArray(pkg.rootObjectIds) || !pkg.data || typeof pkg.data !== "object") throw new ImportError("Package envelope is invalid.");
  return { ok: true, package: pkg };
}

exports["validateState"] = validateState;
exports["validatePackage"] = validatePackage;
},
"js/domain/actions.js": function(module, exports, require) {
const { InvalidAvoidEvaluationError, ValidationError } = require("js/shared/errors.js");
const { normalizeName } = require("js/shared/validation.js");

const ACTION_DIRECTIONS = ["do", "avoid"];
const COMPLETION_METHODS = ["quantity", "time"];
const RESULT_TYPES = ["none", "percentage", "score", "measurement"];

function normalizeActionDefinition(action) {
  const completion = action.completion || action.completionConfiguration || {};
  const result = action.result || action.resultConfiguration || { mode: action.resultType || "none" };
  return {
    ...action,
    name: normalizeName(action.name),
    tagIds: Array.isArray(action.tagIds) ? [...action.tagIds] : [],
    direction: action.direction === "avoid" ? "avoid" : "do",
    completion: {
      method: completion.method || action.completionMethod || "quantity",
      target: completion.target ?? completion.minimum ?? 1,
      minimumMinutes: completion.minimumMinutes ?? completion.minutes ?? completion.target ?? 0
    },
    result: {
      mode: result.mode || action.resultType || "none",
      scoreMax: result.scoreMax ?? result.maximum ?? null,
      unitId: result.unitId ?? null,
      allowedUnitIds: Array.isArray(result.allowedUnitIds) ? [...result.allowedUnitIds] : (result.unitId ? [result.unitId] : [])
    },
    status: action.status === "archived" ? "archived" : "active"
  };
}

function validateActionDefinition(input) {
  const action = normalizeActionDefinition(input);
  if (!action.id || typeof action.id !== "string") throw new ValidationError("Action needs a stable ID.");
  if (!action.name) throw new ValidationError("Action name is required.");
  if (!ACTION_DIRECTIONS.includes(action.direction)) throw new ValidationError("Action direction is invalid.");
  if (!COMPLETION_METHODS.includes(action.completion.method)) throw new ValidationError("Action completion method is invalid.");
  if (action.completion.method === "quantity") {
    const target = Number(action.completion.target);
    if (!Number.isInteger(target) || target < 1) throw new ValidationError("Quantity target must be a whole number of at least 1.");
  } else if (Number(action.completion.minimumMinutes) < 0) {
    throw new ValidationError("Minimum time cannot be negative.");
  }
  if (!RESULT_TYPES.includes(action.result.mode)) throw new ValidationError("Action result type is invalid.");
  if (action.result.mode === "score" && !(Number(action.result.scoreMax) > 0)) throw new ValidationError("Score maximum must be greater than zero.");
  if (action.result.mode === "measurement" && action.result.unitId != null && typeof action.result.unitId !== "string") throw new ValidationError("Measurement Unit is invalid.");
  if (action.direction === "avoid" && action.avoidMetricHint && !["time", "count", "quantity"].includes(action.avoidMetricHint)) {
    throw new InvalidAvoidEvaluationError("Avoid metric hint is invalid.");
  }
  return action;
}

function createActionDefinition(input, { id, now }) {
  return validateActionDefinition({
    ...input,
    id,
    createdAt: now,
    updatedAt: now,
    status: input.status || "active"
  });
}

function updateActionDefinition(existing, patch, now) {
  if (!existing) throw new ValidationError("Existing Action is required.");
  return validateActionDefinition({ ...existing, ...patch, id: existing.id, createdAt: existing.createdAt, updatedAt: now });
}

exports["ACTION_DIRECTIONS"] = ACTION_DIRECTIONS;
exports["COMPLETION_METHODS"] = COMPLETION_METHODS;
exports["RESULT_TYPES"] = RESULT_TYPES;
exports["normalizeActionDefinition"] = normalizeActionDefinition;
exports["validateActionDefinition"] = validateActionDefinition;
exports["createActionDefinition"] = createActionDefinition;
exports["updateActionDefinition"] = updateActionDefinition;
},
"js/domain/blocks.js": function(module, exports, require) {
const { InvalidTargetError, ValidationError } = require("js/shared/errors.js");
const { normalizeName } = require("js/shared/validation.js");

const BLOCK_TYPES = ["cycle", "routine", "workflow", "project", "action_list", "collection", "target"];
const BLOCK_LIFECYCLE = ["library", "active", "paused", "archived"];

function normalizeBlockDefinition(block) {
  const type = BLOCK_TYPES.includes(block.type) ? block.type : (block.completion && block.completion.mode === "open" ? "action_list" : "routine");
  return {
    ...block,
    type,
    name: normalizeName(block.name),
    direction: block.direction === "avoid" ? "avoid" : "do",
    children: Array.isArray(block.children) ? block.children.map((child, index) => ({ ...child, order: child.order ?? index })) : [],
    completion: block.completion || { mode: ["action_list", "collection"].includes(type) ? "open" : "manual", threshold: 0, requiredRelIds: [], afterThreshold: "allow_extra" },
    typeConfig: block.typeConfig || {},
    projectTargets: Array.isArray(block.projectTargets) ? block.projectTargets : [],
    status: BLOCK_LIFECYCLE.includes(block.status) ? block.status : "active"
  };
}

function validateBlockDefinition(input) {
  const block = normalizeBlockDefinition(input);
  if (!block.id || typeof block.id !== "string") throw new ValidationError("Block needs a stable ID.");
  if (!block.name) throw new ValidationError("Block name is required.");
  if (!BLOCK_TYPES.includes(block.type)) throw new ValidationError("Block type is invalid.");
  if (!BLOCK_LIFECYCLE.includes(block.status)) throw new ValidationError("Block lifecycle state is invalid.");
  const relationIds = new Set();
  for (const child of block.children) {
    if (!child || typeof child.id !== "string" || !child.id) throw new ValidationError("Every child relationship needs a stable ID.");
    if (relationIds.has(child.id)) throw new ValidationError("Child relationship IDs must be unique inside a Block.");
    relationIds.add(child.id);
    if (!["action", "block"].includes(child.kind) || typeof child.refId !== "string") throw new ValidationError("A Block child relationship is invalid.");
    if (block.type === "cycle" && (!(Number(child.frequency ?? 1) >= 1) || !Number.isInteger(Number(child.frequency ?? 1)))) throw new ValidationError("Cycle frequency must be a whole number of at least 1.");
  }
  const required = block.completion.requiredRelIds || [];
  if (required.some((id) => !relationIds.has(id))) throw new ValidationError("Required children must be direct Block children.");
  if (block.type === "target") {
    const config = block.typeConfig || {};
    const metric = config.targetMetric || "time";
    if (!['time', 'quantity', 'completion_count'].includes(metric)) throw new InvalidTargetError("Target metric is invalid.");
    if (!(Number(config.targetValue) > 0)) throw new InvalidTargetError("Target value must be greater than zero.");
  }
  return block;
}

function createBlockDefinition(input, { id, now }) {
  return validateBlockDefinition({ ...input, id, createdAt: now, updatedAt: now, status: input.status || "active" });
}

function updateBlockDefinition(existing, patch, now) {
  if (!existing) throw new ValidationError("Existing Block is required.");
  return validateBlockDefinition({ ...existing, ...patch, id: existing.id, createdAt: existing.createdAt, updatedAt: now });
}

function isExecutableBlock(block) { return block && !["collection", "action_list"].includes(block.type); }

exports["BLOCK_TYPES"] = BLOCK_TYPES;
exports["BLOCK_LIFECYCLE"] = BLOCK_LIFECYCLE;
exports["normalizeBlockDefinition"] = normalizeBlockDefinition;
exports["validateBlockDefinition"] = validateBlockDefinition;
exports["createBlockDefinition"] = createBlockDefinition;
exports["updateBlockDefinition"] = updateBlockDefinition;
exports["isExecutableBlock"] = isExecutableBlock;
},
"js/domain/relationships.js": function(module, exports, require) {
const { CircularReferenceError, ConflictError, NotFoundError, ValidationError } = require("js/shared/errors.js");

function indexById(items) { return new Map((items || []).map((item) => [item.id, item])); }

function getBlockChildren(state, blockId) {
  const block = (state.blocks || []).find((item) => item.id === blockId);
  if (!block) throw new NotFoundError(`Block not found: ${blockId}`);
  const actions = indexById(state.actions);
  const blocks = indexById(state.blocks);
  return (block.children || []).map((relationship) => ({ relationship, object: relationship.kind === "action" ? actions.get(relationship.refId) : blocks.get(relationship.refId) })).filter((item) => item.object);
}

function getDescendantBlockIds(state, rootBlockId, includeRoot = false) {
  const blocks = indexById(state.blocks);
  if (!blocks.has(rootBlockId)) throw new NotFoundError(`Block not found: ${rootBlockId}`);
  const output = new Set(includeRoot ? [rootBlockId] : []);
  const stack = [rootBlockId];
  while (stack.length) {
    const id = stack.pop();
    const block = blocks.get(id);
    for (const child of block.children || []) {
      if (child.kind !== "block" || output.has(child.refId)) continue;
      output.add(child.refId);
      stack.push(child.refId);
    }
  }
  if (!includeRoot) output.delete(rootBlockId);
  return output;
}

function getDescendantActionIds(state, rootBlockId, direct = false) {
  const blocks = indexById(state.blocks);
  if (!blocks.has(rootBlockId)) throw new NotFoundError(`Block not found: ${rootBlockId}`);
  const output = new Set();
  const visitedBlocks = new Set();
  const stack = [rootBlockId];
  while (stack.length) {
    const id = stack.pop();
    if (visitedBlocks.has(id)) continue;
    visitedBlocks.add(id);
    const block = blocks.get(id);
    for (const child of block.children || []) {
      if (child.kind === "action") output.add(child.refId);
      else if (!direct && child.kind === "block") stack.push(child.refId);
    }
  }
  return output;
}

function getBlocksContainingAction(state, actionId, activeOnly = true) {
  return (state.blocks || []).filter((block) => (!activeOnly || block.status === "active") && getDescendantActionIds(state, block.id).has(actionId));
}

function validateBlockGraph(state) {
  const actions = indexById(state.actions);
  const blocks = indexById(state.blocks);
  const childBlockIds = new Set();
  for (const block of blocks.values()) {
    const directActions = new Set();
    const directBlocks = new Set();
    for (const child of block.children || []) {
      if (child.kind === "action") {
        if (!actions.has(child.refId)) throw new NotFoundError(`Block ${block.name} references a missing Action.`, { blockId: block.id, actionId: child.refId });
        if (directActions.has(child.refId)) throw new ConflictError(`${actions.get(child.refId).name} cannot appear twice directly inside ${block.name}.`);
        directActions.add(child.refId);
      } else if (child.kind === "block") {
        if (!blocks.has(child.refId)) throw new NotFoundError(`Block ${block.name} references a missing Block.`, { blockId: block.id, childBlockId: child.refId });
        if (directBlocks.has(child.refId)) throw new ConflictError(`${blocks.get(child.refId).name} cannot appear twice directly inside ${block.name}.`);
        directBlocks.add(child.refId);
        childBlockIds.add(child.refId);
      } else throw new ValidationError("Block child kind must be action or block.");
    }
  }

  const visit = (id, path, visiting) => {
    if (visiting.has(id)) {
      const names = [...path, id].map((item) => blocks.get(item)?.name || item);
      throw new CircularReferenceError(`Circular Block reference: ${names.join(" → ")}`, { path: [...path, id] });
    }
    const nextVisiting = new Set(visiting).add(id);
    for (const child of blocks.get(id).children || []) if (child.kind === "block") visit(child.refId, [...path, id], nextVisiting);
  };
  for (const id of blocks.keys()) visit(id, [], new Set());

  const roots = [...blocks.keys()].filter((id) => !childBlockIds.has(id));
  for (const rootId of roots) {
    const seen = new Map();
    const walk = (id, path) => {
      if (seen.has(id)) {
        const name = blocks.get(id).name;
        const existing = seen.get(id).map((item) => blocks.get(item)?.name || item).join(" → ");
        throw new ConflictError(`${name} cannot be added. It already exists at: ${existing}`, { rootId, blockId: id, existingPath: seen.get(id), rejectedPath: [...path, id] });
      }
      const currentPath = [...path, id];
      seen.set(id, currentPath);
      for (const child of blocks.get(id).children || []) if (child.kind === "block") walk(child.refId, currentPath);
    };
    walk(rootId, []);
  }
  return true;
}

exports["getBlockChildren"] = getBlockChildren;
exports["getDescendantBlockIds"] = getDescendantBlockIds;
exports["getDescendantActionIds"] = getDescendantActionIds;
exports["getBlocksContainingAction"] = getBlocksContainingAction;
exports["validateBlockGraph"] = validateBlockGraph;
},
"js/domain/avoid.js": function(module, exports, require) {
const { InvalidAvoidEvaluationError } = require("js/shared/errors.js");
const { calculatePeriodBounds } = require("js/shared/dates.js");
const { round } = require("js/shared/numbers.js");
const { aggregateLogsUnique } = require("js/domain/logs.js");
const { getDescendantActionIds } = require("js/domain/relationships.js");

function normalizeAvoidEvaluation(input = {}) {
  const mode = input.mode || "binary_limit";
  const metric = input.metric || "time";
  const anchors = Array.isArray(input.anchors) ? input.anchors.map((anchor) => ({ value: Number(anchor.value), score: Number(anchor.score) })).sort((a, b) => a.value - b.value) : [];
  return {
    mode,
    metric,
    period: typeof input.period === "string" ? { mode: input.period } : (input.period || { mode: "day" }),
    binaryLimit: Number(input.binaryLimit ?? 0),
    anchors,
    belowRange: input.belowRange || "clamp",
    aboveRange: input.aboveRange || "continue_slope",
    allowedCount: Number(input.allowedCount ?? 0),
    violationPenalty: Number(input.violationPenalty ?? 100),
    scope: input.scope || "aggregate",
    childOutcome: input.childOutcome || "any_required_failure",
    requiredChildBlockIds: Array.isArray(input.requiredChildBlockIds) ? input.requiredChildBlockIds : []
  };
}

function validateAvoidEvaluation(input) {
  const config = normalizeAvoidEvaluation(input);
  if (!["binary_limit", "scored_range", "violation_multiplier"].includes(config.mode)) throw new InvalidAvoidEvaluationError("Avoid evaluation mode is invalid.");
  if (!["time", "count", "quantity"].includes(config.metric)) throw new InvalidAvoidEvaluationError("Avoid metric is invalid.");
  if (config.binaryLimit < 0 || config.allowedCount < 0) throw new InvalidAvoidEvaluationError("Avoid limits cannot be negative.");
  if (config.mode === "scored_range") {
    if (config.anchors.length < 2) throw new InvalidAvoidEvaluationError("Scored Range needs at least two anchors.");
    const values = new Set();
    for (const anchor of config.anchors) {
      if (anchor.value < 0 || !Number.isFinite(anchor.value) || !Number.isFinite(anchor.score)) throw new InvalidAvoidEvaluationError("Avoid score anchors are invalid.");
      if (values.has(anchor.value)) throw new InvalidAvoidEvaluationError("Avoid score anchors cannot share the same value.");
      values.add(anchor.value);
    }
  }
  if (config.mode === "violation_multiplier" && !(config.violationPenalty > 0)) throw new InvalidAvoidEvaluationError("Violation penalty must be greater than zero.");
  return config;
}

function lineValue(a, b, value) {
  if (b.value === a.value) return b.score;
  return a.score + ((value - a.value) / (b.value - a.value)) * (b.score - a.score);
}

function interpolateAvoidScore(value, input) {
  const config = validateAvoidEvaluation({ ...input, mode: "scored_range" });
  const anchors = config.anchors;
  if (value <= anchors[0].value) return round(config.belowRange === "continue_slope" ? lineValue(anchors[0], anchors[1], value) : anchors[0].score, 4);
  for (let index = 1; index < anchors.length; index += 1) {
    if (value <= anchors[index].value) return round(lineValue(anchors[index - 1], anchors[index], value), 4);
  }
  const last = anchors[anchors.length - 1];
  return round(config.aboveRange === "continue_slope" ? lineValue(anchors[anchors.length - 2], last, value) : last.score, 4);
}

function evaluateAvoidValue(actual, input) {
  const config = validateAvoidEvaluation(input);
  if (actual < 0) throw new InvalidAvoidEvaluationError("Avoid actual value cannot be negative.");
  if (config.mode === "binary_limit") {
    const passed = actual <= config.binaryLimit;
    return { mode: config.mode, actual, limit: config.binaryLimit, score: passed ? 100 : 0, failureLoad: passed ? 0 : 100, status: passed ? "success" : "failed", reachedFailure: !passed };
  }
  if (config.mode === "scored_range") {
    const score = interpolateAvoidScore(actual, config);
    return { mode: config.mode, actual, score, failureLoad: score < 0 ? Math.abs(score) : 0, status: score > 0 ? "success" : score === 0 ? "neutral" : "failed", reachedFailure: score < 0 };
  }
  const excess = Math.max(0, actual - config.allowedCount);
  const failureLoad = excess * config.violationPenalty;
  return { mode: config.mode, actual, allowedCount: config.allowedCount, score: excess === 0 ? 100 : null, failureLoad, status: excess === 0 ? "success" : "failed", reachedFailure: excess > 0 };
}

function evaluateAvoidPeriod({ state, block, now, timezone, bounds: suppliedBounds }) {
  const config = validateAvoidEvaluation(block.typeConfig && block.typeConfig.avoidEvaluation || {});
  const activeSession = (config.period.mode || config.period) === "session" ? [...(state.avoidPeriods || [])].reverse().find((item) => item.blockId === block.id && !item.closedAt && !item.periodEnd) : null;
  const bounds = suppliedBounds || (activeSession ? { start: activeSession.periodStart, end: activeSession.periodEnd, mode: "session" } : calculatePeriodBounds(config.period, now, timezone));
  const actionIds = getDescendantActionIds(state, block.id, false);
  const aggregate = aggregateLogsUnique(state.actionLogs || [], { metric: config.metric, actionIds, bounds });
  return { blockId: block.id, metric: config.metric, bounds, logIds: aggregate.logIds, ...evaluateAvoidValue(aggregate.actual, config) };
}

      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",

    guess += delta;

  const endParts = addCalendarDays(startParts, 7);

  const anchor = anchorValue ? toInstant(anchorValue) : zonedDateTimeToInstant({ year: 1970, month: 1, day: 1 }, timezone);

      if (key === "tags") incoming.categoryId = remap(incoming.categoryId);
      if (key === "actions") {

          requiredChildBlockIds: (incoming.typeConfig.avoidEvaluation.requiredChildBlockIds || []).map(remap),

  if (!sequence.length) return null;
  const current = getCurrentCyclePosition(cycleState, sequence.length);
  if (mode === "strict") return isEligible(sequence[current]) ? { item: sequence[current], position: current } : null;
  for (let offset = 0; offset < sequence.length; offset += 1) {
    const position = (current + offset) % sequence.length;
    if (isEligible(sequence[position])) return { item: sequence[position], position };
  }
  return null;
}

exports["distributeCycleFrequency"] = distributeCycleFrequency;
exports["getCurrentCyclePosition"] = getCurrentCyclePosition;
exports["advanceCycle"] = advanceCycle;
exports["applyCyclePeriodEnd"] = applyCyclePeriodEnd;
exports["applyMissedCycleItemPolicy"] = applyMissedCycleItemPolicy;
exports["resolveNextEligibleItem"] = resolveNextEligibleItem;
},

"js/application/selectors.js": function(module, exports, require) {
const { getBlockChildren, getDescendantBlockIds, getDescendantActionIds } = require("js/domain/relationships.js");
const { resolveOccurrenceStatus } = require("js/domain/occurrences.js");
const { RUNNING_RUN_STATUSES } = require("js/domain/runs.js");

function getActionById(state, id) { return (state.actions || []).find((item) => item.id === id) || null; }
function getBlockById(state, id) { return (state.blocks || []).find((item) => item.id === id) || null; }
function getActions(state, { status } = {}) { return (state.actions || []).filter((item) => !status || item.status === status); }
function getBlocks(state, { status, type } = {}) { return (state.blocks || []).filter((item) => (!status || item.status === status) && (!type || item.type === type)); }
function getActiveBlocks(state) { return getBlocks(state, { status: "active" }); }
function getRunningRuns(state) { return (state.runs || []).filter((item) => RUNNING_RUN_STATUSES.includes(item.status)); }
function getChildren(state, blockId) { return getBlockChildren(state, blockId); }
function getDescendants(state, blockId) { return { blockIds: [...getDescendantBlockIds(state, blockId)], actionIds: [...getDescendantActionIds(state, blockId)] }; }

function getOccurrenceView(state, occurrence, now) {
  const action = getActionById(state, occurrence.actionId);
  const block = getBlockById(state, occurrence.parentBlockId || occurrence.blockId || occurrence.contextBlockId);
  return { ...occurrence, status: resolveOccurrenceStatus(occurrence, now), actionName: action?.name || occurrence.actionNameSnapshot || "Unknown Action", direction: action?.direction || "do", blockName: block?.name || occurrence.blockNameSnapshot || "" };
}

function getDueOccurrences(state, now) {
  return (state.occurrences || []).map((item) => getOccurrenceView(state, item, now)).filter((item) => item.direction === "do" && ["due", "overdue", "partial", "available"].includes(item.status));
}

function getUpcomingOccurrences(state, now, limit = 5) {
  return (state.occurrences || []).map((item) => getOccurrenceView(state, item, now)).filter((item) => item.direction === "do" && item.status === "upcoming").sort((a, b) => new Date(a.availableAt) - new Date(b.availableAt)).slice(0, limit);
}

exports["getActionById"] = getActionById;
exports["getBlockById"] = getBlockById;
exports["getActions"] = getActions;
exports["getBlocks"] = getBlocks;
exports["getActiveBlocks"] = getActiveBlocks;
exports["getRunningRuns"] = getRunningRuns;
exports["getChildren"] = getChildren;
exports["getDescendants"] = getDescendants;
exports["getOccurrenceView"] = getOccurrenceView;
exports["getDueOccurrences"] = getDueOccurrences;
exports["getUpcomingOccurrences"] = getUpcomingOccurrences;
},

function createRun({ id, block, activation, now, snapshot }) {

"js/application/home.js": function(module, exports, require) {
const { calculateTargetProgress } = require("js/domain/targets.js");
const { evaluateAvoidActionPeriod, evaluateAvoidPeriod, normalizeAvoidEvaluation } = require("js/domain/avoid.js");
const { distributeCycleFrequency, resolveNextEligibleItem } = require("js/domain/cycles.js");
const { getDescendantActionIds } = require("js/domain/relationships.js");
const { getActionById, getBlockById, getDueOccurrences, getRunningRuns, getUpcomingOccurrences } = require("js/application/selectors.js");
const { ACTIVE_ACTIVATION_STATUSES } = require("js/domain/activations.js");

function targetCard(state, block, now, timezone) {
  const progress = calculateTargetProgress({ state, block, now, timezone });
  return { id: block.id, name: block.name, period: block.typeConfig?.period?.mode || block.typeConfig?.period || "all_time", ...progress };
}

function directAvoidActionItems(state, now, timezone) {
  const output = [];
  for (const block of (state.blocks || []).filter((item) => item.status === "active" && item.type === "action_list")) {
    for (const relationship of block.children || []) {
      if (relationship.kind !== "action") continue;
      const action = getActionById(state, relationship.refId);
      if (!action || action.direction !== "avoid") continue;
      const evaluation = normalizeAvoidEvaluation(relationship.avoidEvaluation || block.typeConfig?.avoidEvaluation || { mode: "binary_limit", metric: action.avoidMetricHint || (action.completion?.method === "time" ? "time" : "count"), binaryLimit: 0, period: { mode: "day" } });
      const result = evaluateAvoidActionPeriod({ logs: state.actionLogs, actionId: action.id, evaluation, now, timezone });
      output.push({ id: `${block.id}:${action.id}`, actionId: action.id, blockId: block.id, relationshipId: relationship.id, name: action.name, contextName: block.name, ...result });
    }
  }
  return output;
}

function currentCycleChoices(state) {
  const choices = [];
  for (const block of (state.blocks || []).filter((item) => item.type === "cycle" && item.status === "active")) {
    const activation = (state.activations || []).find((item) => item.blockId === block.id && ACTIVE_ACTIVATION_STATUSES.includes(item.status) && item.status !== "paused");
    if (!activation) continue;
    const sequence = activation.roundSnapshot || distributeCycleFrequency(block.children || []);
    const next = resolveNextEligibleItem(sequence, activation.cycleState || activation, () => true, block.typeConfig?.eligibilityMode || "next_eligible");
    if (next) choices.push({ kind: "cycle", blockId: block.id, blockName: block.name, relationshipId: next.item.id, refId: next.item.refId, refKind: next.item.kind, label: next.item.kind === "action" ? getActionById(state, next.item.refId)?.name : getBlockById(state, next.item.refId)?.name });
  }
  return choices;
}

function getHomeViewModel(state, { now, timezone }) {
  const running = getRunningRuns(state).map((run) => ({ ...run, block: getBlockById(state, run.blockId) }));
  const dueAll = getDueOccurrences(state, now);
  const overdue = dueAll.filter((item) => item.status === "overdue");
  const dueNow = dueAll.filter((item) => ["due", "partial", "available"].includes(item.status));
  const cycles = currentCycleChoices(state);
  const positiveTargets = (state.blocks || []).filter((block) => block.type === "target" && block.status === "active" && block.direction !== "avoid");
  const today = positiveTargets.filter((block) => (block.typeConfig?.period?.mode || block.typeConfig?.period) === "day").map((block) => targetCard(state, block, now, timezone));
  const thisWeek = positiveTargets.filter((block) => (block.typeConfig?.period?.mode || block.typeConfig?.period) === "week").map((block) => targetCard(state, block, now, timezone));
  const avoidBlocks = (state.blocks || []).filter((block) => block.status === "active" && block.direction === "avoid").map((block) => ({ id: block.id, name: block.name, ...evaluateAvoidPeriod({ state, block, now, timezone }) }));
  const avoid = [...avoidBlocks, ...directAvoidActionItems(state, now, timezone)];
  const project = state.settings?.primaryProjectId ? getBlockById(state, state.settings.primaryProjectId) : null;
  let nowChoices = [];
  if (running.length) nowChoices = running.map((item) => ({ kind: "run", id: item.id, label: item.block?.name || item.blockNameSnapshot }));
  else if (overdue.length) nowChoices = overdue.map((item) => ({ kind: "occurrence", id: item.id, label: item.actionName }));
  else if (dueNow.length) nowChoices = dueNow.map((item) => ({ kind: "occurrence", id: item.id, label: item.actionName }));
  else if (cycles.length) nowChoices = cycles;
  else {
    const approaching = [...today, ...thisWeek].filter((item) => !item.reached && item.actual > 0).sort((a, b) => b.percentage - a.percentage);
    nowChoices = approaching.slice(0, approaching.length && approaching[0].percentage === approaching[1]?.percentage ? 2 : 1).map((item) => ({ kind: "target", id: item.id, label: item.name }));
  }
  const recentActionIds = [...(state.actionLogs || [])].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map((item) => item.actionId);
  const quickLog = [...new Set(recentActionIds.concat((state.actions || []).filter((item) => item.status === "active").map((item) => item.id)))].map((id) => getActionById(state, id)).filter(Boolean);
  return { now, nowChoices, running, due: { overdue, dueNow, laterToday: [] }, avoid, today, thisWeek, currentProject: project, upcoming: getUpcomingOccurrences(state, now, 5), quickLog };
}

exports["getHomeViewModel"] = getHomeViewModel;
},

}
