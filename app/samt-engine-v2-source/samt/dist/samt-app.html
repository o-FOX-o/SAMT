"js/ui/block-detail-view.js": function(module, exports, require) {
const { badge, escapeHtml, formatDateTime, formatMetric, titleCase } = require("js/ui/format.js");

const OPEN_OCCURRENCE_STATES = new Set(["upcoming", "available", "due", "overdue", "partial", "paused"]);

function childRows(detail) {
  const children = detail.children || [];
  if (!children.length) return '<div class="empty">This Block has no children yet.</div>';
  return children.map(({ relationship, object }) => `<article class="row"><div class="row-main"><strong class="row-title">${escapeHtml(object.name)}</strong><div class="row-meta"><span>${escapeHtml(titleCase(relationship.kind))}</span>${relationship.frequency ? `<span>Frequency ${escapeHtml(relationship.frequency)}</span>` : ""}${relationship.required ? "<span>Required</span>" : ""}</div></div>${relationship.kind === "block" ? `<a class="btn btn-small" href="#/blocks/${encodeURIComponent(object.id)}">Open</a>` : `<div class="inline"><a class="btn btn-small" href="#/actions/${encodeURIComponent(object.id)}">Open</a><button class="btn btn-primary btn-small" data-action="log-action" data-id="${escapeHtml(object.id)}">Log</button></div>`}</article>`).join("");
}

function occurrenceRows(detail) {
  const occurrences = [...(detail.occurrences || [])].sort((a, b) => Date.parse(b.availableAt || b.createdAt || 0) - Date.parse(a.availableAt || a.createdAt || 0));
  if (!occurrences.length) return "";
  return `<section class="card section"><div class="section-head"><h2>Occurrences</h2><span class="badge">${occurrences.length}</span></div>${occurrences.slice(0, 20).map((item) => `<article class="row"><div class="row-main"><div class="inline"><a class="row-title" href="#/actions/${encodeURIComponent(item.actionId)}">${escapeHtml(item.actionName)}</a>${badge(item.status)}</div><div class="row-meta">${item.availableAt ? `<span>Available ${escapeHtml(formatDateTime(item.availableAt, true))}</span>` : ""}${item.dueAt ? `<span>Due ${escapeHtml(formatDateTime(item.dueAt, true))}</span>` : ""}</div></div>${OPEN_OCCURRENCE_STATES.has(item.status) ? `<div class="inline"><button class="btn btn-primary btn-small" data-action="log-occurrence" data-id="${escapeHtml(item.actionId)}" data-occurrence-id="${escapeHtml(item.id)}">Log</button><button class="btn btn-ghost btn-small" data-action="skip-occurrence" data-id="${escapeHtml(item.id)}">Skip</button></div>` : ""}</article>`).join("")}</section>`;
}

function runtimeControls(detail, block) {
  const controls = [];
  if (block.type === "target") {
    const periodMode = block.direction === "avoid" ? block.typeConfig?.avoidEvaluation?.period?.mode : block.typeConfig?.period?.mode;
    if (periodMode === "session") {
      if (detail.activePeriod) controls.push(`<button class="btn btn-primary" data-action="close-period" data-id="${escapeHtml(detail.activePeriod.id)}">Finish session</button>`);
      else controls.push(`<button class="btn btn-primary" data-action="start-block" data-id="${escapeHtml(block.id)}">Start session</button>`);
    }
  } else if (["cycle", "routine", "workflow", "project"].includes(block.type)) {
    if (!detail.currentRun) controls.push(`<button class="btn btn-primary" data-action="start-block" data-id="${escapeHtml(block.id)}">Start Run</button>`);
    else if (detail.currentRun.status === "paused") controls.push(`<button class="btn btn-primary" data-action="resume-run" data-id="${escapeHtml(detail.currentRun.id)}">Resume Run</button>`);
    else controls.push(`<button class="btn" data-action="pause-run" data-id="${escapeHtml(detail.currentRun.id)}">Pause Run</button>`);
    if (detail.currentRun) controls.push(`<button class="btn" data-action="finish-run" data-id="${escapeHtml(detail.currentRun.id)}">Finish Run</button>`);
  }
  if (block.type === "cycle" && detail.activeActivation && detail.cycle?.relationship) controls.push(`<button class="btn" data-action="advance-cycle" data-id="${escapeHtml(detail.activeActivation.id)}">Advance Cycle</button>`);
  if (block.type === "project" && !detail.isPrimaryProject) controls.push(`<button class="btn" data-action="set-primary-project" data-id="${escapeHtml(block.id)}">Make Primary</button>`);
  return controls.join("");
}

function runtimeState(detail, block) {
  const sections = [];
  if (detail.currentRun) {
    const progress = detail.currentRun.progress || {};
    const completed = progress.completed ?? progress.completedChildren;
    const total = progress.total ?? progress.totalChildren;
    sections.push(`<article class="card card-plain"><div class="split"><strong>Current Run</strong>${badge(detail.currentRun.status)}</div>${completed != null && total != null ? `<p class="metric-value">${escapeHtml(completed)} <span class="muted">/ ${escapeHtml(total)} children</span></p>` : ""}<p class="muted">Started ${escapeHtml(formatDateTime(detail.currentRun.startAt))}</p></article>`);
  }
  if (block.type === "cycle" && detail.cycle) {
    sections.push(`<article class="card card-plain"><div class="split"><strong>Next Cycle item</strong>${badge(detail.activeCyclePeriod?.status || "ready")}</div><p class="metric-value">${escapeHtml(detail.cycle.object?.name || "No eligible item")}</p><p class="muted">Position ${detail.cycle.sequenceLength ? detail.cycle.position + 1 : 0} of ${detail.cycle.sequenceLength}</p></article>`);
  }
  return sections.length ? `<section class="grid-2 section">${sections.join("")}</section>` : "";
}

function renderBlockDetailView(detail, progress = null) {
  const block = detail.block || { id: detail.blockId, type: detail.type, name: detail.name };
  if (!block?.id) return '<main class="page-shell"><div class="empty">Block not found.</div></main>';
  const controls = runtimeControls(detail, block);
  return `<main class="page-shell"><header class="page-head"><div class="page-head-copy"><span class="eyebrow">${escapeHtml(titleCase(block.type))}</span><div class="inline"><h1>${escapeHtml(block.name)}</h1>${badge(block.status)}${block.direction === "avoid" ? badge("avoid") : ""}</div><p class="muted">${escapeHtml(block.description || "Open is the runtime view. Edit changes the reusable definition.")}</p></div><div class="inline"><a class="btn" href="#/blocks/${encodeURIComponent(block.id)}/edit">Edit</a>${controls}</div></header>${runtimeState(detail, block)}${progress ? `<section class="card section"><div class="split"><h2>Current period</h2>${badge(progress.status)}</div><div class="metric-value">${escapeHtml(formatMetric(progress.actual, progress.metric))} <span class="muted">/ ${escapeHtml(formatMetric(progress.target ?? progress.limit ?? 0, progress.metric))}</span></div>${progress.percentage != null ? `<div class="progress"><span style="--progress:${Math.min(100, progress.percentage)}%"></span></div>` : ""}</section>` : ""}<section class="card section"><div class="section-head"><h2>Children</h2><span class="badge">${(detail.children || []).length}</span></div><div>${childRows(detail)}</div></section>${occurrenceRows(detail)}</main>`;
}

exports["renderBlockDetailView"] = renderBlockDetailView;
},
"js/ui/block-edit-view.js": function(module, exports, require) {
const { escapeHtml, titleCase } = require("js/ui/format.js");

function childRows(detail) {
  if (!detail.children?.length) return '<div class="empty">No children yet. Add an existing Action or Block by stable identity.</div>';
  return detail.children.map(({ relationship, object }) => `<article class="row"><div class="row-main"><strong class="row-title">${escapeHtml(object.name)}</strong><div class="row-meta"><span>${escapeHtml(titleCase(relationship.kind))}</span>${relationship.frequency ? `<span>Frequency ${escapeHtml(relationship.frequency)}</span>` : ""}${relationship.required ? "<span>Required</span>" : ""}</div></div><button type="button" class="btn btn-ghost btn-small" data-action="remove-block-child" data-id="${escapeHtml(detail.block.id)}" data-relationship-id="${escapeHtml(relationship.id)}">Remove</button></article>`).join("");
}

function renderBlockEditView(detail) {
  const block = detail?.block;
  if (!block) return '<main class="page-shell"><div class="empty">Block not found.</div></main>';
  return `<main class="page-shell"><header class="page-head"><div class="page-head-copy"><span class="eyebrow">Edit definition</span><h1>${escapeHtml(block.name)}</h1><p class="muted">This edits the same stable Block ID. It does not create a replacement.</p></div><a class="btn" href="#/blocks/${encodeURIComponent(block.id)}">Open runtime view</a></header><form class="card form-grid" data-edit-block-form data-id="${escapeHtml(block.id)}"><label class="field"><span class="label">Name</span><input class="input" name="name" required maxlength="100" value="${escapeHtml(block.name)}"></label><label class="field"><span class="label">Type</span><input class="input" value="${escapeHtml(titleCase(block.type))}" disabled></label><label class="field"><span class="label">Lifecycle</span><select class="select" name="status">${["library", "active", "paused", "archived"].map((status) => `<option value="${status}" ${block.status === status ? "selected" : ""}>${escapeHtml(titleCase(status))}</option>`).join("")}</select></label><label class="field field-full"><span class="label">Description</span><textarea class="textarea" name="description">${escapeHtml(block.description || "")}</textarea></label><div class="inline field-full"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-ghost" href="#/blocks/${encodeURIComponent(block.id)}">Cancel</a></div></form><section class="card section"><div class="section-head"><div><span class="eyebrow">Structure</span><h2>Children</h2></div><button type="button" class="btn btn-primary btn-small" data-action="add-block-child" data-id="${escapeHtml(block.id)}">Add Child</button></div>${childRows(detail)}</section></main>`;
}

exports["renderBlockEditView"] = renderBlockEditView;
},
"js/ui/analysis-view.js": function(module, exports, require) {
const { badge, escapeHtml, formatMetric, titleCase } = require("js/ui/format.js");

function renderAnalysisView(model) {
  return `<main class="page-shell"><header class="page-head"><div class="page-head-copy"><span class="eyebrow">Derived from facts</span><h1>Analysis</h1><p class="muted">Global totals deduplicate Action Log IDs. Block totals distinguish direct from recursively attributed activity.</p></div></header><section class="grid"><article class="card metric"><span class="muted">Global unique logged time</span><strong class="metric-value">${escapeHtml(formatMetric(model.global.uniqueTime, "time"))}</strong></article><article class="card metric"><span class="muted">Unique Action Logs</span><strong class="metric-value">${model.global.actionLogs}</strong></article><article class="card metric"><span class="muted">Completed Runs</span><strong class="metric-value">${model.global.completedRuns}</strong></article></section><section class="card section"><div class="section-head"><h2>Attributed Block activity</h2><span class="badge">${model.blocks.length}</span></div>${model.blocks.length ? model.blocks.map((item) => `<article class="row"><div class="row-main"><a class="row-title" href="#/blocks/${encodeURIComponent(item.id)}">${escapeHtml(item.name)}</a><div class="row-meta"><span>${escapeHtml(titleCase(item.type))}</span><span>${item.activityCount} inclusive logs</span><span>${escapeHtml(formatMetric(item.directTime, "time"))} direct</span></div></div><strong>${escapeHtml(formatMetric(item.attributedTime, "time"))} inclusive</strong></article>`).join("") : '<div class="empty">No activity to analyse yet.</div>'}</section><section class="grid-2 section"><article class="card"><div class="section-head"><h2>Targets</h2></div>${model.targets.length ? model.targets.map((item) => `<div class="row"><div><strong>${escapeHtml(model.blocks.find((block) => block.id === item.blockId)?.name || item.blockId)}</strong></div>${badge(item.status)}</div>`).join("") : '<div class="empty">No Target Blocks.</div>'}</article><article class="card"><div class="section-head"><h2>Avoid</h2></div>${model.avoid.length ? model.avoid.map((item) => `<div class="row"><div><strong>${escapeHtml(model.blocks.find((block) => block.id === item.blockId)?.name || item.blockId)}</strong></div>${badge(item.status)}</div>`).join("") : '<div class="empty">No Avoid Blocks.</div>'}</article></section></main>`;
}

exports["renderAnalysisView"] = renderAnalysisView;
},
"js/ui/history-view.js": function(module, exports, require) {
const { escapeHtml, formatDateTime, titleCase } = require("js/ui/format.js");

function renderHistoryView(history) {
  const sorted = [...history].sort((a, b) => new Date(b.timestamp || b.createdAt) - new Date(a.timestamp || a.createdAt));
  return `<main class="page-shell"><header class="page-head"><div class="page-head-copy"><span class="eyebrow">Factual ledger</span><h1>History</h1><p class="muted">Facts and lifecycle evaluations. Analysis reads these records.</p></div></header><section class="card">${sorted.length ? sorted.map((item) => `<article class="row"><div class="row-main"><strong class="row-title">${escapeHtml(item.nameSnapshot || titleCase(item.event || item.type))}</strong><div class="row-meta"><span>${escapeHtml(titleCase(item.event || item.type))}</span><span>${escapeHtml(formatDateTime(item.timestamp || item.createdAt))}</span></div></div></article>`).join("") : '<div class="empty">History is empty.</div>'}</section></main>`;
}

exports["renderHistoryView"] = renderHistoryView;
},
"js/ui/settings-view.js": function(module, exports, require) {
const { escapeHtml } = require("js/ui/format.js");

function renderSettingsView(state) {
  const mode = state.settings?.appearanceMode || "system";
  const savedCount = (state.actions || []).length + (state.blocks || []).length + (state.actionLogs || []).length + (state.history || []).length;
  const latestRestore = [...(state.restorePoints || [])].reverse()[0];
  const bin = state.bin || [];
  const binRows = bin.length ? bin.map((item) => `<article class="row"><div class="row-main"><strong>${escapeHtml(item.nameSnapshot)}</strong><div class="row-meta"><span>${escapeHtml(item.objectType)}</span><span>Restore before ${escapeHtml(new Date(item.purgeAt).toLocaleDateString())}</span></div></div><button class="btn btn-small" data-action="restore-definition" data-id="${escapeHtml(item.id)}">Restore</button></article>`).join("") : '<div class="empty">The Bin is empty.</div>';
  return `<main class="page-shell"><header class="page-head"><div class="page-head-copy"><span class="eyebrow">System</span><h1>Settings</h1><p class="muted">Storage, portability and simple reference-client presentation.</p></div></header><section class="grid-2"><article class="card section"><div><span class="eyebrow">Appearance placeholder</span><h2>Reference UI</h2><p class="muted">Design and colour controls are intentionally disabled until a future client replaces this UI.</p></div><div class="field"><span class="label">Design</span><button class="btn" disabled>Default</button></div><div class="field"><span class="label">Mode</span><div class="segmented">${["light", "dark", "system"].map((item) => `<button type="button" class="btn" aria-pressed="${mode === item}" data-action="set-mode" data-mode="${item}">${escapeHtml(item[0].toUpperCase() + item.slice(1))}</button>`).join("")}</div></div><div class="field"><span class="label">Colour placeholders</span><div class="inline"><button class="btn" disabled>Blue</button><button class="btn" disabled>Green</button><button class="btn" disabled>Gold</button></div></div></article><article class="card section"><div><span class="eyebrow">Storage continuity</span><h2>Your existing SAMT database</h2><p class="muted">The legacy IndexedDB database, object store and recovery keys are unchanged.</p></div><div class="metric"><span class="muted">Saved records</span><strong class="metric-value">${savedCount}</strong></div><p class="muted">Android can isolate different downloaded content:// files. If an older download has data this file cannot see, export a Full Backup from the older file and import it here.</p></article></section><section class="card section"><div class="section-head"><div><span class="eyebrow">Data</span><h2>Import and export</h2></div></div><div class="inline"><button class="btn btn-primary" data-action="export-backup">Export Everything</button><button class="btn" data-action="import-backup">Import Package</button>${latestRestore ? `<button class="btn" data-action="undo-import" data-id="${escapeHtml(latestRestore.id)}">Undo latest import</button>` : ""}</div><p class="muted">Normal packages are blueprints. A Full Backup carries the complete factual state through its export timestamp.</p></section><section class="card danger-zone section"><div class="section-head"><div><span class="eyebrow">Safety</span><h2>Bin</h2><p class="muted">Deleted definitions remain recoverable for ten days. Restoring a definition does not reopen cancelled Runs or skipped Occurrences.</p></div><span class="badge">${bin.length} items</span></div>${binRows}</section></main>`;
}

exports["renderSettingsView"] = renderSettingsView;
}
};
const cache = Object.create(null);
function require(id) {
  if (cache[id]) return cache[id].exports;
  if (!modules[id]) throw new Error("Missing module: " + id);
  const module = { exports: {} };
  cache[id] = module;
  modules[id](module, module.exports, require);
  return module.exports;
}
require("js/main.js");
})();
</script>
