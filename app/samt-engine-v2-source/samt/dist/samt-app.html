    const missed = block.typeConfig.missedItemPolicy || block.typeConfig.missedItem || "keep";
    if (!["continue", "restart", "restart_from_beginning"].includes(position)) throw new ValidationError("Cycle position policy is invalid.");
    if (!["keep", "keep_position", "skip", "skip_to_next", "restart", "restart_cycle"].includes(missed)) throw new ValidationError("Cycle missed-item policy is invalid.");
  }
  return block;
}

function createBlockDefinition(input, { id, now }) {
  return validateBlockDefinition({ ...input, id, createdAt: now, updatedAt: now, status: input.status || "active" });
}

function updateBlockDefinition(existing, patch, now) {
  if (!existing) throw new ValidationError("Existing Block is required.");
  return validateBlockDefinition({ ...existing, ...patch, id: existing.id, createdAt: existing.createdAt, updatedAt: now });
}

function isExecutableBlock(block) { return Boolean(block && ["cycle", "routine", "workflow", "project"].includes(block.type)); }

exports["BLOCK_TYPES"] = BLOCK_TYPES;
exports["BLOCK_LIFECYCLE"] = BLOCK_LIFECYCLE;
exports["COMPLETION_MODES"] = COMPLETION_MODES;
exports["normalizeBlockDefinition"] = normalizeBlockDefinition;
exports["validateBlockDefinition"] = validateBlockDefinition;
exports["createBlockDefinition"] = createBlockDefinition;
exports["updateBlockDefinition"] = updateBlockDefinition;
exports["isExecutableBlock"] = isExecutableBlock;
},
"js/domain/relationships.js": function(module, exports, require) {
const { CircularReferenceError, ConflictError, NotFoundError, ValidationError } = require("js/shared/errors.js");

function indexById(items) { return new Map((items || []).map((item) => [item.id, item])); }

function getBlockChildren(state, blockId) {
  const block = (state.blocks || []).find((item) => item.id === blockId);
  if (!block) throw new NotFoundError(`Block not found: ${blockId}`);
  const actions = indexById(state.actions);
  const blocks = indexById(state.blocks);
  return (block.children || []).map((relationship) => ({ relationship, object: relationship.kind === "action" ? actions.get(relationship.refId) : blocks.get(relationship.refId) })).filter((item) => item.object);
}

function getDescendantBlockIds(state, rootBlockId, includeRoot = false) {
  const blocks = indexById(state.blocks);
  if (!blocks.has(rootBlockId)) throw new NotFoundError(`Block not found: ${rootBlockId}`);
  const output = new Set(includeRoot ? [rootBlockId] : []);
  const stack = [rootBlockId];
  while (stack.length) {
    const id = stack.pop();
    const block = blocks.get(id);
    for (const child of block.children || []) {
      if (child.kind !== "block" || output.has(child.refId)) continue;
      output.add(child.refId);
      stack.push(child.refId);
    }
  }
  if (!includeRoot) output.delete(rootBlockId);
  return output;
}

function getDescendantActionIds(state, rootBlockId, direct = false) {
  const blocks = indexById(state.blocks);
  if (!blocks.has(rootBlockId)) throw new NotFoundError(`Block not found: ${rootBlockId}`);
  const output = new Set();
  const visitedBlocks = new Set();
  const stack = [rootBlockId];
  while (stack.length) {
    const id = stack.pop();
    if (visitedBlocks.has(id)) continue;
    visitedBlocks.add(id);
    const block = blocks.get(id);
    for (const child of block.children || []) {
      if (child.kind === "action") output.add(child.refId);
      else if (!direct && child.kind === "block") stack.push(child.refId);
    }
  }
  return output;
}

function getBlocksContainingAction(state, actionId, activeOnly = true) {
  return (state.blocks || []).filter((block) => (!activeOnly || block.status === "active") && getDescendantActionIds(state, block.id).has(actionId));
}

function validateBlockGraph(state) {
  const actions = indexById(state.actions);
  const blocks = indexById(state.blocks);
  const childBlockIds = new Set();
  for (const block of blocks.values()) {
    const directActions = new Set();
    const directBlocks = new Set();
    for (const child of block.children || []) {
      if (child.kind === "action") {
        if (!actions.has(child.refId)) throw new NotFoundError(`Block ${block.name} references a missing Action.`, { blockId: block.id, actionId: child.refId });
        if (directActions.has(child.refId)) throw new ConflictError(`${actions.get(child.refId).name} cannot appear twice directly inside ${block.name}.`);
        directActions.add(child.refId);
      } else if (child.kind === "block") {
        if (!blocks.has(child.refId)) throw new NotFoundError(`Block ${block.name} references a missing Block.`, { blockId: block.id, childBlockId: child.refId });
        if (directBlocks.has(child.refId)) throw new ConflictError(`${blocks.get(child.refId).name} cannot appear twice directly inside ${block.name}.`);
        directBlocks.add(child.refId);
        childBlockIds.add(child.refId);
      } else throw new ValidationError("Block child kind must be action or block.");
    }
  }

  const visit = (id, path, visiting) => {
    if (visiting.has(id)) {
      const names = [...path, id].map((item) => blocks.get(item)?.name || item);
      throw new CircularReferenceError(`Circular Block reference: ${names.join(" → ")}`, { path: [...path, id] });
    }
    const nextVisiting = new Set(visiting).add(id);
    for (const child of blocks.get(id).children || []) if (child.kind === "block") visit(child.refId, [...path, id], nextVisiting);
  };
  for (const id of blocks.keys()) visit(id, [], new Set());

  const roots = [...blocks.keys()].filter((id) => !childBlockIds.has(id));
  for (const rootId of roots) {
    const seen = new Map();
    const walk = (id, path) => {
      if (seen.has(id)) {
        const name = blocks.get(id).name;
        const existing = seen.get(id).map((item) => blocks.get(item)?.name || item).join(" → ");
        throw new ConflictError(`${name} cannot be added. It already exists at: ${existing}`, { rootId, blockId: id, existingPath: seen.get(id), rejectedPath: [...path, id] });
      }
      const currentPath = [...path, id];
      seen.set(id, currentPath);
      for (const child of blocks.get(id).children || []) if (child.kind === "block") walk(child.refId, currentPath);
    };
    walk(rootId, []);
  }
  return true;
}

exports["getBlockChildren"] = getBlockChildren;
exports["getDescendantBlockIds"] = getDescendantBlockIds;
exports["getDescendantActionIds"] = getDescendantActionIds;
exports["getBlocksContainingAction"] = getBlocksContainingAction;
exports["validateBlockGraph"] = validateBlockGraph;
},

const { InvalidAvoidEvaluationError } = require("js/shared/errors.js");
const { calculatePeriodBounds } = require("js/shared/dates.js");
const { round } = require("js/shared/numbers.js");
const { aggregateLogsUnique } = require("js/domain/logs.js");
const { getDescendantActionIds } = require("js/domain/relationships.js");
const { validatePeriodDefinition } = require("js/domain/periods.js");

function normalizeAvoidEvaluation(input = {}) {
  const mode = input.mode || "binary_limit";
  const metric = input.metric || "time";
  const anchors = Array.isArray(input.anchors) ? input.anchors.map((anchor) => ({ value: Number(anchor.value), score: Number(anchor.score) })).sort((a, b) => a.value - b.value) : [];
  return {
    mode,
    metric,
    period: typeof input.period === "string" ? { mode: input.period } : (input.period || { mode: "day" }),
    binaryLimit: Number(input.binaryLimit ?? 0),
    anchors,
    belowRange: input.belowRange || "clamp",
    aboveRange: input.aboveRange || "continue_slope",
    allowedCount: Number(input.allowedCount ?? 0),
    violationPenalty: Number(input.violationPenalty ?? 100),
    scope: input.scope || "aggregate",
    childOutcome: input.childOutcome || "any_required_failure",
    requiredChildBlockIds: Array.isArray(input.requiredChildBlockIds) ? input.requiredChildBlockIds : []
  };
}

function validateAvoidEvaluation(input) {
  const config = normalizeAvoidEvaluation(input);
  if (!["binary_limit", "scored_range", "violation_multiplier"].includes(config.mode)) throw new InvalidAvoidEvaluationError("Avoid evaluation mode is invalid.");
  if (!["time", "count", "quantity"].includes(config.metric)) throw new InvalidAvoidEvaluationError("Avoid metric is invalid.");
  if (config.binaryLimit < 0 || config.allowedCount < 0) throw new InvalidAvoidEvaluationError("Avoid limits cannot be negative.");
  if (config.mode === "scored_range") {
    if (config.anchors.length < 2) throw new InvalidAvoidEvaluationError("Scored Range needs at least two anchors.");
    const values = new Set();
    for (const anchor of config.anchors) {
      if (anchor.value < 0 || !Number.isFinite(anchor.value) || !Number.isFinite(anchor.score)) throw new InvalidAvoidEvaluationError("Avoid score anchors are invalid.");
      if (values.has(anchor.value)) throw new InvalidAvoidEvaluationError("Avoid score anchors cannot share the same value.");
      values.add(anchor.value);
    }
  }
  if (config.mode === "violation_multiplier" && !(config.violationPenalty > 0)) throw new InvalidAvoidEvaluationError("Violation penalty must be greater than zero.");

  catch (error) { throw new InvalidAvoidEvaluationError(error.message, error.details); }
  return config;
}

function lineValue(a, b, value) {
  if (b.value === a.value) return b.score;
  return a.score + ((value - a.value) / (b.value - a.value)) * (b.score - a.score);
}

function interpolateAvoidScore(value, input) {
  const config = validateAvoidEvaluation({ ...input, mode: "scored_range" });
  const anchors = config.anchors;
  if (value <= anchors[0].value) return round(config.belowRange === "continue_slope" ? lineValue(anchors[0], anchors[1], value) : anchors[0].score, 4);
  for (let index = 1; index < anchors.length; index += 1) {
    if (value <= anchors[index].value) return round(lineValue(anchors[index - 1], anchors[index], value), 4);
  }
  const last = anchors[anchors.length - 1];
  return round(config.aboveRange === "continue_slope" ? lineValue(anchors[anchors.length - 2], last, value) : last.score, 4);
}

function evaluateAvoidValue(actual, input) {
  const config = validateAvoidEvaluation(input);
  if (actual < 0) throw new InvalidAvoidEvaluationError("Avoid actual value cannot be negative.");
  if (config.mode === "binary_limit") {
    const passed = actual <= config.binaryLimit;
    return { mode: config.mode, actual, limit: config.binaryLimit, score: passed ? 100 : 0, failureLoad: passed ? 0 : 100, status: passed ? "success" : "failed", reachedFailure: !passed };
  }
  if (config.mode === "scored_range") {
    const score = interpolateAvoidScore(actual, config);
    return { mode: config.mode, actual, score, failureLoad: score < 0 ? Math.abs(score) : 0, status: score > 0 ? "success" : score === 0 ? "neutral" : "failed", reachedFailure: score < 0 };
  }
  const excess = Math.max(0, actual - config.allowedCount);
  const failureLoad = excess * config.violationPenalty;
  return { mode: config.mode, actual, allowedCount: config.allowedCount, score: excess === 0 ? 100 : null, failureLoad, status: excess === 0 ? "success" : "failed", reachedFailure: excess > 0 };
}

  const activePeriod = [...(state.avoidPeriods || [])].reverse().find((item) => item.blockId === block.id && !item.closedAt && item.lifecycleStatus !== "closed");
  const config = validateAvoidEvaluation(suppliedConfig || activePeriod?.evaluationSnapshot || activePeriod?.targetSnapshot || block.typeConfig && block.typeConfig.avoidEvaluation || {});
  const bounds = suppliedBounds || (activePeriod ? { start: activePeriod.periodStart, end: activePeriod.periodEnd, mode: config.period.mode || config.period } : calculatePeriodBounds(config.period, now, timezone));

  return { blockId: block.id, metric: config.metric, bounds, logIds: aggregate.logIds, ...evaluateAvoidValue(aggregate.actual, config) };
}

function evaluateAvoidActionPeriod({ logs, actionId, evaluation, now, timezone, bounds: suppliedBounds }) {
  const config = validateAvoidEvaluation(evaluation || {});
  const bounds = suppliedBounds || calculatePeriodBounds(config.period, now, timezone);
  const aggregate = aggregateLogsUnique(logs || [], { metric: config.metric, actionIds: [actionId], bounds });
  return { actionId, metric: config.metric, bounds, logIds: aggregate.logIds, ...evaluateAvoidValue(aggregate.actual, config) };
}

exports["normalizeAvoidEvaluation"] = normalizeAvoidEvaluation;
exports["validateAvoidEvaluation"] = validateAvoidEvaluation;
exports["interpolateAvoidScore"] = interpolateAvoidScore;
exports["evaluateAvoidValue"] = evaluateAvoidValue;
exports["evaluateAvoidPeriod"] = evaluateAvoidPeriod;
exports["evaluateAvoidActionPeriod"] = evaluateAvoidActionPeriod;
},
"js/shared/dates.js": function(module, exports, require) {
const { ValidationError } = require("js/shared/errors.js");

const formatterCache = new Map();

function formatter(timezone) {
  if (!timezone) throw new ValidationError("An explicit timezone is required.");
  if (!formatterCache.has(timezone)) {
    formatterCache.set(timezone, new Intl.DateTimeFormat("en-CA", {
      timeZone: timezone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    }));
  }
  return formatterCache.get(timezone);
}

function toInstant(value) {
  const date = value instanceof Date ? new Date(value.getTime()) : new Date(value);
  if (Number.isNaN(date.getTime())) throw new ValidationError("Invalid date/time.", { value });
  return date;
}

function zonedParts(value, timezone) {
  const parts = formatter(timezone).formatToParts(toInstant(value));
  const output = {};
  for (const part of parts) if (part.type !== "literal") output[part.type] = Number(part.value);
  return { year: output.year, month: output.month, day: output.day, hour: output.hour, minute: output.minute, second: output.second };
}

function zonedDateTimeToInstant(parts, timezone) {
  const desired = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour || 0, parts.minute || 0, parts.second || 0, parts.millisecond || 0);
  let guess = desired;
  for (let index = 0; index < 5; index += 1) {
    const actualParts = zonedParts(new Date(guess), timezone);
    const actual = Date.UTC(actualParts.year, actualParts.month - 1, actualParts.day, actualParts.hour, actualParts.minute, actualParts.second, parts.millisecond || 0);
    const delta = desired - actual;
    guess += delta;
    if (delta === 0) break;
  }
  return new Date(guess);
}

function addCalendarDays(parts, amount) {
  const date = new Date(Date.UTC(parts.year, parts.month - 1, parts.day + amount));
  return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
}

function addCalendarMonths(parts, amount) {
  const date = new Date(Date.UTC(parts.year, parts.month - 1 + amount, 1));
  const lastDay = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0)).getUTCDate();
  return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: Math.min(parts.day || 1, lastDay) };
}

function calendarDateKey(value, timezone) {
  const parts = zonedParts(value, timezone);
  return `${parts.year}-${String(parts.month).padStart(2, "0")}-${String(parts.day).padStart(2, "0")}`;

const { aggregateLogsUnique } = require("js/domain/logs.js");

    targetMetric: config.targetMetric || "time",
    targetValue: Number(config.targetValue),
    targetUnit: config.targetUnit || (config.targetMetric === "time" || !config.targetMetric ? "minutes" : null),
    period: typeof config.period === "string" ? { mode: config.period } : (config.period || { mode: "all_time" }),
    aggregation: config.aggregation || "inclusive_unique",

    targetMetric: input.targetMetric || input.metric || "time",
    targetValue: Number(input.targetValue ?? input.value),
    targetUnit: input.targetUnit || input.unit || null,
    period: typeof input.period === "string" ? { mode: input.period } : (input.period || { mode: "all_time" }),
    aggregation: input.aggregation || "inclusive_unique",
    requireChildTargets: Boolean(input.requireChildTargets),
    requiredChildBlockIds: Array.isArray(input.requiredChildBlockIds) ? input.requiredChildBlockIds : []

  const config = validateTargetConfig(suppliedConfig
    ? normalizeTargetSnapshot(suppliedConfig)

    blockId: block.id,
    metric: config.targetMetric,
    target: config.targetValue,
    actual: aggregate.actual,
    percentage: percentage(aggregate.actual, config.targetValue),
    remaining: Math.max(0, config.targetValue - aggregate.actual),
    over,
    reached,
    status,
    bounds,
    direct,
    logIds: aggregate.logIds
  };

    direct: calculateTargetProgress({ ...input, direct: true }),
    inclusive: calculateTargetProgress({ ...input, direct: false })
  };

exports["validateTargetConfig"] = validateTargetConfig;
exports["calculateTargetProgress"] = calculateTargetProgress;
exports["calculateTargetDirectAndInclusive"] = calculateTargetDirectAndInclusive;

const EXPIRY_POLICIES = ["carry_forward", "expire"];

function validInstant(value) {
  return value == null || value === "" || Number.isFinite(Date.parse(value));

  return validDateKey(`2000-${value}`);

      : ["specific", "selected_dates"].includes(legacyCalendar.mode) ? "specific_dates"
        : legacyCalendar.mode === "monthly" ? "monthly"
          : legacyCalendar.mode === "annual" ? "annual"
            : legacyCalendar.mode === "window" ? "annual_window"
              : "daily";

    mode,
    intervalMinutes: Number(input.intervalMinutes || (input.interval?.amount * ({ minutes: 1, hours: 60, days: 1440, weeks: 10080 }[input.interval?.unit] || 0)) || 0),
    weekdays: [...new Set((Array.isArray(input.weekdays) ? input.weekdays : legacyCalendar.weekdays || []).map(Number))],

    annualDay: input.annualDay == null ? Number(monthDay?.[2] || 1) : Number(input.annualDay),

    annualWindowEnd: input.annualWindowEnd || legacyCalendar.windowEnd || null,

  }
  return false;

    ? new Date(instant).toISOString()

exports["scheduleAppliesOnDate"] = scheduleAppliesOnDate;
exports["occurrenceWindowForDate"] = occurrenceWindowForDate;

"js/import-export/exporter.js": function(module, exports, require) {

  data.actions = state.actions.filter((item) => roots.includes(item.id)).map(deepClone);
  const tagIds = new Set(data.actions.flatMap((item) => item.tagIds || []));
  data.tags = state.tags.filter((item) => tagIds.has(item.id)).map(deepClone);

  for (const rootId of roots) for (const nestedId of getDescendantBlockIds(state, rootId)) blockIds.add(nestedId);
  data.blocks = state.blocks.filter((item) => blockIds.has(item.id)).map(deepClone);
  const actionIds = new Set();
  for (const rootId of roots) for (const actionId of getDescendantActionIds(state, rootId)) actionIds.add(actionId);
  data.actions = state.actions.filter((item) => actionIds.has(item.id)).map(deepClone);
  const tagIds = new Set(data.actions.flatMap((item) => item.tagIds || []));
  data.tags = state.tags.filter((item) => tagIds.has(item.id)).map(deepClone);
  const categoryIds = new Set(data.tags.map((item) => item.categoryId));
  data.categories = state.categories.filter((item) => categoryIds.has(item.id)).map(deepClone);
  const unitIds = new Set(data.actions.flatMap((item) => [item.result?.unitId, ...(item.result?.allowedUnitIds || [])]).filter(Boolean));
  data.units = state.units.filter((item) => unitIds.has(item.id)).map(deepClone);
  if (includeActivationPresets) data.activationPresets = state.activationPresets.filter((item) => blockIds.has(item.blockId)).map(deepClone);
  return envelope({ id, type: "block-package", now, roots, data });
}

function exportStylePackage(state, styleIds, { id, now }) {
  const data = reusableData();
  data.styles = state.styles.filter((item) => styleIds.includes(item.id)).map(deepClone);
  return envelope({ id, type: "style-package", now, roots: [...styleIds], data });
}

exports["exportFullBackup"] = exportFullBackup;
exports["exportActionPackage"] = exportActionPackage;
exports["exportBlockPackage"] = exportBlockPackage;
exports["exportStylePackage"] = exportStylePackage;
},
"js/import-export/importer.js": function(module, exports, require) {
const { ImportError } = require("js/shared/errors.js");
const { deepClone } = require("js/shared/validation.js");
const { planImportConflicts, applyConflictPlan } = require("js/import-export/conflicts.js");
const { migrateInternalState } = require("js/import-export/migrations.js");
const { validatePackage, validateState } = require("js/import-export/validator.js");

function prepareImport(state, input) {
  const parsed = typeof input === "string" ? (() => { try { return JSON.parse(input); } catch { throw new ImportError("INVALID JSON FILE"); } })() : input;
  const { package: pkg } = validatePackage(parsed);
  if (pkg.packageType === "backup") {
    const migrated = migrateInternalState({ schemaVersion: state.schemaVersion, appVersion: state.appVersion, ...deepClone(pkg.data) }, { now: pkg.exportedAt, timezone: state.settings?.timezone || "Europe/London" }).state;
    validateState(migrated);
    return { package: pkg, isBackup: true, plan: [], candidate: migrated };
  }
  const plan = planImportConflicts(state, pkg);
  const candidate = applyConflictPlan(state, pkg, plan).state;
  validateState(candidate);
  return { package: pkg, isBackup: false, plan, candidate };
}

function rebuildImportCandidate(state, preview) {
  if (preview.isBackup) return prepareImport(state, preview.package).candidate;
  const { package: pkg } = validatePackage(preview.package);
  const plan = planImportConflicts(state, pkg);
  const candidate = applyConflictPlan(state, pkg, plan).state;
  validateState(candidate);
  return candidate;
}

exports["prepareImport"] = prepareImport;
exports["rebuildImportCandidate"] = rebuildImportCandidate;
},
"js/import-export/conflicts.js": function(module, exports, require) {
const { deepClone, normalizeName, normalizedNameKey } = require("js/shared/validation.js");

const COLLECTIONS = ["categories", "tags", "units", "actions", "blocks", "activationPresets", "styles"];

function sameContent(a, b) {
  const clean = (value) => {
    const copy = deepClone(value);
    delete copy.updatedAt;
    return copy;
  };
  return JSON.stringify(clean(a)) === JSON.stringify(clean(b));
}

function planImportConflicts(state, pkg) {
  const entries = [];
  for (const key of COLLECTIONS) {
    const local = state[key] || [];
    for (const incoming of pkg.data[key] || []) {
      const byId = local.find((item) => item.id === incoming.id);
      const incomingName = normalizeName(incoming.name);
      const byName = incomingName ? local.find((item) => normalizedNameKey(item.name) === normalizedNameKey(incomingName)) : null;
      if (byId) entries.push({ collection: key, incomingId: incoming.id, localId: byId.id, conflictType: sameContent(byId, incoming) ? "same_id_same" : "same_id_changed", resolution: sameContent(byId, incoming) ? "reuse" : "keep_mine" });
      else if (byName) entries.push({ collection: key, incomingId: incoming.id, localId: byName.id, conflictType: "same_name", resolution: "use_existing" });
      else entries.push({ collection: key, incomingId: incoming.id, localId: null, conflictType: "new", resolution: "create" });
    }
  }
  return entries;
}

function applyConflictPlan(state, pkg, plan) {
  const next = deepClone(state);
  const idMap = new Map();
  for (const entry of plan) if (entry.localId && ["reuse", "keep_mine", "use_existing", "replace_existing"].includes(entry.resolution)) idMap.set(entry.incomingId, entry.localId);
  const remap = (id) => idMap.get(id) || id;
  for (const key of COLLECTIONS) {
    for (const incomingValue of pkg.data[key] || []) {
      const entry = plan.find((item) => item.collection === key && item.incomingId === incomingValue.id);
      if (!entry || ["reuse", "keep_mine", "use_existing"].includes(entry.resolution)) continue;
      let incoming = deepClone(incomingValue);
      incoming.id = remap(incoming.id);
      if (key === "tags") incoming.categoryId = remap(incoming.categoryId);
      if (key === "actions") {
        incoming.tagIds = (incoming.tagIds || []).map(remap);
        incoming.result = { ...(incoming.result || {}), unitId: incoming.result?.unitId ? remap(incoming.result.unitId) : null, allowedUnitIds: (incoming.result?.allowedUnitIds || []).map(remap) };
      }
      if (key === "blocks") {
        incoming.children = (incoming.children || []).map((child) => ({ ...child, refId: remap(child.refId) }));
        const avoidEvaluation = incoming.typeConfig?.avoidEvaluation ? {
          ...incoming.typeConfig.avoidEvaluation,
          requiredChildBlockIds: (incoming.typeConfig.avoidEvaluation.requiredChildBlockIds || []).map(remap),
          childWeights: Object.fromEntries(Object.entries(incoming.typeConfig.avoidEvaluation.childWeights || {}).map(([id, value]) => [remap(id), value]))
        } : undefined;
        incoming.typeConfig = { ...(incoming.typeConfig || {}), requiredChildBlockIds: (incoming.typeConfig?.requiredChildBlockIds || []).map(remap), ...(avoidEvaluation ? { avoidEvaluation } : {}) };
        incoming.projectTargets = (incoming.projectTargets || []).map((target) => ({ ...target, actionId: target.actionId ? remap(target.actionId) : null, blockId: target.blockId ? remap(target.blockId) : null, unitId: target.unitId ? remap(target.unitId) : null }));
      }
      if (key === "activationPresets") incoming.blockId = remap(incoming.blockId);
      const existingIndex = next[key].findIndex((item) => item.id === incoming.id);
      if (existingIndex >= 0) next[key][existingIndex] = { ...next[key][existingIndex], ...incoming, id: next[key][existingIndex].id };
      else next[key].push(incoming);
    }
  }
  return { state: next, idMap: Object.fromEntries(idMap) };
}

exports["planImportConflicts"] = planImportConflicts;
exports["applyConflictPlan"] = applyConflictPlan;
},
"js/infrastructure/backup.js": function(module, exports, require) {

    id,
    name: reason,

"js/application/lifecycle.js": function(module, exports, require) {
const { calculatePeriodBounds, calendarDateKey, nextPeriodBounds } = require("js/shared/dates.js");
const { stableTemporalId } = require("js/shared/ids.js");
const { closePeriodRecord, openPeriodRecord } = require("js/domain/periods.js");
const { calculateTargetProgress, normalizeTargetConfig } = require("js/domain/targets.js");
const { evaluateAvoidActionPeriod, evaluateAvoidPeriod, normalizeAvoidEvaluation, validateAvoidEvaluation } = require("js/domain/avoid.js");
const { normalizeSchedule, occurrenceWindowForDate, scheduleAppliesOnDate } = require("js/domain/scheduling.js");
const { resolveOccurrenceStatus } = require("js/domain/occurrences.js");
const { getDescendantActionIds } = require("js/domain/relationships.js");
const { applyCyclePeriodEnd, applyMissedCycleItemPolicy, distributeCycleFrequency, getCurrentCyclePosition } = require("js/domain/cycles.js");
const { ACTIVE_ACTIVATION_STATUSES, resumeActivation } = require("js/domain/activations.js");
const { resumeRun } = require("js/domain/runs.js");
const { EVENTS, domainEvent } = require("js/application/events.js");

const MAX_CATCH_UP_WINDOWS = 10000;
const CLOSED_OCCURRENCE_STATES = new Set(["completed", "skipped", "missed"]);

function historyExists(state, id) { return (state.history || []).some((item) => item.id === id); }
function periodIsOpen(record) { return !record.closedAt && record.lifecycleStatus !== "closed" && !["completed", "closed", "cancelled"].includes(record.lifecycleStatus); }
function samePeriod(record, ownerMatch, bounds) { return ownerMatch(record) && record.periodStart === bounds.start && (record.periodEnd || null) === (bounds.end || null); }
function beforeOrEqual(left, right) { return Date.parse(left) <= Date.parse(right); }

function addPeriodHistory(state, record, event, now) {
  const id = `history_${record.id}_closed`;
  if (historyExists(state, id)) return;
  state.history.push({
    id,
    type: "period",
    event,
    objectType: record.actionId ? "action" : "block",
    objectId: record.actionId || record.blockId,
    nameSnapshot: record.actionNameSnapshot || record.blockNameSnapshot,
    timestamp: record.periodEnd || now,
    recordedAt: now,
    createdAt: now,
    periodId: record.id,
    actual: record.actual,
    score: record.score ?? null,
    status: record.status,
    actionLogIds: record.actionLogIds || [],
    contextBlockId: record.contextBlockId || null,
    relationshipId: record.relationshipId || null
  });
}

function reconcileScheduledResumes(state, now, events) {
  for (const activation of state.activations || []) {
    if (activation.status !== "paused" || !activation.resumeAt || Date.parse(activation.resumeAt) > Date.parse(now)) continue;
    Object.assign(activation, resumeActivation(activation, now));
    const historyId = `history_${activation.id}_resumed_${String(now).replace(/[^0-9A-Za-z]/g, "")}`;
    if (!historyExists(state, historyId)) state.history.push({ id: historyId, type: "activation", event: "block_resumed", objectType: "block", objectId: activation.blockId, nameSnapshot: activation.blockNameSnapshot, timestamp: now, createdAt: now, activationId: activation.id, automatic: true });
    events.push(domainEvent(EVENTS.BLOCK_RESUMED, { activationId: activation.id, blockId: activation.blockId, automatic: true }, now));
  }
  for (const run of state.runs || []) {
    if (run.status !== "paused" || !run.resumeAt || Date.parse(run.resumeAt) > Date.parse(now)) continue;
    Object.assign(run, resumeRun(run, now));
    const historyId = `history_${run.id}_resumed_${String(now).replace(/[^0-9A-Za-z]/g, "")}`;
    if (!historyExists(state, historyId)) state.history.push({ id: historyId, type: "run", event: "run_resumed", objectType: "block", objectId: run.blockId, nameSnapshot: run.blockNameSnapshot, timestamp: now, createdAt: now, runId: run.id, automatic: true });
    events.push(domainEvent(EVENTS.RUN_RESUMED, { runId: run.id, blockId: run.blockId, automatic: true }, now));
  }
}

function reconcilePeriodSeries({ collection, ownerMatch, period, currentBounds, timezone, autoClose, createRecord, closeRecord }) {
  const records = () => collection.filter(ownerMatch).sort((a, b) => Date.parse(a.periodStart) - Date.parse(b.periodStart));
  for (const record of records().filter((item) => periodIsOpen(item) && item.periodEnd && beforeOrEqual(item.periodEnd, currentBounds.start))) {
    if (!autoClose) return;
    closeRecord(record);
  }
  const relevant = records();
  if (!relevant.length) {
    createRecord(currentBounds);
    return;
  }
  const latest = relevant[relevant.length - 1];
  let cursor = { start: latest.periodStart, end: latest.periodEnd, mode: currentBounds.mode };
  if (!cursor.end || Date.parse(cursor.start) >= Date.parse(currentBounds.start)) return;
  for (let index = 0; index < MAX_CATCH_UP_WINDOWS && Date.parse(cursor.start) < Date.parse(currentBounds.start); index += 1) {
    const next = nextPeriodBounds(period, cursor, timezone);
    if (!next || Date.parse(next.start) > Date.parse(currentBounds.start)) break;
    let record = collection.find((item) => samePeriod(item, ownerMatch, next));
    if (!record) record = createRecord(next);
    if (Date.parse(next.start) < Date.parse(currentBounds.start)) {
      if (!autoClose) return;
      if (periodIsOpen(record)) closeRecord(record);
    }
    cursor = next;
    if (next.start === currentBounds.start) return;
  }
  if (!collection.some((item) => samePeriod(item, ownerMatch, currentBounds))) createRecord(currentBounds);
}

function targetAutoClose(state, block) {
  return block.typeConfig?.periodEnd?.autoClose ?? block.typeConfig?.autoClose ?? state.settings?.behaviourDefaults?.targets?.autoClose ?? true;
}

function createTargetPeriod(state, block, config, bounds, now) {
  const id = stableTemporalId("target_period", block.id, bounds.start);
  const record = openPeriodRecord({ id, block, bounds, targetSnapshot: config, now, kind: "target" });
  record.actionIdsSnapshot = [...getDescendantActionIds(state, block.id)];
  state.targetPeriods.push(record);
  return record;
}

function closeTargetPeriod(state, block, record, now, timezone, events) {
  const config = record.targetSnapshot?.targetMetric ? record.targetSnapshot : normalizeTargetConfig(block);
  const evaluation = calculateTargetProgress({
    state,
    block,
    now: record.periodEnd,
    timezone,
    bounds: { start: record.periodStart, end: record.periodEnd },
    closed: true,
    config,
    actionIds: record.actionIdsSnapshot || null
  });
  Object.assign(record, closePeriodRecord(record, evaluation, now));
  addPeriodHistory(state, record, "target_period_closed", now);
  events.push(domainEvent(EVENTS.PERIOD_CLOSED, { periodId: record.id, blockId: block.id, status: record.status }, now));
  if (evaluation.reached) events.push(domainEvent(EVENTS.TARGET_REACHED, { periodId: record.id, blockId: block.id }, now));
}

function reconcileTargetPeriods(state, now, timezone, events) {
  for (const block of state.blocks.filter((item) => item.type === "target" && item.status === "active" && item.direction !== "avoid")) {
    const config = normalizeTargetConfig(block);
    if (["session", "all_time"].includes(config.period.mode || config.period)) continue;
    const currentBounds = calculatePeriodBounds(config.period, now, timezone);
    reconcilePeriodSeries({
      collection: state.targetPeriods,
      ownerMatch: (record) => record.blockId === block.id,
      period: config.period,
      currentBounds,
      timezone,
      autoClose: targetAutoClose(state, block),
      createRecord: (bounds) => createTargetPeriod(state, block, config, bounds, now),
      closeRecord: (record) => closeTargetPeriod(state, block, record, now, timezone, events)
    });
  }
}

function avoidAutoClose(block) { return block.typeConfig?.periodEnd?.autoClose ?? block.typeConfig?.autoClose ?? true; }

function createAvoidPeriod(state, block, config, bounds, now) {
  const id = stableTemporalId("avoid_period", block.id, bounds.start);
  const record = openPeriodRecord({ id, block, bounds, targetSnapshot: config, now, kind: "avoid" });
  record.evaluationSnapshot = config;
  record.actionIdsSnapshot = [...getDescendantActionIds(state, block.id)];
  state.avoidPeriods.push(record);
  return record;
}

function closeAvoidPeriod(state, block, record, now, timezone, events) {
  const config = record.evaluationSnapshot || validateAvoidEvaluation(block.typeConfig?.avoidEvaluation || {});
  const evaluation = evaluateAvoidPeriod({ state, block, now: record.periodEnd, timezone, bounds: { start: record.periodStart, end: record.periodEnd }, config, actionIds: record.actionIdsSnapshot || null });
  Object.assign(record, closePeriodRecord(record, evaluation, now));
  addPeriodHistory(state, record, "avoid_period_closed", now);
  events.push(domainEvent(EVENTS.PERIOD_CLOSED, { periodId: record.id, blockId: block.id, status: record.status }, now));
  if (evaluation.status === "failed") events.push(domainEvent(EVENTS.AVOID_FAILED, { periodId: record.id, blockId: block.id }, now));
}

function reconcileAvoidPeriods(state, now, timezone, events) {
  for (const block of state.blocks.filter((item) => item.status === "active" && item.direction === "avoid")) {
    const config = validateAvoidEvaluation(block.typeConfig?.avoidEvaluation || {});
    if (["session", "all_time"].includes(config.period.mode || config.period)) continue;
    const currentBounds = calculatePeriodBounds(config.period, now, timezone);
    reconcilePeriodSeries({
      collection: state.avoidPeriods,
      ownerMatch: (record) => record.blockId === block.id && !record.relationshipId,
      period: config.period,
      currentBounds,
      timezone,
      autoClose: avoidAutoClose(block),
      createRecord: (bounds) => createAvoidPeriod(state, block, config, bounds, now),
      closeRecord: (record) => closeAvoidPeriod(state, block, record, now, timezone, events)
    });
  }
}

function directAvoidConfig(block, relationship, action) {
  return validateAvoidEvaluation(normalizeAvoidEvaluation(relationship.avoidEvaluation || block.typeConfig?.avoidEvaluation || {
    mode: "binary_limit",
    metric: action.avoidMetricHint || (action.completion?.method === "time" ? "time" : "count"),
    binaryLimit: 0,
    period: { mode: "day" }
  }));
}

function createDirectAvoidPeriod(state, block, relationship, action, config, bounds, now) {
  const id = stableTemporalId("avoid_period", relationship.id, bounds.start);
  const record = {
    id,
    kind: "avoid",
    blockId: block.id,
    contextBlockId: block.id,
    blockNameSnapshot: block.name,
    relationshipId: relationship.id,
    actionId: action.id,
    actionNameSnapshot: action.name,
    periodStart: bounds.start,
    periodEnd: bounds.end,
    evaluationSnapshot: config,
    actual: 0,
    status: "open",
    lifecycleStatus: "open",
    actionLogIds: [],
    createdAt: now,
    updatedAt: now
  };
  state.avoidPeriods.push(record);
  return record;
}

function closeDirectAvoidPeriod(state, block, relationship, action, record, now, timezone, events) {
  const evaluation = evaluateAvoidActionPeriod({ logs: state.actionLogs, actionId: action.id, evaluation: record.evaluationSnapshot, now: record.periodEnd, timezone, bounds: { start: record.periodStart, end: record.periodEnd } });
  Object.assign(record, closePeriodRecord(record, evaluation, now));
  addPeriodHistory(state, record, "avoid_period_closed", now);
  events.push(domainEvent(EVENTS.PERIOD_CLOSED, { periodId: record.id, actionId: action.id, blockId: block.id, status: record.status }, now));
  if (evaluation.status === "failed") events.push(domainEvent(EVENTS.AVOID_FAILED, { periodId: record.id, actionId: action.id, blockId: block.id }, now));
}

function reconcileDirectAvoidPeriods(state, now, timezone, events) {
  for (const block of state.blocks.filter((item) => item.type === "action_list" && item.status === "active")) {
    for (const relationship of block.children || []) {
      if (relationship.kind !== "action") continue;
      const action = state.actions.find((item) => item.id === relationship.refId);
      if (!action || action.direction !== "avoid") continue;
      const config = directAvoidConfig(block, relationship, action);
      if (["session", "all_time"].includes(config.period.mode || config.period)) continue;
      const currentBounds = calculatePeriodBounds(config.period, now, timezone);
      reconcilePeriodSeries({
        collection: state.avoidPeriods,
        ownerMatch: (record) => record.relationshipId === relationship.id || (record.actionId === action.id && record.contextBlockId === block.id),
        period: config.period,
        currentBounds,
        timezone,
        autoClose: relationship.periodEnd?.autoClose ?? true,
        createRecord: (bounds) => createDirectAvoidPeriod(state, block, relationship, action, config, bounds, now),
        closeRecord: (record) => closeDirectAvoidPeriod(state, block, relationship, action, record, now, timezone, events)
      });
    }
  }
}

function cyclePolicies(state, block) {
  const defaults = state.settings?.behaviourDefaults?.cycles || {};
  return {
    autoClose: block.typeConfig?.periodEnd?.autoClose ?? block.typeConfig?.autoClose ?? defaults.autoClose ?? true,
    position: block.typeConfig?.positionPolicy || block.typeConfig?.position || defaults.position || "continue",
    missedItem: block.typeConfig?.missedItemPolicy || block.typeConfig?.missedItem || defaults.missedItem || "keep"
  };
}

function createCyclePeriod(state, block, activation, sequence, bounds, policies, now) {
  const position = getCurrentCyclePosition(activation.cycleState || activation, sequence.length);
  const item = sequence[position] || null;
  const record = {
    id: stableTemporalId("cycle_period", activation.id, bounds.start),
    kind: "cycle",
    blockId: block.id,
    blockNameSnapshot: block.name,
    activationId: activation.id,
    periodStart: bounds.start,
    periodEnd: bounds.end,
    positionAtStart: position,
    relationshipId: item?.sourceRelationshipId || item?.id || null,
    itemSnapshot: item ? { ...item } : null,
    policySnapshot: { ...policies },
    itemCompleted: false,
    status: "open",
    lifecycleStatus: "open",
    actionLogIds: [],
    createdAt: now,
    updatedAt: now
  };
  state.cyclePeriods.push(record);
  return record;
}

function closeCyclePeriod(state, block, activation, sequence, record, now, events) {
  const policy = record.policySnapshot || cyclePolicies(state, block);
  const previous = getCurrentCyclePosition(activation.cycleState || activation, sequence.length);
  if (!record.itemCompleted) activation.cycleState = applyMissedCycleItemPolicy(activation.cycleState || activation, sequence.length, policy.missedItem);
  activation.cycleState = applyCyclePeriodEnd(activation.cycleState || activation, { position: policy.position });
  activation.updatedAt = now;
  record.status = record.itemCompleted ? "completed" : "missed";
  record.lifecycleStatus = "closed";
  record.positionAtEnd = getCurrentCyclePosition(activation.cycleState || activation, sequence.length);
  record.closedAt = now;
  record.updatedAt = now;
  addPeriodHistory(state, record, "cycle_period_closed", now);
  events.push(domainEvent(EVENTS.PERIOD_CLOSED, { periodId: record.id, blockId: block.id, status: record.status }, now));
  if (record.positionAtEnd !== previous) events.push(domainEvent(EVENTS.CYCLE_ADVANCED, { activationId: activation.id, blockId: block.id, position: record.positionAtEnd, reason: "period_end" }, now));
}

function reconcileCyclePeriods(state, now, timezone, events) {
  for (const block of state.blocks.filter((item) => item.type === "cycle" && item.status === "active")) {
    const period = block.typeConfig?.period;
    if (!period || ["session", "all_time", "all"].includes(period.mode || period)) continue;
    const activation = state.activations.find((item) => item.blockId === block.id && ACTIVE_ACTIVATION_STATUSES.includes(item.status) && item.status !== "paused");
    if (!activation) continue;
    const sequence = activation.roundSnapshot || distributeCycleFrequency(block.children || []);
    const policies = cyclePolicies(state, block);
    const currentBounds = calculatePeriodBounds(period, now, timezone);
    reconcilePeriodSeries({
      collection: state.cyclePeriods,
      ownerMatch: (record) => record.activationId === activation.id,
      period,
      currentBounds,
      timezone,
      autoClose: policies.autoClose,
      createRecord: (bounds) => createCyclePeriod(state, block, activation, sequence, bounds, policies, now),
      closeRecord: (record) => closeCyclePeriod(state, block, activation, sequence, record, now, events)
    });
  }
}

function relationshipSchedule(state, block, relationship) {
  if (relationship.schedule) {
    const schedule = relationship.schedule;
    const hasExplicitExpiry = schedule.expiryPolicy != null || schedule.carryPolicy != null || schedule.unfinishedPolicy != null;
    if (hasExplicitExpiry) return schedule;
    const expireByDefault = block.type === "routine"
      ? state.settings?.behaviourDefaults?.routines?.expireUnfinishedOccurrence ?? true
      : state.settings?.behaviourDefaults?.actionLists?.expireConfiguredOccurrences ?? true;
    return { ...schedule, expiryPolicy: expireByDefault ? "expire" : "carry_forward" };
  }
  if (block.typeConfig?.suggestedRecurrence === "daily") return { mode: "daily", expiryPolicy: "expire" };
  if (block.typeConfig?.suggestedWeekday != null) return { mode: "weekdays", weekdays: [Number(block.typeConfig.suggestedWeekday)], expiryPolicy: "expire" };
  return null;
}

function addOccurrenceMissHistory(state, occurrence, now, events) {
  const historyId = `history_${occurrence.id}_missed`;
  if (!historyExists(state, historyId)) state.history.push({ id: historyId, type: "occurrence", event: "occurrence_missed", objectType: "action", objectId: occurrence.actionId, nameSnapshot: occurrence.actionNameSnapshot, timestamp: occurrence.dueAt || now, recordedAt: now, createdAt: now, occurrenceId: occurrence.id });
  events.push(domainEvent(EVENTS.OCCURRENCE_MISSED, { occurrenceId: occurrence.id }, now));
}

function reconcileExistingOccurrenceStatuses(state, now, events) {
  for (const occurrence of state.occurrences) {
    const resolved = resolveOccurrenceStatus(occurrence, now);
    if (resolved === occurrence.status) continue;
    occurrence.status = resolved;
    occurrence.updatedAt = now;
    if (resolved === "missed") addOccurrenceMissHistory(state, occurrence, now, events);
  }
}

function occurrenceIdFor(relationship, schedule, instant, timezone) {
  if (["always", "once"].includes(schedule.mode)) return `occurrence_${relationship.id}_${schedule.mode}`;
  if (schedule.mode === "interval") return `occurrence_${relationship.id}_${String(instant).replace(/[^0-9A-Za-z]/g, "")}`;
  return `occurrence_${relationship.id}_${calendarDateKey(instant, timezone).replace(/-/g, "")}`;
}

function createOccurrence(state, block, relationship, action, schedule, instant, now, timezone, events) {
  const id = occurrenceIdFor(relationship, schedule, instant, timezone);
  if (state.occurrences.some((item) => item.id === id)) return null;
  const occurrenceWindow = occurrenceWindowForDate(schedule, instant, timezone);
  const occurrence = {
    id,
    actionId: action.id,
    actionNameSnapshot: action.name,
    directionSnapshot: action.direction,
    parentBlockId: block.id,
    blockNameSnapshot: block.name,
    relationshipId: relationship.id,
    relationshipSnapshot: { ...relationship },
    completionSnapshot: { ...action.completion },
    scheduleSnapshot: { ...schedule },
    availableAt: occurrenceWindow.availableAt,
    dueAt: occurrenceWindow.dueAt,
    expiryPolicy: occurrenceWindow.expiryPolicy,
    actual: 0,
    status: resolveOccurrenceStatus({ availableAt: occurrenceWindow.availableAt, dueAt: occurrenceWindow.dueAt, expiryPolicy: occurrenceWindow.expiryPolicy, status: "upcoming" }, now),
    actionLogIds: [],
    createdAt: now,
    updatedAt: now
  };
  state.occurrences.push(occurrence);
  events.push(domainEvent(EVENTS.OCCURRENCE_CREATED, { occurrenceId: id, actionId: action.id, blockId: block.id }, now));
  if (occurrence.status === "missed") addOccurrenceMissHistory(state, occurrence, now, events);
  return occurrence;
}

function dailyInstantsToReconcile(state, relationship, now, timezone, previousReconciledAt) {
  const existing = state.occurrences.filter((item) => item.relationshipId === relationship.id && item.availableAt).sort((a, b) => Date.parse(b.availableAt) - Date.parse(a.availableAt));
  const startingInstant = existing[0]?.availableAt || previousReconciledAt || now;
  let cursor = calculatePeriodBounds({ mode: "day" }, startingInstant, timezone);
  const current = calculatePeriodBounds({ mode: "day" }, now, timezone);
  const output = [];
  if (!existing.length && cursor.start === current.start) return [now];
  if (existing.length) cursor = nextPeriodBounds({ mode: "day" }, cursor, timezone);
  for (let index = 0; index < MAX_CATCH_UP_WINDOWS && cursor && Date.parse(cursor.start) <= Date.parse(current.start); index += 1) {
    output.push(cursor.start);
    if (cursor.start === current.start) break;
    cursor = nextPeriodBounds({ mode: "day" }, cursor, timezone);
  }
  return output;
}

function reconcileIntervalOccurrence(state, block, relationship, action, schedule, now, timezone, events) {
  const occurrences = state.occurrences.filter((item) => item.relationshipId === relationship.id).sort((a, b) => Date.parse(b.availableAt || b.createdAt) - Date.parse(a.availableAt || a.createdAt));
  if (occurrences.some((item) => !CLOSED_OCCURRENCE_STATES.has(item.status))) return;
  const last = occurrences[0];
  const instant = last ? new Date(Date.parse(last.completedAt || last.dueAt || last.availableAt) + schedule.intervalMinutes * 60000).toISOString() : (schedule.availableAt || now);
  createOccurrence(state, block, relationship, action, schedule, instant, now, timezone, events);
}

function reconcileOccurrences(state, now, timezone, events, previousReconciledAt) {
  reconcileExistingOccurrenceStatuses(state, now, events);
  for (const block of state.blocks.filter((item) => item.status === "active" && ["action_list", "routine"].includes(item.type))) {
    for (const relationship of block.children || []) {
      if (relationship.kind !== "action") continue;
      const rawSchedule = relationshipSchedule(state, block, relationship);
      if (!rawSchedule) continue;
      const schedule = normalizeSchedule(rawSchedule);
      const action = state.actions.find((item) => item.id === relationship.refId);
      if (!action || action.direction === "avoid") continue;
      if (schedule.mode === "interval") {
        reconcileIntervalOccurrence(state, block, relationship, action, schedule, now, timezone, events);
        continue;
      }
      if (["always", "once"].includes(schedule.mode)) {
        const instant = schedule.availableAt || now;
        if (scheduleAppliesOnDate(schedule, instant, timezone)) createOccurrence(state, block, relationship, action, schedule, instant, now, timezone, events);
        continue;
      }
      for (const instant of dailyInstantsToReconcile(state, relationship, now, timezone, previousReconciledAt)) {
        if (scheduleAppliesOnDate(schedule, instant, timezone)) createOccurrence(state, block, relationship, action, schedule, instant, now, timezone, events);
      }
    }
  }
}

function reconcileTemporalState(state, { now, timezone }) {
  const events = [];
  state.targetPeriods = Array.isArray(state.targetPeriods) ? state.targetPeriods : [];
  state.avoidPeriods = Array.isArray(state.avoidPeriods) ? state.avoidPeriods : [];
  state.cyclePeriods = Array.isArray(state.cyclePeriods) ? state.cyclePeriods : [];
  state.occurrences = Array.isArray(state.occurrences) ? state.occurrences : [];
  state.history = Array.isArray(state.history) ? state.history : [];
  state.meta = state.meta || {};
  const previousReconciledAt = state.meta.lastTemporalReconciliationAt || now;
  reconcileScheduledResumes(state, now, events);
  reconcileTargetPeriods(state, now, timezone, events);
  reconcileAvoidPeriods(state, now, timezone, events);
  reconcileDirectAvoidPeriods(state, now, timezone, events);
  reconcileCyclePeriods(state, now, timezone, events);
  reconcileOccurrences(state, now, timezone, events, previousReconciledAt);
  state.meta.lastTemporalReconciliationAt = now;
  return { state, events };
}

exports["reconcileTemporalState"] = reconcileTemporalState;
},
"js/domain/occurrences.js": function(module, exports, require) {
const { InvalidScheduleError } = require("js/shared/errors.js");

const OPEN_OCCURRENCE_STATES = ["upcoming", "available", "due", "overdue", "partial", "paused"];
const CLOSED_OCCURRENCE_STATES = ["completed", "skipped", "missed"];

function resolveOccurrenceStatus(occurrence, now) {
  if (CLOSED_OCCURRENCE_STATES.includes(occurrence.status)) return occurrence.status;
  if (occurrence.status === "paused") return "paused";
  const time = new Date(now).getTime();
  const available = occurrence.availableAt ? new Date(occurrence.availableAt).getTime() : -Infinity;
  const due = occurrence.dueAt ? new Date(occurrence.dueAt).getTime() : Infinity;
  if (!Number.isFinite(time)) throw new InvalidScheduleError("Occurrence evaluation time is invalid.");
  if (time < available) return "upcoming";
  if (time >= due) return occurrence.expiryPolicy === "expire" ? "missed" : "overdue";
  if (Number(occurrence.actual || 0) > 0) return "partial";
  return occurrence.dueAt ? "due" : "available";
}

function completeOccurrence(occurrence, now, status = "completed") {
  if (!CLOSED_OCCURRENCE_STATES.includes(status)) throw new InvalidScheduleError("Occurrence can only close as completed, skipped or missed.");
  return {
    ...occurrence,
    status,
    completedAt: status === "completed" ? now : occurrence.completedAt || null,
    skippedAt: status === "skipped" ? now : occurrence.skippedAt || null,
    missedAt: status === "missed" ? now : occurrence.missedAt || null,
    updatedAt: now
  };
}

exports["OPEN_OCCURRENCE_STATES"] = OPEN_OCCURRENCE_STATES;
exports["CLOSED_OCCURRENCE_STATES"] = CLOSED_OCCURRENCE_STATES;
exports["resolveOccurrenceStatus"] = resolveOccurrenceStatus;
exports["completeOccurrence"] = completeOccurrence;
},
"js/domain/cycles.js": function(module, exports, require) {
const { ValidationError } = require("js/shared/errors.js");

function distributeCycleFrequency(children) {
  const weighted = (children || []).map((child, index) => ({ child, index, weight: Number(child.frequency ?? 1), current: 0 }));
  if (!weighted.length) return [];
  if (weighted.some((item) => !Number.isInteger(item.weight) || item.weight < 1)) throw new ValidationError("Cycle frequency must be a whole number of at least 1.");
  const total = weighted.reduce((sum, item) => sum + item.weight, 0);
  const output = [];
  for (let position = 0; position < total; position += 1) {
    for (const item of weighted) item.current += item.weight;
    weighted.sort((a, b) => b.current - a.current || a.index - b.index);
    const selected = weighted[0];
    selected.current -= total;
    output.push({ ...selected.child, sourceRelationshipId: selected.child.id, generatedPosition: position });
    weighted.sort((a, b) => a.index - b.index);
  }
  return output;
}

function getCurrentCyclePosition(cycleState, sequenceLength) {
  if (!sequenceLength) return 0;
  return Math.max(0, Math.trunc(Number(cycleState.currentPosition) || 0)) % sequenceLength;
}

function advanceCycle(cycleState, sequenceLength) {
  if (!sequenceLength) return { ...cycleState, currentPosition: 0, currentRound: cycleState.currentRound || 1 };
  const current = getCurrentCyclePosition(cycleState, sequenceLength);
  const finishedRound = current === sequenceLength - 1;
  return { ...cycleState, currentPosition: finishedRound ? 0 : current + 1, currentRound: Math.max(1, Number(cycleState.currentRound) || 1) + (finishedRound ? 1 : 0), completedRounds: Math.max(0, Number(cycleState.completedRounds) || 0) + (finishedRound ? 1 : 0) };
}

function applyCyclePeriodEnd(cycleState, policy = {}) {
  const positionPolicy = policy.position || policy.positionPolicy || "continue";
  return positionPolicy === "restart" || positionPolicy === "restart_from_beginning" ? { ...cycleState, currentPosition: 0 } : { ...cycleState };
}

function applyMissedCycleItemPolicy(cycleState, sequenceLength, policy = "keep") {
  if (policy === "skip" || policy === "skip_to_next") return advanceCycle(cycleState, sequenceLength);
  if (policy === "restart" || policy === "restart_cycle") return { ...cycleState, currentPosition: 0 };
  return { ...cycleState };
}

function resolveNextEligibleItem(sequence, cycleState, isEligible, mode = "next_eligible") {
  if (!sequence.length) return null;
  const current = getCurrentCyclePosition(cycleState, sequence.length);
  if (mode === "strict") return isEligible(sequence[current]) ? { item: sequence[current], position: current } : null;
  for (let offset = 0; offset < sequence.length; offset += 1) {
    const position = (current + offset) % sequence.length;
    if (isEligible(sequence[position])) return { item: sequence[position], position };
  }
  return null;
}

exports["distributeCycleFrequency"] = distributeCycleFrequency;
exports["getCurrentCyclePosition"] = getCurrentCyclePosition;
exports["advanceCycle"] = advanceCycle;
exports["applyCyclePeriodEnd"] = applyCyclePeriodEnd;
exports["applyMissedCycleItemPolicy"] = applyMissedCycleItemPolicy;
exports["resolveNextEligibleItem"] = resolveNextEligibleItem;
},

function pauseActivation(activation, pausedAt, resumeAt) {

}

"js/application/queries.js": function(module, exports, require) {
const { NotFoundError } = require("js/shared/errors.js");
const { calculateTargetDirectAndInclusive, calculateTargetProgress } = require("js/domain/targets.js");
const { evaluateAvoidPeriod } = require("js/domain/avoid.js");
const { distributeCycleFrequency, getCurrentCyclePosition } = require("js/domain/cycles.js");
const { collectionRuntimeView } = require("js/domain/collections.js");
const { getActionById, getBlockById, getChildren, getActions, getBlocks, getActiveBlocks, getRunningRuns, getDueOccurrences, getAvailableOccurrences, getOccurrenceView, getUpcomingOccurrences } = require("js/application/selectors.js");
const { getHomeViewModel } = require("js/application/home.js");
const { getAnalysisViewModel } = require("js/application/analysis.js");
const { ACTIVE_ACTIVATION_STATUSES } = require("js/domain/activations.js");
const { RUNNING_RUN_STATUSES } = require("js/domain/runs.js");

function createQueries(getState, getContext) {
  return {
    getState: () => getState(),
    getActionById: (id) => getActionById(getState(), id),
    getBlockById: (id) => getBlockById(getState(), id),
    getActions: (filter) => getActions(getState(), filter),
    getBlocks: (filter) => getBlocks(getState(), filter),
    getActiveBlocks: () => getActiveBlocks(getState()),
    getRunningRuns: () => getRunningRuns(getState()),
    getDueOccurrences: () => getDueOccurrences(getState(), getContext().now),
    getAvailableOccurrences: () => getAvailableOccurrences(getState(), getContext().now),
    getUpcomingOccurrences: (limit) => getUpcomingOccurrences(getState(), getContext().now, limit),
    getBlockChildren: (id) => getChildren(getState(), id),
    getBlockDetail: (id) => {
      const state = getState();
      const block = getBlockById(state, id);
      if (!block) throw new NotFoundError(`Block not found: ${id}`);
      const children = getChildren(state, id);
      const activeActivation = [...(state.activations || [])].reverse().find((item) => item.blockId === id && ACTIVE_ACTIVATION_STATUSES.includes(item.status)) || null;
      const currentRun = [...(state.runs || [])].reverse().find((item) => item.blockId === id && (RUNNING_RUN_STATUSES.includes(item.status) || item.status === "paused")) || null;
      const periodCollection = block.direction === "avoid" ? state.avoidPeriods : state.targetPeriods;
      const activePeriod = [...(periodCollection || [])].reverse().find((item) => item.blockId === id && !item.relationshipId && !item.closedAt && item.lifecycleStatus !== "closed") || null;
      const activeCyclePeriod = block.type === "cycle"
        ? [...(state.cyclePeriods || [])].reverse().find((item) => item.blockId === id && !item.closedAt && item.lifecycleStatus !== "closed") || null
        : null;
      const occurrences = (state.occurrences || [])
        .filter((item) => [item.parentBlockId, item.blockId, item.contextBlockId].includes(id))
        .map((item) => getOccurrenceView(state, item, getContext().now));
      let cycle = null;
      if (block.type === "cycle" && activeActivation) {
        const sequence = activeActivation.roundSnapshot || distributeCycleFrequency(block.children || []);
        const position = getCurrentCyclePosition(activeActivation.cycleState || activeActivation, sequence.length);
        const relationship = sequence[position] || null;
        const object = relationship
          ? (relationship.kind === "action" ? getActionById(state, relationship.refId) : getBlockById(state, relationship.refId))
          : null;
        cycle = { position, sequenceLength: sequence.length, relationship, object };
      }
      const base = block.type === "collection" ? collectionRuntimeView(block, children) : { block, children };
      return {
        ...base,
        block,
        children,
        activeActivation,
        runningRun: currentRun && RUNNING_RUN_STATUSES.includes(currentRun.status) ? currentRun : null,
        currentRun,
        activePeriod,
        activeCyclePeriod,
        cycle,
        occurrences,
        isPrimaryProject: block.type === "project" && state.settings?.primaryProjectId === block.id
      };
    },
    getTargetProgress: (id) => { const state = getState(); const block = getBlockById(state, id); return calculateTargetProgress({ state, block, ...getContext() }); },
    getTargetDirectAndInclusive: (id) => { const state = getState(); const block = getBlockById(state, id); return calculateTargetDirectAndInclusive({ state, block, ...getContext() }); },
    getAvoidStatus: (id) => { const state = getState(); const block = getBlockById(state, id); return evaluateAvoidPeriod({ state, block, ...getContext() }); },
    getCycleNextItem: (id) => {
      const state = getState(); const block = getBlockById(state, id); const activation = state.activations.find((item) => item.blockId === id && ["running", "waiting", "manual"].includes(item.status));
      const sequence = activation?.roundSnapshot || distributeCycleFrequency(block.children || []); const position = getCurrentCyclePosition(activation?.cycleState || activation || {}, sequence.length);
      return sequence[position] || null;
    },
    getHomeViewModel: () => getHomeViewModel(getState(), getContext()),
    getAnalysisViewModel: (filter) => getAnalysisViewModel(getState(), { ...getContext(), ...(filter || {}) })
  };
}

exports["createQueries"] = createQueries;
},

function getActions(state, { status } = {}) { return (state.actions || []).filter((item) => !status || item.status === status); }
function getBlocks(state, { status, type } = {}) { return (state.blocks || []).filter((item) => (!status || item.status === status) && (!type || item.type === type)); }
function getActiveBlocks(state) { return getBlocks(state, { status: "active" }); }

function getDescendants(state, blockId) { return { blockIds: [...getDescendantBlockIds(state, blockId)], actionIds: [...getDescendantActionIds(state, blockId)] }; }

function getOccurrenceView(state, occurrence, now) {

  return { ...occurrence, status: resolveOccurrenceStatus(occurrence, now), actionName: action?.name || occurrence.actionNameSnapshot || "Unknown Action", direction: action?.direction || occurrence.directionSnapshot || "do", blockName: block?.name || occurrence.blockNameSnapshot || "", required };
}

function getDueOccurrences(state, now) {

}

  return (state.occurrences || []).map((item) => getOccurrenceView(state, item, now)).filter((item) => item.direction === "do" && item.status === "upcoming").sort((a, b) => new Date(a.availableAt) - new Date(b.availableAt)).slice(0, limit);

exports["getActionById"] = getActionById;
exports["getBlockById"] = getBlockById;
exports["getActions"] = getActions;
exports["getBlocks"] = getBlocks;
exports["getActiveBlocks"] = getActiveBlocks;
exports["getRunningRuns"] = getRunningRuns;
exports["getChildren"] = getChildren;
exports["getDescendants"] = getDescendants;
exports["getOccurrenceView"] = getOccurrenceView;
exports["getDueOccurrences"] = getDueOccurrences;
exports["getAvailableOccurrences"] = getAvailableOccurrences;
exports["getUpcomingOccurrences"] = getUpcomingOccurrences;
},
"js/application/home.js": function(module, exports, require) {
const { calculateTargetProgress } = require("js/domain/targets.js");
const { evaluateAvoidActionPeriod, evaluateAvoidPeriod, normalizeAvoidEvaluation } = require("js/domain/avoid.js");
const { distributeCycleFrequency, resolveNextEligibleItem } = require("js/domain/cycles.js");
const { calculatePeriodBounds, withinBounds } = require("js/shared/dates.js");
const { getActionById, getAvailableOccurrences, getBlockById, getDueOccurrences, getOccurrenceView, getRunningRuns, getUpcomingOccurrences } = require("js/application/selectors.js");
const { ACTIVE_ACTIVATION_STATUSES } = require("js/domain/activations.js");
