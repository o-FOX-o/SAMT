"js/application/analysis.js": function(module, exports, require) {
const { aggregateLogsUnique, globalUniqueTime } = require("js/domain/logs.js");
const { getDescendantActionIds } = require("js/domain/relationships.js");
const { calculateTargetProgress } = require("js/domain/targets.js");
const { evaluateAvoidPeriod } = require("js/domain/avoid.js");

function getAnalysisViewModel(state, { now, timezone, bounds = null, blockId = null } = {}) {
  const logs = state.actionLogs || [];
  const global = {
    uniqueTime: globalUniqueTime(logs, bounds),
    actionLogs: aggregateLogsUnique(logs, { metric: "count", bounds }).count,
    completedOccurrences: (state.occurrences || []).filter((item) => item.status === "completed" && (!bounds || (!bounds.start || item.completedAt >= bounds.start) && (!bounds.end || item.completedAt < bounds.end))).length,
    completedRuns: (state.runs || []).filter((item) => item.status === "completed" && (!bounds || (!bounds.start || item.endAt >= bounds.start) && (!bounds.end || item.endAt < bounds.end))).length
  };
  const blockRows = (state.blocks || []).map((block) => {
    const actionIds = getDescendantActionIds(state, block.id);
    const aggregate = aggregateLogsUnique(logs, { metric: "time", actionIds, bounds });
    return { id: block.id, name: block.name, type: block.type, direction: block.direction || "do", attributedTime: aggregate.actual, activityCount: aggregate.count };
  });
  const targets = (state.blocks || []).filter((block) => block.type === "target" && block.direction !== "avoid").map((block) => calculateTargetProgress({ state, block, now, timezone }));
  const avoid = (state.blocks || []).filter((block) => block.direction === "avoid").map((block) => evaluateAvoidPeriod({ state, block, now, timezone }));
  return { generatedAt: now, global, blocks: blockId ? blockRows.filter((item) => item.id === blockId) : blockRows, targets, avoid };

"js/application/commands.js": function(module, exports, require) {
const { ConflictError, NotFoundError, ValidationError } = require("js/shared/errors.js");
const { createId } = require("js/shared/ids.js");
const { deepClone, normalizeName } = require("js/shared/validation.js");
const { createActionDefinition, updateActionDefinition } = require("js/domain/actions.js");
const { createBlockDefinition, updateBlockDefinition } = require("js/domain/blocks.js");
const { validateBlockGraph, getBlocksContainingAction, getDescendantActionIds } = require("js/domain/relationships.js");
const { actionCompletion } = require("js/domain/evaluation.js");
const { assertOneActiveActivation, pauseActivation } = require("js/domain/activations.js");
const { createRun, assertNoRunningRun, finishRun, RUNNING_RUN_STATUSES } = require("js/domain/runs.js");
const { completeOccurrence: completeOccurrenceDomain, OPEN_OCCURRENCE_STATES } = require("js/domain/occurrences.js");
const { advanceCycle: advanceCycleDomain, distributeCycleFrequency } = require("js/domain/cycles.js");
const { historyEvent } = require("js/domain/history.js");
const { openPeriodRecord, closePeriodRecord } = require("js/domain/periods.js");
const { calculateTargetProgress, normalizeTargetConfig } = require("js/domain/targets.js");
const { evaluateAvoidActionPeriod, evaluateAvoidPeriod, validateAvoidEvaluation } = require("js/domain/avoid.js");
const { EVENTS, domainEvent } = require("js/application/events.js");

function assertUniqueName(items, name, exceptId, kind) {
  const key = normalizeName(name).toLowerCase();
  if ((items || []).some((item) => item.id !== exceptId && normalizeName(item.name).toLowerCase() === key)) throw new ConflictError(`${kind} name already exists: ${normalizeName(name)}`);
}

function createActionCommand(state, input, context) {
  assertUniqueName(state.actions, input.name, null, "Action");
  const action = createActionDefinition(input, { id: context.id("action"), now: context.now });
  state.actions.push(action);
  return { value: action, events: [] };
}

function updateActionCommand(state, actionId, patch, context) {
  const index = state.actions.findIndex((item) => item.id === actionId);
  if (index < 0) throw new NotFoundError(`Action not found: ${actionId}`);
  assertUniqueName(state.actions, patch.name || state.actions[index].name, actionId, "Action");
  const action = updateActionDefinition(state.actions[index], patch, context.now);
  state.actions[index] = action;
  return { value: action, events: [] };
}

function createBlockCommand(state, input, context) {
  assertUniqueName(state.blocks, input.name, null, "Block");
  const block = createBlockDefinition(input, { id: context.id("block"), now: context.now });
  state.blocks.push(block);
  validateBlockGraph(state);
  return { value: block, events: [] };
}

function updateBlockCommand(state, blockId, patch, context) {
  const index = state.blocks.findIndex((item) => item.id === blockId);
  if (index < 0) throw new NotFoundError(`Block not found: ${blockId}`);
  assertUniqueName(state.blocks, patch.name || state.blocks[index].name, blockId, "Block");
  const block = updateBlockDefinition(state.blocks[index], patch, context.now);
  state.blocks[index] = block;
  validateBlockGraph(state);
  return { value: block, events: [] };
}

function logValues(action, input) {
  if (action.completion.method === "time") {
    const duration = Number(input.durationPerformed ?? input.durationMinutes ?? input.duration ?? 0);
    if (!(duration > 0)) throw new ValidationError("A time log must contain positive time.");
    return { durationPerformed: duration, quantityPerformed: null, completionContribution: duration };
  }
  const quantity = Number(input.quantityPerformed ?? input.quantity ?? 1);
  if (!(quantity > 0) || !Number.isInteger(quantity)) throw new ValidationError("A quantity log must be a positive whole number.");
  return { durationPerformed: null, quantityPerformed: quantity, completionContribution: quantity };
}

function validateResultValue(state, action, input) {
  const mode = action.result?.mode || "none";
  if (mode === "none") return { resultValue: null, unitId: null, unitNameSnapshot: null };
  const value = Number(input.resultValue);
  if (!Number.isFinite(value)) throw new ValidationError("This Action requires a valid Result value.");
  if (mode === "percentage" && (value < 0 || value > 100)) throw new ValidationError("Percentage Result must be between 0 and 100.");
  if (mode === "score" && (value < 0 || value > Number(action.result.scoreMax))) throw new ValidationError("Score Result must fit its configured maximum.");
  const unitId = mode === "measurement" ? (input.unitId || action.result.unitId || null) : null;
  if (mode === "measurement" && !unitId) throw new ValidationError("Measurement Result requires a Unit.");
  const unit = unitId ? state.units.find((item) => item.id === unitId) : null;
  if (unitId && !unit) throw new ValidationError("Measurement Unit was not found.");
  const allowed = action.result.allowedUnitIds || (action.result.unitId ? [action.result.unitId] : []);
  if (mode === "measurement" && allowed.length && !allowed.includes(unitId)) throw new ValidationError("That Unit is not allowed for this Action.");
  return { resultValue: value, unitId, unitNameSnapshot: unit ? (unit.symbol || unit.name) : null };
}

function logActionCommand(state, actionId, input, context) {
  const action = state.actions.find((item) => item.id === actionId);
  if (!action) throw new NotFoundError(`Action not found: ${actionId}`);
  if (action.status === "archived") throw new ValidationError("Archived Actions cannot receive new logs.");
  const values = logValues(action, input);
  const result = validateResultValue(state, action, input);
  const linkedOccurrences = action.direction === "avoid" ? [] : (state.occurrences || []).filter((item) => item.actionId === actionId && OPEN_OCCURRENCE_STATES.includes(item.status) && (!item.availableAt || new Date(item.availableAt) <= new Date(context.now)) && (!item.dueAt || item.expiryPolicy !== "expire" || new Date(context.now) <= new Date(item.dueAt)));
  const linkedBlocks = getBlocksContainingAction(state, actionId, true);
  const linkedRuns = (state.runs || []).filter((run) => RUNNING_RUN_STATUSES.includes(run.status) && getDescendantActionIds(state, run.blockId).has(actionId));
  const log = {
    id: context.id("log"),
    actionId,
    actionNameSnapshot: action.name,
    directionSnapshot: action.direction,
    timestamp: input.timestamp || context.now,
    eventAt: input.timestamp || context.now,
    ...values,
    durationMinutes: values.durationPerformed || 0,
    quantity: values.quantityPerformed || 0,
    completionMethodSnapshot: action.completion.method,
    completionTargetSnapshot: action.completion.method === "time" ? Number(action.completion.minimumMinutes ?? action.completion.target ?? 0) : Number(action.completion.target || 1),
    tagIdsSnapshot: [...(action.tagIds || [])],
    categoryIdsSnapshot: Array.from(new Set((action.tagIds || []).map((tagId) => state.tags.find((item) => item.id === tagId)?.categoryId).filter(Boolean))),
    resultTypeSnapshot: action.result?.mode || "none",
    resultValue: result.resultValue,
    scoreMaximumSnapshot: action.result?.scoreMax ?? null,
    unitId: result.unitId,
    unitNameSnapshot: input.unitNameSnapshot || result.unitNameSnapshot,
    linkedRunIds: linkedRuns.map((item) => item.id),
    linkedOccurrenceIds: linkedOccurrences.map((item) => item.id),
    linkedBlockIds: linkedBlocks.map((item) => item.id),
    note: input.note || "",
    createdAt: context.now
  };
  state.actionLogs.push(log);
  for (const occurrence of linkedOccurrences) {
    occurrence.actionLogIds = [...new Set([...(occurrence.actionLogIds || occurrence.logIds || []), log.id])];
    occurrence.logIds = [...occurrence.actionLogIds];
    occurrence.actual = Number(occurrence.actual || 0) + Number(values.completionContribution || 0);
    if (action.completion.method === "time") occurrence.durationMinutesActual = occurrence.actual;
    else occurrence.quantityActual = occurrence.actual;
    const completion = actionCompletion(action, occurrence.actual);
    occurrence.status = completion.complete ? "completed" : "partial";
    occurrence.completedAt = completion.complete ? context.now : null;
    occurrence.updatedAt = context.now;
  }
  for (const run of linkedRuns) {
    run.actionLogIds = [...new Set([...(run.actionLogIds || run.logIds || []), log.id])];
    run.logIds = [...run.actionLogIds];
  }
  state.history.push(historyEvent({ id: context.id("history"), type: "action_log", event: "action_logged", objectType: "action", objectId: action.id, nameSnapshot: action.name, description: `${action.name} logged`, timestamp: context.now, references: { actionLogId: log.id, linkedBlockIds: log.linkedBlockIds, linkedRunIds: log.linkedRunIds, linkedOccurrenceIds: log.linkedOccurrenceIds } }));
  return { value: log, events: [domainEvent(EVENTS.ACTION_LOGGED, { actionLogId: log.id, actionId, linkedBlockIds: log.linkedBlockIds }, context.now)] };
}

function deleteActionLogCommand(state, logId, context) {
  const index = state.actionLogs.findIndex((item) => item.id === logId);
  if (index < 0) throw new NotFoundError(`Action Log not found: ${logId}`);
  const [log] = state.actionLogs.splice(index, 1);
  const action = state.actions.find((item) => item.id === log.actionId);
  for (const occurrence of state.occurrences || []) {
    const occurrenceLogIds = Array.from(new Set([...(occurrence.actionLogIds || []), ...(occurrence.logIds || [])]));
    if (!occurrenceLogIds.includes(logId)) continue;
    occurrence.actionLogIds = occurrenceLogIds.filter((id) => id !== logId);
    occurrence.logIds = [...occurrence.actionLogIds];
    const remaining = state.actionLogs.filter((item) => occurrence.actionLogIds.includes(item.id));
    occurrence.actual = remaining.reduce((total, item) => total + Number(action?.completion?.method === "time" ? (item.durationPerformed ?? item.durationMinutes ?? 0) : (item.quantityPerformed ?? item.quantity ?? 0)), 0);
    if (action?.completion?.method === "time") occurrence.durationMinutesActual = occurrence.actual;
    else occurrence.quantityActual = occurrence.actual;
    if (action && occurrence.status === "completed") {
      const completion = actionCompletion(action, occurrence.actual);
      occurrence.status = completion.complete ? "completed" : occurrence.dueAt && new Date(context.now) > new Date(occurrence.dueAt) ? (occurrence.expiryPolicy === "expire" ? "missed" : "overdue") : occurrence.actual > 0 ? "partial" : "available";
      occurrence.completedAt = completion.complete ? occurrence.completedAt : null;
    }
    occurrence.updatedAt = context.now;
  }
  for (const run of state.runs || []) {
    const ids = Array.from(new Set([...(run.actionLogIds || []), ...(run.logIds || [])]));
    if (!ids.includes(logId)) continue;
    run.actionLogIds = ids.filter((id) => id !== logId);
    run.logIds = [...run.actionLogIds];
    run.updatedAt = context.now;
  }
  state.history.push(historyEvent({ id: context.id("history"), type: "correction", event: "action_log_deleted", objectType: "action", objectId: log.actionId, nameSnapshot: log.actionNameSnapshot, description: "Action Log deleted", timestamp: context.now, references: { deletedActionLogSnapshot: deepClone(log) } }));
  return { value: log, events: [domainEvent(EVENTS.ACTION_LOG_DELETED, { actionLogId: logId }, context.now)] };
}

function activateBlockCommand(state, blockId, config, context) {
  const block = state.blocks.find((item) => item.id === blockId);
  if (!block) throw new NotFoundError(`Block not found: ${blockId}`);
  assertOneActiveActivation(state.activations, blockId);
  const activation = { id: context.id("activation"), blockId, blockNameSnapshot: block.name, status: config.status || "manual", startAt: config.startAt || context.now, repeat: config.repeat || { mode: "none" }, deadline: config.deadline || null, note: config.note || "", cycleState: block.type === "cycle" ? { currentPosition: 0, currentRound: 1, completedRounds: 0 } : null, roundSnapshot: block.type === "cycle" ? distributeCycleFrequency(block.children) : null, createdAt: context.now, updatedAt: context.now };
  state.activations.push(activation);
  return { value: activation, events: [domainEvent(EVENTS.BLOCK_ACTIVATED, { activationId: activation.id, blockId }, context.now)] };
}

function pauseBlockCommand(state, activationId, resumeAt, context) {
  const index = state.activations.findIndex((item) => item.id === activationId);
  if (index < 0) throw new NotFoundError(`Activation not found: ${activationId}`);
  state.activations[index] = pauseActivation(state.activations[index], context.now, resumeAt);
  return { value: state.activations[index], events: [domainEvent(EVENTS.BLOCK_PAUSED, { activationId }, context.now)] };
}

  state.occurrences[index] = completeOccurrenceDomain(state.occurrences[index], context.now, status || "completed");

  const activation = state.activations.find((item) => item.id === activationId);
  if (!activation) throw new NotFoundError(`Activation not found: ${activationId}`);

  if (!block || block.type !== "cycle") throw new ValidationError("Activation does not belong to a Cycle.");
  const sequence = activation.roundSnapshot || distributeCycleFrequency(block.children);
  activation.cycleState = advanceCycleDomain(activation.cycleState || activation, sequence.length);
  activation.updatedAt = context.now;

}

function startPeriodCommand(state, blockId, context) {
  const block = state.blocks.find((item) => item.id === blockId);
  if (!block) throw new NotFoundError(`Block not found: ${blockId}`);
  const isAvoid = block.direction === "avoid";
  const config = isAvoid ? validateAvoidEvaluation(block.typeConfig?.avoidEvaluation || {}) : normalizeTargetConfig(block);

  if ((config.period.mode || config.period) !== "session") throw new ValidationError("Only per-session Blocks are started manually.");

  const existing = collection.find((item) => item.blockId === blockId && !item.closedAt && !item.periodEnd);
  if (existing) throw new ConflictError("This Block already has an open session.", { periodId: existing.id });

  if (isAvoid) period.evaluationSnapshot = config;
  collection.push(period);
  return { value: period, events: [domainEvent(EVENTS.PERIOD_OPENED, { periodId: period.id, blockId }, context.now)] };
}

function closePeriodCommand(state, periodId, context) {
  const targetIndex = state.targetPeriods.findIndex((item) => item.id === periodId);
  const avoidIndex = state.avoidPeriods.findIndex((item) => item.id === periodId);
  const isAvoid = avoidIndex >= 0;
  const collection = isAvoid ? state.avoidPeriods : state.targetPeriods;
  const index = isAvoid ? avoidIndex : targetIndex;
  if (index < 0) throw new NotFoundError(`Period not found: ${periodId}`);
  const record = collection[index];
  if (record.closedAt) throw new ConflictError("This period is already closed.");
  const block = state.blocks.find((item) => item.id === record.blockId);
  if (!block) throw new NotFoundError(`Block not found: ${record.blockId}`);
  // A manually closed session includes a log recorded at the same instant as
  // the close command. Calendar periods remain end-exclusive so boundary logs
  // belong to exactly one day/week/month.
  const bounds = { start: record.periodStart, end: record.periodEnd || context.now, endInclusive: true, mode: "session" };
  const evaluation = isAvoid
    ? record.actionId
      ? evaluateAvoidActionPeriod({ logs: state.actionLogs, actionId: record.actionId, evaluation: record.evaluationSnapshot, now: context.now, timezone: context.timezone, bounds })
      : evaluateAvoidPeriod({ state, block, now: context.now, timezone: context.timezone, bounds })
    : calculateTargetProgress({ state, block, now: context.now, timezone: context.timezone, bounds, closed: true });
  collection[index] = closePeriodRecord({ ...record, periodEnd: bounds.end }, evaluation, context.now);
  state.history.push(historyEvent({ id: context.id("history"), type: "period", event: isAvoid ? "avoid_period_closed" : "target_period_closed", objectType: record.actionId ? "action" : "block", objectId: record.actionId || block.id, nameSnapshot: record.actionNameSnapshot || block.name, description: `${record.actionNameSnapshot || block.name} period closed`, timestamp: context.now, references: { periodId, actionLogIds: evaluation.logIds || [] } }));

  if (!isAvoid && evaluation.reached) events.push(domainEvent(EVENTS.TARGET_REACHED, { periodId, blockId: block.id }, context.now));
  if (isAvoid && evaluation.status === "failed") events.push(domainEvent(EVENTS.AVOID_FAILED, { periodId, blockId: block.id }, context.now));
  return { value: collection[index], events };
}

  const collection = kind === "action" ? state.actions : state.blocks;
  const index = collection.findIndex((item) => item.id === id);
  if (index < 0) throw new NotFoundError(`${kind} not found: ${id}`);

function completionPercentage(actual, requirement) {
  if (Number(requirement) === 0) return Number(actual) > 0 ? 100 : 0;
  return Math.min(100, (Number(actual) / Number(requirement)) * 100);
}

function actionCompletion(action, actual) {
  if (action.completion.method === "time") {
    const minimum = Number(action.completion.minimumMinutes || 0);
    return { actual, requirement: minimum, percentage: minimum === 0 ? (actual > 0 ? 100 : 0) : Math.min(100, (actual / minimum) * 100), complete: minimum === 0 ? actual > 0 : actual >= minimum };
  }
  const target = Number(action.completion.target || 1);
  return { actual, requirement: target, percentage: Math.min(100, (actual / target) * 100), complete: actual >= target };
}

exports["completionPercentage"] = completionPercentage;
exports["actionCompletion"] = actionCompletion;
},

"js/infrastructure/repository.js": function(module, exports, require) {
const { StorageError } = require("js/shared/errors.js");
const { deepClone } = require("js/shared/validation.js");
const { ENGINE_BACKUP_KEY, STATE_KEY, readLocalCandidates, writeLocalMigrationBackup, writeLocalState } = require("js/infrastructure/local-storage.js");
const { readIndexedState, writeIndexedTransaction } = require("js/infrastructure/indexed-db.js");

function stateWeight(candidate) {
  return ["categories", "tags", "units", "actions", "blocks", "activationPresets", "activations", "runs", "occurrences", "actionLogs", "history", "analysisTargets", "targetPeriods", "avoidPeriods", "periodEvaluations", "restorePoints", "importHistory", "bin"]

}

function stateTime(candidate) {
  const parsed = Date.parse(candidate?.meta?.updatedAt || candidate?.meta?.createdAt || "");
  return Number.isFinite(parsed) ? parsed : 0;
}

function selectBestStateCandidate(candidates) {
  return [...candidates].filter((item) => item && item.value).sort((a, b) => {
    const weightDifference = stateWeight(b.value) - stateWeight(a.value);
    return weightDifference || stateTime(b.value) - stateTime(a.value);
  })[0] || null;
}

class Repository {
  async getAction(id) { return (await this.getActions()).find((item) => item.id === id) || null; }
  async getActions() { return (await this.load())?.actions || []; }
  async saveAction(action) {
    return this.transaction((state) => {
      const index = state.actions.findIndex((item) => item.id === action.id);
      if (index < 0) state.actions.push(deepClone(action)); else state.actions[index] = deepClone(action);
      return deepClone(action);
    });
  }
  async getBlock(id) { return (await this.getBlocks()).find((item) => item.id === id) || null; }
  async getBlocks() { return (await this.load())?.blocks || []; }
  async saveBlock(block) {
    return this.transaction((state) => {
      const index = state.blocks.findIndex((item) => item.id === block.id);
      if (index < 0) state.blocks.push(deepClone(block)); else state.blocks[index] = deepClone(block);
      return deepClone(block);
    });
  }
  async getActionLogs(filter = {}) {
    return ((await this.load())?.actionLogs || []).filter((log) => (!filter.actionId || log.actionId === filter.actionId)
      && (!filter.from || new Date(log.timestamp || log.createdAt) >= new Date(filter.from))
      && (!filter.to || new Date(log.timestamp || log.createdAt) < new Date(filter.to)));
  }
  async saveActionLog(log) {
    return this.transaction((state) => {
      const index = state.actionLogs.findIndex((item) => item.id === log.id);
      if (index < 0) state.actionLogs.push(deepClone(log)); else state.actionLogs[index] = deepClone(log);
      return deepClone(log);
    });
  }
}

function browserCapability(name) {
  try { return globalThis?.[name] || null; }
  catch { return null; }
}

class LegacyBrowserRepository extends Repository {
  constructor({ indexedDBApi, localStorageApi, logger = null } = {}) {
    super();
    this.indexedDB = indexedDBApi === undefined ? browserCapability("indexedDB") : indexedDBApi;
    this.localStorage = localStorageApi === undefined ? browserCapability("localStorage") : localStorageApi;
    this.logger = logger;
  }

  async load() {
    const candidates = readLocalCandidates(this.localStorage);
    try {
      const value = await readIndexedState(this.indexedDB, STATE_KEY);
      if (value) candidates.push({ source: `indexedDB:${STATE_KEY}`, value });
    } catch (error) { this.logger?.debug("Storage", "IndexedDB read unavailable; using fallback.", { message: error.message }); }
    const selected = selectBestStateCandidate(candidates);
    return selected ? deepClone(selected.value) : null;
  }

  async createMigrationBackup(state) {
    if (!state) return;
    let saved = false;
    const failures = [];
    try { writeLocalMigrationBackup(this.localStorage, state); saved = Boolean(this.localStorage); } catch (error) { failures.push(error); }
    try { await writeIndexedTransaction(this.indexedDB, [[ENGINE_BACKUP_KEY, deepClone(state)]]); saved = true; }
    catch (error) { failures.push(error); }
    if (!saved) throw new StorageError("Could not create a pre-migration backup.", { causes: failures.map((error) => error.message) });
    if (failures.length) this.logger?.debug("Storage", "One backup adapter was unavailable; another retained the backup.", { causes: failures.map((error) => error.message) });
  }

  async save(state, previous = null) {
    const snapshot = deepClone(state);
    let saved = false;
    const failures = [];
    try {
      const entries = previous ? [[ENGINE_BACKUP_KEY, deepClone(previous)], [STATE_KEY, snapshot]] : [[STATE_KEY, snapshot]];
      await writeIndexedTransaction(this.indexedDB, entries);
      saved = true;
    } catch (error) { failures.push(error); }
    try { writeLocalState(this.localStorage, snapshot, previous); saved = saved || Boolean(this.localStorage); }
    catch (error) { failures.push(error); }
    if (!saved) throw new StorageError("Could not persist SAMT state.", { causes: failures.map((error) => error.message) });
    if (failures.length) this.logger?.debug("Storage", "One storage adapter was unavailable; another committed the state.", { causes: failures.map((error) => error.message) });
    return snapshot;
  }

  async transaction(callback) {
    const current = await this.load();
    const candidate = deepClone(current);
    const value = await callback(candidate);
    await this.save(candidate, current);
    return { state: candidate, value };
  }
}

class MemoryRepository extends Repository {
  constructor(initialState = null) { super(); this.state = initialState ? deepClone(initialState) : null; this.backups = []; }
  async load() { return this.state ? deepClone(this.state) : null; }
  async createMigrationBackup(state) { this.backups.push(deepClone(state)); }
  async save(state) { this.state = deepClone(state); return this.load(); }
  async transaction(callback) {
    const candidate = deepClone(this.state);
    const value = await callback(candidate);
    this.state = candidate;
    return { state: deepClone(candidate), value };
  }
}

exports["selectBestStateCandidate"] = selectBestStateCandidate;
exports["Repository"] = Repository;
exports["LegacyBrowserRepository"] = LegacyBrowserRepository;
exports["MemoryRepository"] = MemoryRepository;
},
"js/infrastructure/local-storage.js": function(module, exports, require) {
const { deepClone } = require("js/shared/validation.js");

const STATE_KEY = "life-command-v1-state";
const FALLBACK_KEY = "life-command-v1-fallback";
const RECOVERY_KEY = "life-command-v1-recovery";
const ENGINE_BACKUP_KEY = "life-command-engine-v2-pre-migration";

function parseStoredState(raw) {
  if (!raw) return null;
  try {
    const value = typeof raw === "string" ? JSON.parse(raw) : raw;
    return value && typeof value === "object" ? value : null;
  } catch { return null; }
}

function readLocalCandidates(storage) {
  if (!storage) return [];
  const output = [];
  for (const key of [STATE_KEY, FALLBACK_KEY, RECOVERY_KEY]) {
    try {
      const value = parseStoredState(storage.getItem(key));
      if (value) output.push({ source: `localStorage:${key}`, value });
    } catch { /* Browser privacy modes may block localStorage. */ }
  }
  return output;
}

function writeLocalState(storage, next, previous = null) {
  if (!storage) return;
  const serialized = JSON.stringify(next);
  const previousSerialized = previous ? JSON.stringify(previous) : storage.getItem(STATE_KEY) || storage.getItem(FALLBACK_KEY);
  if (previousSerialized && previousSerialized !== serialized) storage.setItem(RECOVERY_KEY, previousSerialized);
  storage.setItem(FALLBACK_KEY, serialized);
  storage.setItem(STATE_KEY, serialized);
}

function writeLocalMigrationBackup(storage, state) {
  if (!storage || !state) return;
  storage.setItem(ENGINE_BACKUP_KEY, JSON.stringify(deepClone(state)));
}

exports["STATE_KEY"] = STATE_KEY;
exports["FALLBACK_KEY"] = FALLBACK_KEY;
exports["RECOVERY_KEY"] = RECOVERY_KEY;
exports["ENGINE_BACKUP_KEY"] = ENGINE_BACKUP_KEY;
exports["parseStoredState"] = parseStoredState;
exports["readLocalCandidates"] = readLocalCandidates;
exports["writeLocalState"] = writeLocalState;
exports["writeLocalMigrationBackup"] = writeLocalMigrationBackup;
},
"js/infrastructure/indexed-db.js": function(module, exports, require) {
const DB_NAME = "life-command-v1-db";
const STORE_NAME = "app";
const DB_VERSION = 1;

function openLegacyDatabase(indexedDBApi) {
  if (!indexedDBApi) return Promise.reject(new Error("IndexedDB unavailable"));
  return new Promise((resolve, reject) => {
    const request = indexedDBApi.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("IndexedDB unavailable"));
  });
}

async function readIndexedState(indexedDBApi, key) {
  const database = await openLegacyDatabase(indexedDBApi);
  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, "readonly");
    const request = transaction.objectStore(STORE_NAME).get(key);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error || new Error("IndexedDB read failed"));
  });
}

async function writeIndexedTransaction(indexedDBApi, entries) {
  const database = await openLegacyDatabase(indexedDBApi);
  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    for (const [key, value] of entries) store.put(value, key);
    transaction.oncomplete = () => resolve(true);
    transaction.onerror = () => reject(transaction.error || new Error("IndexedDB transaction failed"));
    transaction.onabort = () => reject(transaction.error || new Error("IndexedDB transaction aborted"));
  });
}

exports["readIndexedState"] = readIndexedState;
exports["writeIndexedTransaction"] = writeIndexedTransaction;
exports["DB_NAME"] = DB_NAME;
exports["STORE_NAME"] = STORE_NAME;
exports["DB_VERSION"] = DB_VERSION;
exports["openLegacyDatabase"] = openLegacyDatabase;
},

  return String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
}

function titleCase(value) { return String(value || "").replace(/_/g, " ").replace(/\b\w/g, (character) => character.toUpperCase()); }

function formatDateTime(value, compact = false) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";
  return new Intl.DateTimeFormat(undefined, compact ? { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" } : { dateStyle: "medium", timeStyle: "short" }).format(date);
}

function formatMetric(value, metric) {
  if (metric === "time") {
    const minutes = Math.max(0, Math.round(Number(value) || 0));
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return hours ? `${hours}h${rest ? ` ${rest}m` : ""}` : `${rest}m`;
  }
  return Number(value || 0).toLocaleString();
}

function badge(status) {
  const kind = ["completed", "success", "target_reached", "over_target"].includes(status) ? "success" : ["failed", "missed", "overdue"].includes(status) ? "danger" : ["due", "partial", "neutral"].includes(status) ? "warning" : "";
  return `<span class="badge ${kind ? `badge-${kind}` : ""}">${escapeHtml(titleCase(status))}</span>`;
}

exports["escapeHtml"] = escapeHtml;
exports["titleCase"] = titleCase;
exports["formatDateTime"] = formatDateTime;
exports["formatMetric"] = formatMetric;
exports["badge"] = badge;
},
"js/ui/modal-manager.js": function(module, exports, require) {
const { escapeHtml } = require("js/ui/format.js");

function focusable(container) {
  return [...container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [contenteditable="true"]')].filter((element) => !element.hidden);
}

class ModalManager {
  constructor(root) { this.root = root; this.active = null; this.opener = null; this.keyHandler = null; }

  close(result = null) {
    if (!this.active) return;
    const { resolve } = this.active;
    document.removeEventListener("keydown", this.keyHandler, true);
    document.body.classList.remove("modal-open");
    this.root.replaceChildren();
    this.active = null;
    const opener = this.opener;
    this.opener = null;
    if (opener && opener.isConnected) opener.focus();
    resolve(result);
  }

  open({ title, body, submitLabel = null, cancelLabel = "Cancel", destructive = false, dismissible = true, wide = false }) {
    if (this.active) this.close(null);
    this.opener = document.activeElement;
    document.body.classList.add("modal-open");
    return new Promise((resolve) => {
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `<section class="modal-dialog ${wide ? "modal-dialog-wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="global-modal-title"><form data-modal-form><div class="modal-head"><div><h2 id="global-modal-title">${escapeHtml(title)}</h2></div>${dismissible ? '<button type="button" class="btn btn-ghost btn-small" data-modal-close aria-label="Close dialog">Close</button>' : ""}</div><div class="stack" data-modal-body>${body}</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-modal-close>${escapeHtml(cancelLabel)}</button>${submitLabel ? `<button type="submit" class="btn ${destructive ? "btn-danger" : "btn-primary"}">${escapeHtml(submitLabel)}</button>` : ""}</div></form></section>`;
      this.root.replaceChildren(backdrop);
      this.active = { resolve, backdrop };
      backdrop.addEventListener("click", (event) => {
        if (event.target.matches("[data-modal-close]") || (dismissible && event.target === backdrop)) this.close(null);
        if (event.target.closest("[data-close-modal]")) this.close({ navigation: true });
      });
      backdrop.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        this.close(new FormData(event.currentTarget));
      });
      this.keyHandler = (event) => {
        if (event.key === "Escape" && dismissible) { event.preventDefault(); this.close(null); return; }
        if (event.key !== "Tab") return;
        const elements = focusable(backdrop);
        if (!elements.length) return;
        const first = elements[0]; const last = elements[elements.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      };
      document.addEventListener("keydown", this.keyHandler, true);
      queueMicrotask(() => (focusable(backdrop)[0] || backdrop.querySelector(".modal-dialog")).focus());
    });
  }

  async confirm({ title, message, confirmLabel = "Confirm", destructive = false }) {
    const value = await this.open({ title, body: `<p>${escapeHtml(message)}</p>`, submitLabel: confirmLabel, destructive });
    return Boolean(value);
  }
}

exports["ModalManager"] = ModalManager;
},
