name: SAMT Android preview
on:
  push:
    branches: [android-redesign]
  pull_request:
    branches: [android-redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install web build tools
        run: npm install --no-audit --no-fund
        working-directory: samt-android
      - name: Check engine behavior
        run: npm test
        working-directory: samt-android
      - name: Bundle interface for older WebViews
        run: npm run build:web
        working-directory: samt-android
      - name: Check mobile interface
        run: bash test/ui-smoke.sh
        working-directory: samt-android
        env:
          SAMT_WEB_DIRECTORY: app/build/generated/samt-web
      - name: Build signed Android preview
        run: gradle :app:assembleRelease
        working-directory: samt-android
        env:
          SAMT_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: samt-android-preview
          path: samt-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: samt-screen-preview
          path: |
            samt-android/ui-preview.png
            samt-android/ui-layout-*.png
            samt-android/ui-style-*.png
            samt-android/ui-landscape-style.png
            samt-android/ui-starters.png
            samt-android/ui-data.png
            samt-android/ui-dark.png

  android-launch:
    name: Launch signed APK (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samt-android-preview
          path: samt-android/apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash samt-android/test/android-launch.sh samt-android/apk/app-release.apk samt-android/android-launch-results
      - name: Preserve Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-api-${{ matrix.api-level }}
          path: samt-android/android-launch-results
          if-no-files-found: warn
