name: SAMT Android preview
on:
  push:
    branches: [android-redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check engine behavior
        run: node samt-android/test/engine.test.js
      - name: Check mobile interface
        run: bash test/ui-smoke.sh
        working-directory: samt-android
      - name: Build Android preview
        run: gradle :app:assembleDebug
        working-directory: samt-android
      - uses: actions/upload-artifact@v4
        with:
          name: samt-android-preview
          path: samt-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: samt-screen-preview
          path: |
            samt-android/ui-preview.png
            samt-android/ui-starters.png
            samt-android/ui-dark.png
