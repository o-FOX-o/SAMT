  function renderProjects() {
    let projects = state.projects.filter(function(project) {
      return project.status !== "archived" &&
        (ui.projectStatus === "all" || project.status === ui.projectStatus) &&
        (ui.projectCategory === "all" || categoryIdsForEntity("project", project).includes(ui.projectCategory));
    });
    projects.sort(function(a, b) {
      if (ui.projectSort === "name") return a.name.localeCompare(b.name);
      if (ui.projectSort === "progress") return b.progress - a.progress;
      return (a.deadline || "9999-12-31").localeCompare(b.deadline || "9999-12-31");
    });
    return '<section class="lc-section" aria-labelledby="projects-title"><div class="lc-section-head"><div>' +
      '<h2 id="projects-title">Projects</h2><p class="lc-muted">Use and log Project Actions here. Build structure in Settings.</p></div>' +
      '<button type="button" class="btn btn-ghost" data-open-build="projects">Open builder</button></div>' +
      '<div class="lc-filter-row"><select class="form-select" id="project-status-filter">' +
      ["active", "paused", "parked", "completed", "all"].map(function(status) {
        return '<option value="' + status + '"' + (ui.projectStatus === status ? " selected" : "") +
          ">" + cap(status) + "</option>";
      }).join("") + '</select><select class="form-select" id="project-category-filter">' +
      categoryOptions(ui.projectCategory, true) + '</select><select class="form-select" id="project-sort">' +
      '<option value="deadline"' + (ui.projectSort === "deadline" ? " selected" : "") +
      '>Deadline</option><option value="name"' + (ui.projectSort === "name" ? " selected" : "") +
      '>Name</option><option value="progress"' + (ui.projectSort === "progress" ? " selected" : "") +
      ">Progress</option></select></div>" +
      (projects.length ? '<div class="lc-cards">' + projects.map(projectCard).join("") + "</div>" :
        '<p class="lc-empty">No matching Projects.</p>') + "</section>";
  }

  function renderReviewForm() {
    if (!ui.reviewDraft) return "";
    const draft = ui.reviewDraft;
    return '<form class="card lc-card-stack" id="review-form"><div class="lc-section-head"><h3>' +
      (draft.id ? "Edit Review" : "New Review") +
      '</h3><button type="button" class="btn btn-ghost" data-action="review-cancel">Cancel</button></div>' +
      '<div class="lc-form-grid"><div><label class="form-label" for="review-name">Review name / type</label>' +
      '<input class="form-control" id="review-name" required value="' + esc(draft.name) + '"></div>' +
      '<div><label class="form-label" for="review-date">Date</label><input class="form-control" id="review-date" type="date" required value="' +
      esc(draft.date) + '"></div><div class="lc-span-all"><label class="form-label" for="review-notes">Notes / answers</label>' +
      '<textarea class="form-control" id="review-notes" rows="7">' + esc(draft.notes) + '</textarea></div></div>' +
      '<div class="lc-actions"><button type="submit" class="btn btn-primary">Save Review</button>' +
      (draft.id ? '<button type="button" class="btn btn-ghost" data-action="review-delete">Delete Review</button>' : "") +
      "</div></form>";
  }

  function renderReviews() {
    const reviews = state.reviews.slice().sort(function(a, b) {
      if (a.status !== b.status) return a.status === "draft" ? -1 : 1;
      return b.date.localeCompare(a.date);
    });
    return '<section class="lc-section" aria-labelledby="reviews-title"><div class="lc-section-head"><div>' +
      '<h2 id="reviews-title">Reviews</h2><p class="lc-muted">Simple dated records for now.</p></div>' +
      '<button type="button" class="btn btn-primary" data-action="review-new">Create Review</button></div>' +
      renderReviewForm() + '<div>' +
      (reviews.length ? reviews.map(function(review) {
        return '<div class="lc-row"><div class="lc-row-main"><div class="lc-inline"><strong>' +
          esc(review.name) + '</strong><span class="viz-badge">' + cap(review.status) +
          '</span></div><div class="lc-meta text-small"><span>' + formatDate(review.date) +
          '</span></div>' + (review.notes ? '<p>' + esc(review.notes.length > 180
            ? review.notes.slice(0, 177) + "…" : review.notes) + "</p>" : "") +
          '</div><button type="button" class="btn" data-action="review-edit" data-id="' +
          review.id + '">Open</button></div>';
      }).join("") : '<p class="lc-empty">No Reviews yet.</p>') + "</div></section>";
  }

  function rangeStart(range) {
    if (range === "all") return null;
    return addDays(todayISO(), -(Number(range) - 1));
  }

  function logMatches(log, prefix) {
    const range = ui[prefix + "Range"];
    const start = rangeStart(range);
    if (start && dayDiff(datePart(log.eventAt), start) < 0) return false;
    const category = ui[prefix + "Category"];
    if (category !== "all" && log.categoryId !== category) return false;
    const action = ui[prefix + "Action"];
    if (action !== "all" && log.actionId !== action) return false;
    const project = ui[prefix + "Project"];
    if (project !== "all") {
      const projectNow = findProject(project);
      const historicallyLinked = log.reactions && log.reactions.projectIds &&
        log.reactions.projectIds.includes(project);
      const currentlyLinked = projectNow && projectNow.actionIds.includes(log.actionId);
      if (!historicallyLinked && !currentlyLinked) return false;
    }
    if (prefix === "analysis") {
      const block = ui.analysisBlock;
      if (block !== "all") {
        const item = findBlock(block);
        if (!item || !item.actionIds.includes(log.actionId)) return false;
      }
      const cycle = ui.analysisCycle;
      if (cycle !== "all") {
        const item = findCycle(cycle);
        if (!item || !actionIdsForCycle(item).includes(log.actionId)) return false;
      }
      const actionStatus = ui.analysisActionStatus;
      const current = findAction(log.actionId);
      if (actionStatus !== "all" && (!current || current.status !== actionStatus)) return false;
      if (ui.analysisPolarity !== "all" && log.polarity !== ui.analysisPolarity) return false;
      if (ui.analysisOutcome !== "all" && log.outcome !== ui.analysisOutcome) return false;
    } else if (prefix === "history") {
      if (ui.historyOutcome !== "all" && log.outcome !== ui.historyOutcome) return false;
    }
    return true;
  }

  function analysisLogs() {
    return state.actionLogs.filter(function(log) { return logMatches(log, "analysis"); });
  }

  function historyEventMatchesAnalysis(event) {
    const start = rangeStart(ui.analysisRange);
    if (start && dayDiff(datePart(event.timestamp), start) < 0) return false;
    if (ui.analysisCategory !== "all" && event.categoryId !== ui.analysisCategory) return false;
    if (ui.analysisAction !== "all" && event.actionId !== ui.analysisAction) return false;
    if (ui.analysisProject !== "all" && !(event.projectIds || []).includes(ui.analysisProject)) return false;
    if (ui.analysisOutcome !== "all" && event.outcome !== ui.analysisOutcome) return false;
    if (ui.analysisPolarity !== "all" && event.actionId) {
      const action = findAction(event.actionId);
      if (!action || action.polarity !== ui.analysisPolarity) return false;
    }
    return true;
  }

  function metricCard(label, value, note) {
    return '<div class="card viz-stat"><span class="text-muted">' + esc(label) +
      '</span><span class="viz-stat-value">' + esc(value) + "</span>" +
      (note ? '<span class="text-small">' + esc(note) + "</span>" : "") + "</div>";
  }

  function analysisFilterHtml() {
    const select = function(id, label, options) {
      return '<label class="sr-only" for="' + id + '">' + label + '</label><select class="form-select" id="' +
        id + '">' + options + "</select>";
    };
    const simpleOptions = function(values, selected) {
      return values.map(function(pair) {
        return '<option value="' + pair[0] + '"' + (selected === pair[0] ? " selected" : "") +
          ">" + pair[1] + "</option>";
      }).join("");
    };
    return '<details><summary>Filters</summary><div class="lc-filter-row">' +
      select("analysis-range", "Date range", simpleOptions([
        ["7", "7 days"], ["28", "28 days"], ["90", "90 days"], ["all", "All time"]
      ], ui.analysisRange)) +
      select("analysis-category", "Category", categoryOptions(ui.analysisCategory, true)) +
      select("analysis-action", "Action", '<option value="all">All Actions</option>' + actionOptions(ui.analysisAction, false)) +
      select("analysis-block", "Block", '<option value="all">All Blocks</option>' + state.blocks.map(function(block) {
        return '<option value="' + block.id + '"' + (ui.analysisBlock === block.id ? " selected" : "") +
          ">" + esc(block.name) + "</option>";
      }).join("")) +
      select("analysis-cycle", "Cycle", '<option value="all">All Cycles</option>' + state.cycles.map(function(cycle) {
        return '<option value="' + cycle.id + '"' + (ui.analysisCycle === cycle.id ? " selected" : "") +
          ">" + esc(cycle.name) + "</option>";
      }).join("")) +
      select("analysis-project", "Project", '<option value="all">All Projects</option>' + state.projects.map(function(project) {
        return '<option value="' + project.id + '"' + (ui.analysisProject === project.id ? " selected" : "") +
          ">" + esc(project.name) + "</option>";
      }).join("")) +
      select("analysis-action-status", "Action status", simpleOptions([
        ["all", "All Action statuses"], ["active", "Active"], ["paused", "Paused"], ["archived", "Archived"]
      ], ui.analysisActionStatus)) +
      select("analysis-outcome", "Outcome", simpleOptions([
        ["all", "Success + failure"], ["success", "Success"], ["failure", "Failure"]
      ], ui.analysisOutcome)) +
      select("analysis-polarity", "Positive or negative", simpleOptions([
        ["all", "Positive + negative"], ["positive", "Positive"], ["negative", "Negative"]
      ], ui.analysisPolarity)) + "</div></details>";
  }

  function renderCategoryChart(logs) {
    const totals = new Map();
    logs.forEach(function(log) {
      const label = log.categoryNameSnapshot || "Uncategorised";
      totals.set(label, (totals.get(label) || 0) + log.durationMinutes);
    });
    const rows = Array.from(totals.entries()).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 8);
    if (!rows.length) return '<p class="lc-empty">Log some Actions to begin the category view.</p>';
    const max = Math.max.apply(null, rows.map(function(row) { return row[1]; }).concat([1]));
    const summary = rows.map(function(row) { return row[0] + " " + formatMinutes(row[1]); }).join(", ");
    return '<div class="lc-chart" role="img" aria-label="Category time: ' + esc(summary) + '">' +
      rows.map(function(row) {
        const width = Math.round(row[1] / max * 100);
        return '<div class="lc-bar-row"><span class="text-small">' + esc(row[0]) +
          '</span><div class="lc-bar-track" aria-hidden="true"><div class="lc-bar-fill" style="width:' +
          width + '%"></div></div><span class="text-small lc-nowrap">' + formatMinutes(row[1]) + "</span></div>";
      }).join("") + "</div>";
  }

  function renderAnalysis() {
    const logs = analysisLogs();
    const events = state.history.filter(historyEventMatchesAnalysis);
    const minutes = logs.reduce(function(total, log) { return total + log.durationMinutes; }, 0);
    const successfulLoops = logs.filter(function(log) {
      return log.reactions && log.reactions.repeatingSuccess;
    }).length + events.filter(function(event) {
      return event.event === "negative_period_succeeded";
    }).reduce(function(total, event) {
      return total + Number(event.metadata && event.metadata.count || 1);
    }, 0);
    const missedLoops = events.filter(function(event) {
      return event.event === "repeating_missed_loop";
    }).reduce(function(total, event) {
      return total + Number(event.metadata && event.metadata.count || 1);
    }, 0);
    const completedTasks = events.filter(function(event) {
      return event.event === "action_task_succeeded" || event.event === "quick_task_completed";
    }).length;
    const failedTasks = events.filter(function(event) {
      return event.event === "action_task_failed" || event.event === "quick_task_failed";
    }).length;
    const projectActivityCount = logs.filter(function(log) {
      return log.reactions && log.reactions.projectIds && log.reactions.projectIds.length;
    }).length;
    const capacity = logs.filter(function(log) {
      return log.countsTowardCapacitySnapshot;
    }).reduce(function(total, log) { return total + log.durationMinutes; }, 0);
    return '<section class="lc-section" aria-labelledby="analysis-title"><div class="lc-section-head"><div>' +
      '<h2 id="analysis-title">Progress & Analysis</h2><p class="lc-muted">Calculated from Action Logs and History.</p></div></div>' +
      analysisFilterHtml() + '<div class="viz-grid">' +
      metricCard("Action logs", String(logs.length)) +
      metricCard("Time spent", formatMinutes(minutes)) +
      metricCard("Successful loops", String(successfulLoops)) +
      metricCard("Missed loops", String(missedLoops)) +
      metricCard("Completed tasks", String(completedTasks)) +
      metricCard("Failed tasks", String(failedTasks)) +
      metricCard("Project activity", String(projectActivityCount)) +
      metricCard("Capacity used", formatMinutes(capacity)) +
      "</div></section>" +
      '<section class="lc-section" aria-labelledby="category-activity-title"><div class="lc-section-head"><h2 id="category-activity-title">Category activity</h2></div>' +
      renderCategoryChart(logs) + "</section>";
  }

  function sortedHistory() {
    return state.history.slice().sort(function(a, b) {
      return b.timestamp.localeCompare(a.timestamp) || Number(b.sequence || 0) - Number(a.sequence || 0);
    });
  }

  function historyRow(event) {
    return '<div class="lc-row"><div class="lc-row-main"><div class="lc-meta text-small"><span>' +
      formatDateTime(event.timestamp) + '</span><span>' + cap(event.type) +
      (event.nameSnapshot ? " • " + esc(event.nameSnapshot) : "") + '</span><span>' +
      cap(event.outcome) + '</span></div><p>' + esc(event.description) +
      '</p></div></div>';
  }

  function historyEventMatches(event) {
    const start = rangeStart(ui.historyRange);
    if (start && dayDiff(datePart(event.timestamp), start) < 0) return false;
    if (ui.historyType !== "all" && event.type !== ui.historyType) return false;
    if (ui.historyCategory !== "all" && event.categoryId !== ui.historyCategory) return false;
    if (ui.historyAction !== "all" && event.actionId !== ui.historyAction) return false;
    if (ui.historyProject !== "all" && !(event.projectIds || []).includes(ui.historyProject)) return false;
    if (ui.historyOutcome !== "all" && event.outcome !== ui.historyOutcome) return false;
    return true;
  }

  function renderHistory() {
    const events = sortedHistory().filter(historyEventMatches);
    const optionPairs = function(values, selected) {
      return values.map(function(pair) {
        return '<option value="' + pair[0] + '"' + (selected === pair[0] ? " selected" : "") +
          ">" + pair[1] + "</option>";
      }).join("");
    };
    return '<section class="lc-section" aria-labelledby="history-title"><div class="lc-section-head"><div>' +
      '<h2 id="history-title">History</h2><p class="lc-muted">Permanent chronological events with name snapshots and stable references.</p></div></div>' +
      '<details><summary>Filters</summary><div class="lc-filter-row">' +
      '<select class="form-select" id="history-range">' + optionPairs([
        ["7", "7 days"], ["28", "28 days"], ["90", "90 days"], ["all", "All time"]
      ], ui.historyRange) + '</select><select class="form-select" id="history-type">' + optionPairs([
        ["all", "All event types"], ["action", "Action Logs"], ["cycle", "Cycles"],
        ["repeating", "Repeating"], ["todo", "To-do"], ["project", "Projects"],
        ["review", "Reviews"], ["build", "Build changes"], ["legacy", "Imported V1"]
      ], ui.historyType) + '</select><select class="form-select" id="history-category">' +
      categoryOptions(ui.historyCategory, true) + '</select><select class="form-select" id="history-action">' +
      '<option value="all">All Actions</option>' + actionOptions(ui.historyAction, false) +
      '</select><select class="form-select" id="history-project"><option value="all">All Projects</option>' +
      state.projects.map(function(project) {
        return '<option value="' + project.id + '"' + (ui.historyProject === project.id ? " selected" : "") +
          ">" + esc(project.name) + "</option>";
      }).join("") + '</select><select class="form-select" id="history-outcome">' + optionPairs([
        ["all", "All outcomes"], ["success", "Success"], ["failure", "Failure"], ["neutral", "Neutral"]
      ], ui.historyOutcome) + "</select></div></details><div>" +
      (events.length ? events.map(historyRow).join("") : '<p class="lc-empty">No matching History.</p>') +
      "</div></section>";
  }

  function renderSettings() {
    const tabs = [
      ["general", "Capacity"],
      ["build", "Build"],
      ["backup", "Backup"]
    ].map(function(pair) {
      return '<button type="button" class="btn' + (ui.settingsTab === pair[0] ? " btn-primary" : "") +
        '" data-settings-tab="' + pair[0] + '" aria-pressed="' + (ui.settingsTab === pair[0]) +
        '">' + pair[1] + "</button>";
    }).join("");
    let content = renderCapacitySettings();
    if (ui.settingsTab === "build") content = renderBuild();
    if (ui.settingsTab === "backup") content = renderBackup();
    return '<section class="lc-section" aria-labelledby="settings-title"><div class="lc-section-head"><div>' +
      '<h2 id="settings-title">Settings</h2><p class="lc-muted">System structure and backup live here.</p></div></div>' +
      '<div class="lc-tabs">' + tabs + "</div></section>" + content;
  }

  function renderCapacitySettings() {
    const capacity = state.settings.capacity;
    const used = capacityUsedMinutes();
    const remaining = capacity.availableMinutes - used;

      " calendar days, including today.</p></section>";
  }

  function recurrenceSummary(action) {
    if (!action.recurrence || !action.recurrence.enabled) return "No repetition";
    const recurrence = action.recurrence;
    let end = "Unlimited";
    if (recurrence.mode === "loops") end = recurrence.totalLoops + " loops";
    if (recurrence.mode === "until") end = "Until " + formatDate(recurrence.repeatUntil);
    return "Every " + recurrence.intervalDays + " day" +
      (recurrence.intervalDays === 1 ? "" : "s") + " • " + end;

  function removePermanent(type, id) {
    const singular = type.slice(0, -1);
    const item = (state[type] || []).find(function(candidate) { return candidate.id === id; });
    if (!item) return;
    const historyCount = historyCountFor(singular, id);
    let references = 0;
    if (type === "actions") {
      references += state.blocks.filter(function(block) { return block.actionIds.includes(id); }).length;
      references += state.cycles.filter(function(cycle) {
        return cycle.items.some(function(cycleItem) { return cycleItem.kind === "action" && cycleItem.refId === id; });
      }).length;
      references += state.projects.filter(function(project) { return project.actionIds.includes(id); }).length;
      references += state.actionTasks.filter(function(task) { return task.actionId === id && task.status === "active"; }).length;
    }
    if (type === "blocks") {
      references += state.cycles.filter(function(cycle) {
        return cycle.items.some(function(cycleItem) { return cycleItem.kind === "block" && cycleItem.refId === id; });
      }).length;
    }
    if (type === "categories") {
      references += state.actions.filter(function(action) { return action.categoryId === id; }).length;
    }
    const warning = historyCount || references
      ? "This object has " + historyCount + " History event(s) and " + references +
        " current reference(s). Archive is safer. Delete anyway? Historical records will remain."
      : "Permanently delete " + item.name + "?";
    if (!confirm(warning)) return;

    if (type === "actions") {
      state.blocks.forEach(function(block) {
        block.actionIds = block.actionIds.filter(function(actionId) { return actionId !== id; });
      });
      state.cycles.forEach(function(cycle) {
        cycle.items = cycle.items.filter(function(cycleItem) {
          return !(cycleItem.kind === "action" && cycleItem.refId === id);
        });
        cycle.currentIndex = cycle.items.length ? Math.min(cycle.currentIndex, cycle.items.length - 1) : 0;
      });
      state.projects.forEach(function(project) {
        project.actionIds = project.actionIds.filter(function(actionId) { return actionId !== id; });
      });
    }
    if (type === "blocks") {
      state.cycles.forEach(function(cycle) {
        cycle.items = cycle.items.filter(function(cycleItem) {
          return !(cycleItem.kind === "block" && cycleItem.refId === id);
        });
        cycle.currentIndex = cycle.items.length ? Math.min(cycle.currentIndex, cycle.items.length - 1) : 0;
      });
    }
    if (type === "categories") {
      state.actions.forEach(function(action) {
        if (action.categoryId === id) action.categoryId = null;
      });
    }
    state[type] = state[type].filter(function(candidate) { return candidate.id !== id; });
    appendHistory({
      type: "build",
      event: "definition_deleted",
      objectType: singular,
      objectId: id,
      nameSnapshot: item.name,
      outcome: "neutral",
      description: "Deleted " + cap(singular) + " definition: " + item.name,
      metadata: { historyPreserved: true, referencesRemoved: references }
    });
    ui.buildDraft = null;
    persist();
    setFlash(item.name + " deleted. Historical records were kept.");
  }

      '<label class="form-label" for="export-json">Complete backup</label><textarea class="form-control lc-json" id="export-json" readonly>' +
      esc(exported) + '</textarea><div class="lc-actions"><button type="button" class="btn btn-primary" data-action="copy-export">Copy JSON</button></div></section>' +
      '<section class="lc-section" aria-labelledby="import-title"><div class="lc-section-head"><div>' +
      '<h2 id="import-title">Import</h2><p class="lc-muted">Validate and replace the current state. Exact backups are not merged, so History is not duplicated.</p></div></div>' +
      '<form id="import-form" class="lc-card-stack"><label class="form-label" for="import-json">Paste V2 or V1 backup JSON</label>' +
      '<textarea class="form-control lc-json" id="import-json">' + esc(ui.importText) +
      '</textarea><div class="lc-actions"><button type="submit" class="btn btn-primary">Validate and restore</button></div></form>' +
      '<p class="text-small text-muted">Browser storage is convenient but not guaranteed permanent or synced. Keep exports as backups.</p></section>';
  }

  function completeQuickTask(id) {
    const task = state.quickTasks.find(function(item) { return item.id === id; });
    if (!task || task.status !== "active") return;
    task.status = "completed";
    task.resolvedAt = nowISO();
    appendHistory({
      type: "todo",
      event: "quick_task_completed",
      objectType: "quick_task",
      objectId: task.id,
      nameSnapshot: task.name,
      outcome: "success",
      description: "Completed quick task: " + task.name,
      metadata: { date: task.date, deadline: task.deadline }
    });
    persist();
    setFlash(task.name + " completed.");
  }

  function saveReview() {
    const draft = ui.reviewDraft;
    const name = normalizeName(root.querySelector("#review-name").value);
    const date = root.querySelector("#review-date").value;
    const notes = root.querySelector("#review-notes").value.trim();
    if (!name || !validDate(date)) {
      setFlash("Add a valid Review name and date.", true);
      return false;
    }
    const stamp = nowISO();
    if (draft.id) {
      const review = state.reviews.find(function(item) { return item.id === draft.id; });
      const firstSave = review.status !== "saved";
      Object.assign(review, {
        name: name, date: date, notes: notes, status: "saved", updatedAt: stamp,
        completedAt: review.completedAt || stamp
      });
      if (firstSave) {
        appendHistory({
          type: "review",
          event: "review_saved",
          objectType: "review",
          objectId: review.id,
          nameSnapshot: name,
          outcome: "success",
          description: "Saved Review: " + name,
          metadata: { reviewDate: date }
        });
      }
    } else {
      const review = {
        id: uid("review"), name: name, date: date, notes: notes, status: "saved",
        createdAt: stamp, updatedAt: stamp, completedAt: stamp
      };
      state.reviews.push(review);
      appendHistory({
        type: "review",
        event: "review_saved",
        objectType: "review",
        objectId: review.id,
        nameSnapshot: name,
        outcome: "success",
        description: "Saved Review: " + name,
        metadata: { reviewDate: date }
      });
    }
    ui.reviewDraft = null;
    persist();
    setFlash("Review saved.");
    return true;
  }

  function saveBuildDefinition(type) {
    const draft = ui.buildDraft;
    const collection = state[type];
    const name = normalizeName(root.querySelector("#build-name").value);
    if (!name) {
      setFlash("Use letters, numbers and spaces for the name.", true);
      return false;
    }
    if (nameExists(type, name, draft.id)) {
      setFlash("A " + cap(type.slice(0, -1)) + " named “" + name + "” already exists. Edit the existing one instead.", true);
      return false;
    }
    const stamp = nowISO();
    let saved = clone(draft);
    saved.name = name;
    if (type === "categories") {
      saved.status = root.querySelector("#build-object-status").value;
    }
    if (type === "actions") {
      const old = draft.id ? findAction(draft.id) : null;
      const enabled = root.querySelector("#build-action-repeat").checked;
      const mode = root.querySelector("#build-action-mode").value;
      const interval = Math.max(1, Math.round(Number(root.querySelector("#build-action-interval").value) || 1));
      const loops = Math.max(1, Math.round(Number(root.querySelector("#build-action-loops").value) || 1));
      const until = root.querySelector("#build-action-until").value || null;
      let recurrence = old ? clone(old.recurrence) : makeRecurrence(null, "unlimited", null, null, stamp);
      if (!enabled) {
        recurrence = makeRecurrence(null, "unlimited", null, null, stamp);
      } else {
        const structuralChange = !recurrence.enabled || recurrence.intervalDays !== interval ||
          recurrence.mode !== mode || recurrence.totalLoops !== (mode === "loops" ? loops : null) ||
          recurrence.repeatUntil !== (mode === "until" ? until : null);
        if (structuralChange) {
          recurrence = makeRecurrence(interval, mode, loops, until, stamp);
        }
      }
      saved = {
        id: draft.id,
        name: name,
        categoryId: root.querySelector("#build-action-category").value || null,
        description: root.querySelector("#build-action-description").value.trim(),
        polarity: root.querySelector("#build-action-polarity").value,
        countsTowardCapacity: root.querySelector("#build-action-capacity").checked,
        status: root.querySelector("#build-action-status").value,
        recurrence: recurrence,
        createdAt: old ? old.createdAt : stamp,
        updatedAt: stamp
      };
    }
    if (type === "blocks") {
      saved.status = root.querySelector("#build-object-status").value;
    }
    if (type === "cycles") {
      saved.status = root.querySelector("#build-cycle-status").value;
      saved.currentIndex = draft.items.length
        ? Math.max(0, Math.min(draft.items.length - 1, Number(root.querySelector("#build-cycle-current").value) || 0))
        : 0;
    }
    if (type === "projects") {
      const noDeadline = root.querySelector("#build-project-no-deadline").checked;
      const startDate = root.querySelector("#build-project-start").value;
      const deadline = noDeadline ? null : root.querySelector("#build-project-deadline").value || null;
      if (!validDate(startDate) || deadline && !validDate(deadline)) {
        setFlash("Use valid Project dates.", true);
        return false;
      }
      saved.description = root.querySelector("#build-project-description").value.trim();
      saved.startDate = startDate;
      saved.deadline = deadline;
      saved.status = root.querySelector("#build-project-status").value;
      saved.progress = Number(root.querySelector("#build-project-progress").value);
      saved.notes = root.querySelector("#build-project-notes").value.trim();
      saved.completedAt = saved.status === "completed" ? saved.completedAt || stamp : null;
    }
    if (draft.id) {
      const index = collection.findIndex(function(item) { return item.id === draft.id; });
      const existing = collection[index];
      saved.createdAt = existing.createdAt;
      saved.updatedAt = stamp;
      collection[index] = saved;
      appendHistory({
        type: "build",
        event: "definition_updated",
        objectType: type.slice(0, -1),
        objectId: saved.id,
        nameSnapshot: saved.name,
        actionId: type === "actions" ? saved.id : null,
        categoryId: type === "actions" ? saved.categoryId : null,
        projectIds: type === "projects" ? [saved.id] : [],
        outcome: "neutral",
        description: "Updated " + cap(type.slice(0, -1)) + ": " + saved.name
      });
    } else {
      saved.id = uid(type.slice(0, -1));
      saved.createdAt = stamp;
      saved.updatedAt = stamp;
      collection.push(saved);
      appendHistory({
        type: "build",
        event: "definition_created",
        objectType: type.slice(0, -1),
        objectId: saved.id,
        nameSnapshot: saved.name,
        actionId: type === "actions" ? saved.id : null,
        categoryId: type === "actions" ? saved.categoryId : null,
        projectIds: type === "projects" ? [saved.id] : [],
        outcome: "neutral",
        description: "Created " + cap(type.slice(0, -1)) + ": " + saved.name
      });
    }
    ui.buildDraft = null;
    persist();
    setFlash(cap(type.slice(0, -1)) + " saved.");
    return true;
  }

  root.addEventListener("click", function(event) {
    const pageButton = event.target.closest("[data-page]");
    if (pageButton) {
      ui.page = pageButton.dataset.page;
      ui.flash = null;
      ui.logger = null;
      ui.buildDraft = null;
      ui.todoDraft = null;
      ui.reviewDraft = null;
      render();
      return;
    }
    const openBuild = event.target.closest("[data-open-build]");
    if (openBuild) {
      ui.page = "settings";
      ui.settingsTab = "build";
      ui.buildType = openBuild.dataset.openBuild;
      ui.buildDraft = null;
      ui.flash = null;
      render();
      return;
    }
    const button = event.target.closest("[data-action]");
    if (!button) return;
    const action = button.dataset.action;
    const id = button.dataset.id;

    if (action === "open-log") {
      openLogger(id, button.dataset.source);
      render();
    } else if (action === "logger-close") {
      ui.logger = null;
      render();
    } else if (action === "log-fast") {
      if (ui.logger) {
        logAction(ui.logger.actionId, Number(button.dataset.minutes), ui.logger.source);
        ui.logger = null;
      }
      render();
    } else if (action === "cycle-advance") {
      const cycle = findCycle(id);
      if (cycle) {
        advanceCycle(cycle, "manual_block_completion", null, null);
        persist();
        setFlash(cycle.name + " advanced.");
      }
      render();
    } else if (action === "cycle-toggle") {
      const cycle = findCycle(id);
      if (cycle) {
        const previous = cycle.status;
        cycle.status = cycle.status === "active" ? "paused" : "active";
        cycle.updatedAt = nowISO();
        appendHistory({
          type: "cycle",
          event: "cycle_status_changed",
          objectType: "cycle",
          objectId: cycle.id,
          nameSnapshot: cycle.name,
          outcome: "neutral",
          description: cycle.name + " changed from " + cap(previous) + " → " + cap(cycle.status)
        });
        persist();
        setFlash(cycle.name + " is now " + cycle.status + ".");
      }
      render();
    } else if (action === "action-use-status") {
      const item = findAction(id);
      if (item) {
        const previous = item.status;
        item.status = button.dataset.status;
        item.updatedAt = nowISO();
        appendHistory({
          type: "build",
          event: "action_status_changed",
          objectType: "action",
          objectId: item.id,
          nameSnapshot: item.name,
          actionId: item.id,
          categoryId: item.categoryId,
          outcome: "neutral",
          description: item.name + " changed from " + cap(previous) + " → " + cap(item.status)
        });
        persist();
      }
      render();
    } else if (action === "todo-new-action") {
      const first = state.actions.find(function(item) { return item.status !== "archived"; });
      ui.todoDraft = {
        kind: "action",
        actionId: first ? first.id : null,
        type: "deadline",
        targetDate: addDays(todayISO(), 7)
      };
      render();
    } else if (action === "todo-new-quick") {
      ui.todoDraft = { kind: "quick", name: "", date: null, time: null, deadline: null };
      render();
    } else if (action === "todo-cancel") {
      ui.todoDraft = null;
      render();
    } else if (action === "quick-complete") {
      completeQuickTask(id);
      render();
    } else if (action === "todo-remove") {
      if (button.dataset.kind === "action") {
        state.actionTasks = state.actionTasks.filter(function(item) { return item.id !== id; });
      } else {
        state.quickTasks = state.quickTasks.filter(function(item) { return item.id !== id; });
      }
      persist();
      setFlash("Removed from the current To-do list. Existing History was kept.");
      render();
    } else if (action === "review-new") {
      ui.reviewDraft = { id: null, name: "", date: todayISO(), notes: "", status: "draft" };
      render();
    } else if (action === "review-edit") {
      const review = state.reviews.find(function(item) { return item.id === id; });
      if (review) ui.reviewDraft = clone(review);
      render();
    } else if (action === "review-cancel") {
      ui.reviewDraft = null;
      render();
    } else if (action === "review-delete") {
      if (ui.reviewDraft && ui.reviewDraft.id && confirm("Delete this Review? Its History will remain.")) {
        state.reviews = state.reviews.filter(function(item) { return item.id !== ui.reviewDraft.id; });
        ui.reviewDraft = null;
        persist();
        setFlash("Review deleted. History was kept.");
      }
      render();
    } else if (action === "build-new") {
      ui.buildDraft = emptyBuildDraft(ui.buildType);
      render();
    } else if (action === "build-edit") {
      const item = (state[ui.buildType] || []).find(function(candidate) { return candidate.id === id; });
      if (item) ui.buildDraft = clone(item);
      render();
    } else if (action === "build-cancel") {
      ui.buildDraft = null;
      render();
    } else if (action === "build-archive" || action === "build-restore") {
      const item = (state[ui.buildType] || []).find(function(candidate) { return candidate.id === id; });
      if (item) {
        const previous = item.status;
        item.status = action === "build-archive" ? "archived" : "active";
        item.updatedAt = nowISO();
        appendHistory({
          type: "build",
          event: "definition_status_changed",
          objectType: ui.buildType.slice(0, -1),
          objectId: item.id,
          nameSnapshot: item.name,
          actionId: ui.buildType === "actions" ? item.id : null,
          categoryId: ui.buildType === "actions" ? item.categoryId : null,
          projectIds: ui.buildType === "projects" ? [item.id] : [],
          outcome: "neutral",
          description: item.name + " changed from " + cap(previous) + " → " + cap(item.status)
        });
        persist();
      }
      render();
    } else if (action === "build-delete") {
      removePermanent(ui.buildType, id);
      render();
    } else if (action === "add-action-ref") {
      const select = root.querySelector("#add-action-ref");
      if (select && select.value && ui.buildDraft && !ui.buildDraft.actionIds.includes(select.value)) {
        ui.buildDraft.actionIds.push(select.value);
      }
      render();
    } else if (action === "remove-action-ref") {
      if (ui.buildDraft) {
        ui.buildDraft.actionIds = ui.buildDraft.actionIds.filter(function(actionId) { return actionId !== id; });
      }
      render();
    } else if (action === "add-cycle-item") {
      const refSelect = root.querySelector("#cycle-add-ref");
      if (refSelect && refSelect.value && ui.buildDraft) {
        const parts = refSelect.value.split(":");
        ui.buildDraft.items.push({ id: uid("cycle_item"), kind: parts[0], refId: parts[1] });
      }
      render();
    } else if (action === "remove-cycle-item") {
      if (ui.buildDraft) {
        const oldIndex = ui.buildDraft.items.findIndex(function(item) { return item.id === id; });
        ui.buildDraft.items = ui.buildDraft.items.filter(function(item) { return item.id !== id; });
        if (oldIndex < ui.buildDraft.currentIndex) ui.buildDraft.currentIndex -= 1;
        ui.buildDraft.currentIndex = ui.buildDraft.items.length
          ? Math.max(0, Math.min(ui.buildDraft.currentIndex, ui.buildDraft.items.length - 1)) : 0;
      }
      render();
    } else if (action === "copy-export") {
      const textarea = root.querySelector("#export-json");
      const fallback = function() {
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).catch(fallback);
      } else {
        fallback();
      }
      setFlash("JSON backup copied.");
      render();
    }
  });

  root.addEventListener("change", function(event) {
    const target = event.target;
    if (target.id === "lc-page-select") {
      ui.page = target.value;
      ui.flash = null;
      ui.logger = null;
      ui.buildDraft = null;
      ui.todoDraft = null;
      ui.reviewDraft = null;
      render();
    } else if (target.matches("[data-settings-tab]")) {
      ui.settingsTab = target.dataset.settingsTab;
      ui.buildDraft = null;
      render();
    } else if (target.id === "cycle-status-filter") {
      ui.cycleStatus = target.value; render();
    } else if (target.id === "cycle-category-filter") {
      ui.cycleCategory = target.value; render();
    } else if (target.id === "cycle-sort") {
      ui.cycleSort = target.value; render();
    } else if (target.id === "action-status-filter") {
      ui.actionStatus = target.value; render();
    } else if (target.id === "action-category-filter") {
      ui.actionCategory = target.value; render();
    } else if (target.id === "action-sort") {
      ui.actionSort = target.value; render();
    } else if (target.id === "todo-status-filter") {
      ui.todoStatus = target.value; render();
    } else if (target.id === "todo-kind-filter") {
      ui.todoKind = target.value; render();
    } else if (target.id === "todo-sort") {
      ui.todoSort = target.value; render();
    } else if (target.id === "task-type" && ui.todoDraft) {
      ui.todoDraft.type = target.value;
      if (target.value === "one_time") ui.todoDraft.targetDate = null;
      if (target.value !== "one_time" && !ui.todoDraft.targetDate) ui.todoDraft.targetDate = addDays(todayISO(), 7);
      render();
    } else if (target.id === "project-status-filter") {
      ui.projectStatus = target.value; render();
    } else if (target.id === "project-category-filter") {
      ui.projectCategory = target.value; render();
    } else if (target.id === "project-sort") {
      ui.projectSort = target.value; render();
    } else if (target.matches("[data-project-use-status]")) {
      setProjectStatus(target.dataset.projectUseStatus, target.value, "projects_view");
      render();
    } else if (target.matches("[data-build-type]")) {
      ui.buildType = target.dataset.buildType;
      ui.buildDraft = null;
      ui.buildSearch = "";
      ui.buildStatus = "all";
      ui.buildCategory = "all";
      render();
    } else if (target.id === "build-status") {
      ui.buildStatus = target.value; render();
    } else if (target.id === "build-category") {
      ui.buildCategory = target.value; render();
    } else if (target.matches("[data-ref-position]") && ui.buildDraft) {
      const oldIndex = ui.buildDraft.actionIds.indexOf(target.dataset.refPosition);
      const newIndex = Number(target.value);
      if (oldIndex >= 0) {
        const moved = ui.buildDraft.actionIds.splice(oldIndex, 1)[0];
        ui.buildDraft.actionIds.splice(newIndex, 0, moved);
      }
      render();
    } else if (target.matches("[data-cycle-item-position]") && ui.buildDraft) {
      const oldIndex = ui.buildDraft.items.findIndex(function(item) {
        return item.id === target.dataset.cycleItemPosition;
      });
      const newIndex = Number(target.value);
      if (oldIndex >= 0) {
        const currentItemId = ui.buildDraft.items[ui.buildDraft.currentIndex]?.id;
        const moved = ui.buildDraft.items.splice(oldIndex, 1)[0];
        ui.buildDraft.items.splice(newIndex, 0, moved);
        ui.buildDraft.currentIndex = Math.max(0, ui.buildDraft.items.findIndex(function(item) {
          return item.id === currentItemId;
        }));
      }
      render();
    } else if (target.id === "cycle-add-kind") {
      const select = root.querySelector("#cycle-add-ref");
      if (select) {
        const kind = target.value;
        const collection = kind === "action"
          ? state.actions.filter(function(item) { return item.status !== "archived"; })
          : state.blocks.filter(function(item) { return item.status !== "archived"; });
        select.innerHTML = collection.map(function(item) {
          return '<option value="' + kind + ":" + item.id + '">' + esc(item.name) + "</option>";
        }).join("");
      }
    } else if (target.id === "build-action-repeat") {
      const enabled = target.checked;
      ["build-action-interval", "build-action-mode"].forEach(function(id) {
        const field = root.querySelector("#" + id);
        if (field) field.disabled = !enabled;
      });
      const mode = root.querySelector("#build-action-mode")?.value;
      const loops = root.querySelector("#build-action-loops");
      const until = root.querySelector("#build-action-until");
      if (loops) loops.disabled = !enabled || mode !== "loops";
      if (until) until.disabled = !enabled || mode !== "until";
    } else if (target.id === "build-action-mode") {
      const enabled = root.querySelector("#build-action-repeat")?.checked;
      root.querySelector("#build-action-loops").disabled = !enabled || target.value !== "loops";
      root.querySelector("#build-action-until").disabled = !enabled || target.value !== "until";
    } else if (target.id === "build-project-no-deadline") {
      const field = root.querySelector("#build-project-deadline");
      field.disabled = target.checked;
      if (target.checked) field.value = "";
    } else if (target.id.indexOf("analysis-") === 0) {
      const key = target.id.replace("analysis-", "");
      const map = {
        range: "analysisRange", category: "analysisCategory", action: "analysisAction",
        block: "analysisBlock", cycle: "analysisCycle", project: "analysisProject",
        "action-status": "analysisActionStatus", outcome: "analysisOutcome", polarity: "analysisPolarity"
      };
      if (map[key]) ui[map[key]] = target.value;
      render();
    } else if (target.id.indexOf("history-") === 0) {
      const key = target.id.replace("history-", "");
      const map = {
        range: "historyRange", type: "historyType", category: "historyCategory",
        action: "historyAction", project: "historyProject", outcome: "historyOutcome"
      };
      if (map[key]) ui[map[key]] = target.value;
      render();
    }
  });

      ui.buildDraft = null;
      render();

      const hours = Number(root.querySelector("#log-hours").value) || 0;
      const minutes = Number(root.querySelector("#log-minutes").value) || 0;

      if (preview) preview.textContent = formatMinutes(Math.round(hours * 60 + minutes));

  root.addEventListener("keyup", function(event) {
    if (event.target.id === "build-search") {
      window.clearTimeout(root._buildSearchTimer);
      root._buildSearchTimer = window.setTimeout(function() { render(); }, 180);
    }
  });

  root.addEventListener("submit", function(event) {
    event.preventDefault();
    if (event.target.id === "custom-log-form") {
      const hours = Number(root.querySelector("#log-hours").value) || 0;
      const minutes = Number(root.querySelector("#log-minutes").value) || 0;
      if (hours < 0 || minutes < 0) {
        setFlash("Duration cannot be negative.", true);
      } else if (ui.logger) {
        logAction(ui.logger.actionId, Math.round(hours * 60 + minutes), ui.logger.source);
        ui.logger = null;
      }
      render();
    } else if (event.target.id === "dashboard-log-form") {
      openLogger(root.querySelector("#dashboard-action").value, "dashboard_quick");
      render();
    } else if (event.target.id === "action-task-form") {
      const actionId = root.querySelector("#task-action").value;
      const type = root.querySelector("#task-type").value;
      const targetDate = type === "one_time" ? null : root.querySelector("#task-target-date").value;
      const action = findAction(actionId);
      if (!action || type !== "one_time" && !validDate(targetDate)) {
        setFlash("Choose an Action and valid date.", true);
      } else {
        state.actionTasks.push({
          id: uid("action_task"),
          actionId: action.id,
          actionNameSnapshot: action.name,
          type: type,
          targetDate: targetDate,
          status: "active",
          createdAt: nowISO(),
          resolvedAt: null
        });
        ui.todoDraft = null;
        persist();
        setFlash("Action task created.");
      }
      render();
    } else if (event.target.id === "quick-task-form") {
      const name = normalizeName(root.querySelector("#quick-name").value);
      const date = root.querySelector("#quick-date").value || null;
      const time = root.querySelector("#quick-time").value || null;
      const deadline = root.querySelector("#quick-deadline").value || null;
      if (!name || date && !validDate(date) || deadline && !validDate(deadline)) {
        setFlash("Add a valid Quick task name and dates.", true);
      } else {
        state.quickTasks.push({
          id: uid("quick_task"),
          name: name,
          date: date,
          time: time,
          deadline: deadline,
          status: "active",
          createdAt: nowISO(),
          resolvedAt: null
        });
        ui.todoDraft = null;
        persist();
        setFlash("Quick task created.");
      }
      render();
    } else if (event.target.id === "review-form") {
      saveReview();
      render();
    } else if (event.target.id === "capacity-form") {
      const hours = Number(root.querySelector("#capacity-hours").value);
      const days = Number(root.querySelector("#capacity-days").value);
      if (!Number.isFinite(hours) || hours < 0 || !Number.isInteger(days) || days < 1 || days > 14) {
        setFlash("Capacity values are invalid.", true);
      } else {
        state.settings.capacity = {
          availableMinutes: Math.round(hours * 60),
          periodDays: days,
          updatedAt: nowISO()
        };
        persist();
        setFlash("Capacity saved.");
      }
      render();
    } else if (event.target.id === "category-build-form") {
      saveBuildDefinition("categories");
      render();
    } else if (event.target.id === "action-build-form") {
      saveBuildDefinition("actions");
      render();
    } else if (event.target.id === "block-build-form") {
      saveBuildDefinition("blocks");
      render();
    } else if (event.target.id === "cycle-build-form") {
      saveBuildDefinition("cycles");
      render();
    } else if (event.target.id === "project-build-form") {
      saveBuildDefinition("projects");
      render();
    } else if (event.target.id === "import-form") {
      const raw = root.querySelector("#import-json").value.trim();
      ui.importText = raw;
      try {
        let candidate = JSON.parse(raw);
        let migrated = false;
        if (String(candidate.schemaVersion || "").charAt(0) === "1") {
          candidate = migrateV1(candidate);
          migrated = true;
        }
        const result = validateState(candidate);
        if (!result.ok) throw new Error(result.error);
        state = clone(candidate);
        state.schemaVersion = SCHEMA_VERSION;
        state.appVersion = APP_VERSION;
        ui.importText = "";
        ui.logger = null;
        ui.buildDraft = null;
        ui.todoDraft = null;
        ui.reviewDraft = null;
        persist();
        setFlash(migrated
          ? "Version 1 backup migrated and restored."
          : "Backup restored without merging duplicate History.");
      } catch (error) {
        setFlash(error.message || "That backup could not be restored.", true);
      }
      render();
    }
  });

  applyEmbeddedCommands();
  refreshTimeBasedState();
  persist();
  render();
})();
</script>
</body>
</html>
