  }

  function nameExists(type, name, exceptId) {
    const collection = state[type] || [];
    const normal = normalizeName(name).toLocaleLowerCase();
    return collection.some(function(item) {
      return item.id !== exceptId && normalizeName(item.name).toLocaleLowerCase() === normal;
    });
  }

  function validateState(candidate) {
    try {
      if (!isObject(candidate)) throw new Error("The backup must contain one app-state object.");
      if (typeof candidate.schemaVersion !== "string" || candidate.schemaVersion.charAt(0) !== "2") {
        throw new Error("This is not a Version 2 backup.");
      }
      const arrays = [
        "categories", "actions", "blocks", "cycles", "projects",
        "actionTasks", "quickTasks", "reviews", "actionLogs", "history"
      ];
      arrays.forEach(function(key) {
        if (!Array.isArray(candidate[key])) throw new Error("The backup is missing " + key + ".");
      });
      if (!isObject(candidate.settings) || !isObject(candidate.settings.capacity)) {
        throw new Error("Capacity settings are missing.");
      }
      const seen = new Set();
      const takeId = function(id, label) {
        if (typeof id !== "string" || !id) throw new Error(label + " has no stable ID.");
        if (seen.has(id)) throw new Error("Duplicate stable ID found: " + id);
        seen.add(id);
      };
      const permanent = [
        ["categories", ["active", "archived"]],
        ["actions", ["active", "paused", "archived"]],
        ["blocks", ["active", "archived"]],
        ["cycles", ["active", "paused", "archived"]],
        ["projects", ["active", "paused", "parked", "completed", "archived"]]
      ];
      permanent.forEach(function(pair) {
        const key = pair[0];
        const statuses = pair[1];
        const names = new Set();
        candidate[key].forEach(function(item, index) {
          takeId(item.id, key + " item " + (index + 1));
          if (typeof item.name !== "string" || !normalizeName(item.name)) {
            throw new Error("A " + key + " name is invalid.");
          }
          const normal = normalizeName(item.name).toLocaleLowerCase();
          if (names.has(normal)) throw new Error("Duplicate " + key + " name: " + item.name);
          names.add(normal);
          if (!statuses.includes(item.status)) throw new Error("A " + key + " item has an invalid status.");
        });
      });
      const actionIds = new Set(candidate.actions.map(function(item) { return item.id; }));
      const blockIds = new Set(candidate.blocks.map(function(item) { return item.id; }));
      candidate.actions.forEach(function(action) {
        if (!["positive", "negative"].includes(action.polarity)) throw new Error("An Action has an invalid type.");
        if (!isObject(action.recurrence)) throw new Error("An Action is missing recurrence state.");
      });
      candidate.blocks.forEach(function(block) {
        if (!Array.isArray(block.actionIds) || block.actionIds.some(function(id) { return !actionIds.has(id); })) {
          throw new Error("A Block references an Action that does not exist.");
        }
      });
      candidate.cycles.forEach(function(cycle) {
        if (!Array.isArray(cycle.items)) throw new Error("A Cycle is missing its items.");
        cycle.items.forEach(function(item) {
          takeId(item.id, "Cycle item");
          const valid = item.kind === "action" ? actionIds.has(item.refId) :
            item.kind === "block" ? blockIds.has(item.refId) : false;
          if (!valid) throw new Error("A Cycle item has an invalid reference.");
        });
        if (!Number.isInteger(cycle.currentIndex) || cycle.currentIndex < 0) {
          throw new Error("A Cycle has an invalid current position.");
        }
      });
      candidate.projects.forEach(function(project) {
        if (!Array.isArray(project.actionIds) || project.actionIds.some(function(id) { return !actionIds.has(id); })) {
          throw new Error("A Project references an Action that does not exist.");
        }
        if (!validDate(project.startDate) || project.deadline && !validDate(project.deadline)) {
          throw new Error("A Project has an invalid date.");
        }
        if (typeof project.progress !== "number" || project.progress < 0 || project.progress > 100) {
          throw new Error("Project progress must be between 0 and 100.");
        }
      });
      ["actionTasks", "quickTasks", "reviews", "actionLogs", "history"].forEach(function(key) {
        candidate[key].forEach(function(item, index) {
          takeId(item.id, key + " item " + (index + 1));
        });
      });
      candidate.actionLogs.forEach(function(log) {
        if (!validTimestamp(log.eventAt) || typeof log.durationMinutes !== "number" || log.durationMinutes < 0) {
          throw new Error("An Action Log is invalid.");
        }
      });
      candidate.history.forEach(function(event) {
        if (!validTimestamp(event.timestamp) || typeof event.description !== "string") {
          throw new Error("A History event is invalid.");
        }
      });
      const capacity = candidate.settings.capacity;
      if (typeof capacity.availableMinutes !== "number" || capacity.availableMinutes < 0) {
        throw new Error("Available Capacity is invalid.");
      }
      if (!Number.isInteger(capacity.periodDays) || capacity.periodDays < 1 || capacity.periodDays > 14) {
        throw new Error("Capacity period must be between 1 and 14 days.");
      }
      return { ok: true };
    } catch (error) {
      return { ok: false, error: error.message || "The backup is invalid." };
    }
  }

  function migrateV1(oldState) {
    const migrated = seedState();
    const stamp = nowISO();
    migrated.categories = [
      { id: uid("category"), name: "General", status: "active", createdAt: stamp, updatedAt: stamp },
      { id: uid("category"), name: "Body", status: "active", createdAt: stamp, updatedAt: stamp }
    ];
    migrated.actions = [];
    migrated.blocks = [];
    migrated.cycles = [];
    migrated.projects = [];
    migrated.actionTasks = [];
    migrated.quickTasks = [];
    migrated.reviews = [];
    migrated.actionLogs = [];
    migrated.history = [];
    const generalId = migrated.categories[0].id;
    const bodyId = migrated.categories[1].id;
    const byName = new Map();
    const ensureAction = function(rawName, body) {
      const name = normalizeName(rawName) || "Unnamed Action";
      const key = name.toLocaleLowerCase();
      if (byName.has(key)) return byName.get(key);
      const item = {
        id: uid("action"),
        name: name,
        categoryId: body ? bodyId : generalId,
        description: "",
        polarity: "positive",
        countsTowardCapacity: true,
        status: "active",
        recurrence: makeRecurrence(null, "unlimited", null, null, stamp),
        createdAt: stamp,
        updatedAt: stamp
      };
      migrated.actions.push(item);
      byName.set(key, item.id);
      return item.id;
    };
    (oldState.cycles || []).forEach(function(oldCycle) {
      const body = /physical|workout|fitness/i.test(oldCycle.name || "");
      const items = (oldCycle.items || []).map(function(oldItem) {
        return {
          id: uid("cycle_item"),
          kind: "action",
          refId: ensureAction(oldItem.name, body)
        };
      });
      let currentIndex = Math.max(0, (oldCycle.items || []).findIndex(function(item) {
        return item.id === oldCycle.currentItemId;
      }));
      if (currentIndex < 0) currentIndex = 0;
      migrated.cycles.push({
        id: oldCycle.id || uid("cycle"),
        name: normalizeName(oldCycle.name) || "Imported Cycle",
        items: items,
        currentIndex: currentIndex,
        status: oldCycle.status === "paused" ? "paused" : "active",
        createdAt: oldCycle.createdAt || stamp,
        updatedAt: oldCycle.updatedAt || stamp
      });
    });
    (oldState.actions || []).forEach(function(oldTask) {
      const actionId = ensureAction(oldTask.title, false);
      migrated.actionTasks.push({
        id: uid("action_task"),
        actionId: actionId,
        actionNameSnapshot: normalizeName(oldTask.title),
        type: oldTask.dueDate ? "deadline" : "one_time",
        targetDate: oldTask.dueDate || null,
        status: oldTask.status === "completed" ? "succeeded" :
          oldTask.status === "paused" ? "failed" : "active",
        createdAt: oldTask.createdAt || stamp,
        resolvedAt: oldTask.completedAt || null
      });
    });
    (oldState.projects || []).forEach(function(oldProject) {
      migrated.projects.push({
        id: oldProject.id || uid("project"),
        name: normalizeName(oldProject.name) || "Imported Project",
        description: oldProject.description || "",
        startDate: oldProject.startDate || todayISO(),
        deadline: oldProject.deadline || null,
        actionIds: [],
        progress: Math.max(0, Math.min(100, Number(oldProject.progress) || 0)),
        status: ["active", "paused", "parked", "completed"].includes(oldProject.status)
          ? oldProject.status : "active",
        notes: oldProject.notes || "",
        createdAt: oldProject.createdAt || stamp,
        updatedAt: oldProject.updatedAt || stamp,
        completedAt: oldProject.completedAt || null
      });
    });
    migrated.reviews = (oldState.reviews || []).map(function(review) {
      return {
        id: review.id || uid("review"),
        name: normalizeName(review.name) || "Imported Review",
        date: review.date || todayISO(),
        notes: review.notes || "",
        status: review.status === "completed" ? "saved" : "draft",
        createdAt: review.createdAt || stamp,
        updatedAt: review.updatedAt || stamp,
        completedAt: review.completedAt || null
      };
    });
    (oldState.history || []).forEach(function(event) {
      migrated.meta.historySequence += 1;
      migrated.history.push({
        id: event.id || uid("history"),
        sequence: migrated.meta.historySequence,
        timestamp: event.eventDateTime || event.timestamp || stamp,
        type: "legacy",
        event: event.event || "imported",
        objectType: event.type || null,
        objectId: event.objectId || null,
        nameSnapshot: event.objectName || "",
        actionId: null,
        categoryId: null,
        projectIds: [],
        outcome: "neutral",
        durationMinutes: 0,
        description: event.description || "Imported Version 1 event",
        metadata: { migratedFromV1: true }
      });
    });
    if (oldState.settings && oldState.settings.capacity) {
      migrated.settings.capacity.availableMinutes =
        Math.max(0, Number(oldState.settings.capacity.availableHours) || 0) * 60;
      migrated.settings.capacity.periodDays =
        Math.max(1, Math.min(14, Number(oldState.settings.capacity.periodDays) || 7));
    }
    migrated.meta.migratedFrom = "1.x";
    migrated.updatedAt = stamp;
    return migrated;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (validateState(parsed).ok) return parsed;
      }
      const v1 = localStorage.getItem(V1_STORAGE_KEY);
      if (v1) {
        const parsedV1 = JSON.parse(v1);
        if (parsedV1 && String(parsedV1.schemaVersion || "").charAt(0) === "1") {
          return migrateV1(parsedV1);
        }
      }
    } catch (error) {
      /* The app remains usable in memory when browser storage is unavailable. */
    }
    return seedState();
  }

  let state = loadState();

  function persist() {
    state.schemaVersion = SCHEMA_VERSION;
    state.appVersion = APP_VERSION;
    state.updatedAt = nowISO();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      /* Export remains available even if browser storage is unavailable. */
    }
  }

  function findCategory(id) {
    return state.categories.find(function(item) { return item.id === id; }) || null;
  }

  function findAction(id) {
    return state.actions.find(function(item) { return item.id === id; }) || null;
  }

  function findBlock(id) {
    return state.blocks.find(function(item) { return item.id === id; }) || null;
  }

  function findCycle(id) {
    return state.cycles.find(function(item) { return item.id === id; }) || null;
  }

  function findProject(id) {
    return state.projects.find(function(item) { return item.id === id; }) || null;
  }

  function actionName(id, fallback) {
    const action = findAction(id);
    return action ? action.name : (fallback || "Deleted Action");
  }

  function actionIdsForBlock(block) {
    return block ? block.actionIds.filter(function(id) { return Boolean(findAction(id)); }) : [];
  }

  function actionIdsForCycle(cycle) {
    if (!cycle) return [];
    const ids = [];
    cycle.items.forEach(function(item) {
      if (item.kind === "action" && findAction(item.refId)) ids.push(item.refId);
      if (item.kind === "block") {
        actionIdsForBlock(findBlock(item.refId)).forEach(function(id) { ids.push(id); });
      }
    });
    return Array.from(new Set(ids));
  }

  function categoryIdsForActionIds(actionIds) {
    return Array.from(new Set(actionIds.map(function(id) {
      const action = findAction(id);
      return action ? action.categoryId : null;
    }).filter(Boolean)));
  }

  function categoryIdsForEntity(type, entity) {
    if (!entity) return [];
    if (type === "action") return entity.categoryId ? [entity.categoryId] : [];
    if (type === "block") return categoryIdsForActionIds(actionIdsForBlock(entity));
    if (type === "cycle") return categoryIdsForActionIds(actionIdsForCycle(entity));
    if (type === "project") return categoryIdsForActionIds(entity.actionIds || []);
    return [];
  }

  function categoryBadges(ids) {
    if (!ids || !ids.length) return '<span class="text-small text-muted">Uncategorised</span>';
    return ids.map(function(id) {
      const category = findCategory(id);
      return '<span class="viz-badge">' + esc(category ? category.name : "Deleted Category") + "</span>";
    }).join("");
  }

  function appendHistory(details) {
    state.meta.historySequence = Number(state.meta.historySequence || 0) + 1;
    state.history.push({
      id: uid("history"),
      sequence: state.meta.historySequence,
      timestamp: details.timestamp || nowISO(),
      type: details.type || "system",
      event: details.event || "updated",
      objectType: details.objectType || null,
      objectId: details.objectId || null,
      nameSnapshot: details.nameSnapshot || "",
      actionId: details.actionId || null,
      categoryId: details.categoryId || null,
      projectIds: clone(details.projectIds || []),
      outcome: details.outcome || "neutral",
      durationMinutes: Number(details.durationMinutes) || 0,
      description: details.description || "",
      metadata: clone(details.metadata || {})
    });
  }

  function setFlash(text, error) {
    ui.flash = { text: text, error: Boolean(error) };
  }

  function historyCountFor(type, id) {
    return state.history.filter(function(event) {
      return event.objectType === type && event.objectId === id ||
        type === "action" && event.actionId === id;
    }).length;
  }

  function currentCycleItem(cycle) {
    if (!cycle || !cycle.items.length) return null;
    const index = Math.max(0, Math.min(cycle.items.length - 1, cycle.currentIndex || 0));
    return cycle.items[index];
  }

  function nextCycleItem(cycle) {
    if (!cycle || !cycle.items.length) return null;
    const index = Math.max(0, Math.min(cycle.items.length - 1, cycle.currentIndex || 0));
    return cycle.items[(index + 1) % cycle.items.length];
  }

  function cycleItemName(item) {
    if (!item) return "No items";
    if (item.kind === "action") return actionName(item.refId);
    const block = findBlock(item.refId);
    return block ? block.name : "Deleted Block";
  }

  function advanceCycle(cycle, trigger, actionLogId, actionId) {
    if (!cycle || !cycle.items.length) return false;
    const fromItem = currentCycleItem(cycle);
    const fromName = cycleItemName(fromItem);
    cycle.currentIndex = ((cycle.currentIndex || 0) + 1) % cycle.items.length;
    cycle.updatedAt = nowISO();
    const toItem = currentCycleItem(cycle);
    appendHistory({
      type: "cycle",
      event: "cycle_advanced",
      objectType: "cycle",
      objectId: cycle.id,
      nameSnapshot: cycle.name,
      actionId: actionId || null,
      categoryId: actionId && findAction(actionId) ? findAction(actionId).categoryId : null,
      outcome: "success",
      description: cycle.name + " advanced: " + fromName + " → " + cycleItemName(toItem),
      metadata: {
        trigger: trigger,
        actionLogId: actionLogId || null,
        fromItem: clone(fromItem),
        fromNameSnapshot: fromName,
        toItem: clone(toItem),
        toNameSnapshot: cycleItemName(toItem)
      }
    });
    return true;
  }

  function completeActionTask(task, actionLog, outcome) {
    task.status = outcome === "success" ? "succeeded" : "failed";
    task.resolvedAt = actionLog ? actionLog.eventAt : nowISO();
    appendHistory({
      timestamp: task.resolvedAt,
      type: "todo",
      event: outcome === "success" ? "action_task_succeeded" : "action_task_failed",
      objectType: "action_task",
      objectId: task.id,
      nameSnapshot: task.actionNameSnapshot,
      actionId: task.actionId,
      categoryId: actionLog ? actionLog.categoryId : (findAction(task.actionId) || {}).categoryId || null,
      outcome: outcome,
      description: (outcome === "success" ? "Completed task: " : "Task failed: ") + task.actionNameSnapshot,
      metadata: {
        taskType: task.type,
        targetDate: task.targetDate,
        actionLogId: actionLog ? actionLog.id : null
      }
    });
  }

  function finishRecurrence(action, reason, timestamp) {
    const recurrence = action.recurrence;
    if (!recurrence.enabled || recurrence.status === "finished") return false;
    recurrence.status = "finished";
    recurrence.finishedAt = timestamp || nowISO();
    appendHistory({
      timestamp: recurrence.finishedAt,
      type: "repeating",
      event: "repeating_finished",
      objectType: "action",
      objectId: action.id,
      nameSnapshot: action.name,
      actionId: action.id,
      categoryId: action.categoryId,
      outcome: "success",
      description: "Repeating program finished: " + action.name,
      metadata: { reason: reason }
    });
    return true;
  }

  function refreshTimeBasedState() {
    let changed = false;
    const today = todayISO();
    state.actions.forEach(function(action) {
      const recurrence = action.recurrence;
      if (!recurrence || !recurrence.enabled || recurrence.status !== "active" || action.status !== "active") return;
      const interval = Math.max(1, Number(recurrence.intervalDays) || 1);
      let effectiveToday = today;
      if (recurrence.mode === "until" && recurrence.repeatUntil && dayDiff(recurrence.repeatUntil, effectiveToday) < 0) {
        effectiveToday = recurrence.repeatUntil;
      }
      if (action.polarity === "positive") {
        const base = datePart(recurrence.lastSuccessAt || recurrence.anchorAt || action.createdAt);
        const dueDate = addDays(base, interval);
        const overdueDays = Math.max(0, -dayDiff(dueDate, effectiveToday));
        const computedMisses = Math.floor(overdueDays / interval);
        if (computedMisses > Number(recurrence.recordedMissedWindows || 0)) {
          const added = computedMisses - Number(recurrence.recordedMissedWindows || 0);
          recurrence.recordedMissedWindows = computedMisses;
          recurrence.missedLoops = Number(recurrence.missedLoops || 0) + added;
          appendHistory({
            type: "repeating",
            event: "repeating_missed_loop",
            objectType: "action",
            objectId: action.id,
            nameSnapshot: action.name,
            actionId: action.id,
            categoryId: action.categoryId,
            outcome: "failure",
            description: "Missed loop" + (added > 1 ? " ×" + added : "") + ": " + action.name,
            metadata: { count: added, intervalDays: interval }
          });
          changed = true;
        }
      } else {
        const base = datePart(recurrence.lastViolationAt || recurrence.anchorAt || action.createdAt);
        const elapsed = Math.max(0, -dayDiff(base, effectiveToday));
        const completedWindows = Math.floor(elapsed / interval);
        if (completedWindows > Number(recurrence.recordedSuccessWindows || 0)) {
          let added = completedWindows - Number(recurrence.recordedSuccessWindows || 0);
          if (recurrence.mode === "loops") {
            added = Math.min(added, Math.max(0, Number(recurrence.remainingLoops || 0)));
          }
          recurrence.recordedSuccessWindows = completedWindows;
          recurrence.successfulLoops = Number(recurrence.successfulLoops || 0) + added;
          if (recurrence.mode === "loops") {
            recurrence.remainingLoops = Math.max(0, Number(recurrence.remainingLoops || 0) - added);
          }
          if (added > 0) {
            appendHistory({
              type: "repeating",
              event: "negative_period_succeeded",
              objectType: "action",
              objectId: action.id,
              nameSnapshot: action.name,
              actionId: action.id,
              categoryId: action.categoryId,
              outcome: "success",
              description: "Avoided " + action.name + " for " + added + " completed period" + (added === 1 ? "" : "s"),
              metadata: { count: added, intervalDays: interval }
            });
          }
          changed = true;
        }
        if (recurrence.mode === "loops" && Number(recurrence.remainingLoops || 0) <= 0) {
          changed = finishRecurrence(action, "loops_completed") || changed;
        }
      }
      if (recurrence.mode === "until" && recurrence.repeatUntil && dayDiff(recurrence.repeatUntil, today) < 0) {
        changed = finishRecurrence(action, "until_date_reached") || changed;
      }
      if (recurrence.mode === "loops" && Number(recurrence.remainingLoops || 0) <= 0) {
        changed = finishRecurrence(action, "loops_completed") || changed;
      }
    });

    state.actionTasks.forEach(function(task) {
      if (task.status !== "active" || !task.targetDate) return;
      if ((task.type === "deadline" || task.type === "specific_date") && dayDiff(task.targetDate, today) < 0) {
        completeActionTask(task, null, "failure");
        changed = true;
      }
    });

    state.quickTasks.forEach(function(task) {
      if (task.status !== "active") return;
      const expired = task.deadline && dayDiff(task.deadline, today) < 0 ||
        !task.deadline && task.date && dayDiff(task.date, today) < 0;
      if (expired) {
        task.status = "failed";
        task.resolvedAt = nowISO();
        appendHistory({
          type: "todo",
          event: "quick_task_failed",
          objectType: "quick_task",
          objectId: task.id,
          nameSnapshot: task.name,
          outcome: "failure",
          description: "Quick task expired: " + task.name,
          metadata: { date: task.date, deadline: task.deadline }
        });
        changed = true;
      }
    });
    if (changed) persist();
  }

  function recurrenceSnapshot(action, referenceDate) {
    const recurrence = action.recurrence;
    if (!recurrence || !recurrence.enabled) {
      return { label: "Not repeating", value: null, due: false, overdue: false };
    }
    if (recurrence.status === "finished") {
      return { label: "Finished", value: null, due: false, overdue: false };
    }
    const today = referenceDate || todayISO();
    const interval = Math.max(1, Number(recurrence.intervalDays) || 1);
    const base = action.polarity === "negative"
      ? datePart(recurrence.lastViolationAt || recurrence.anchorAt || action.createdAt)
      : datePart(recurrence.lastSuccessAt || recurrence.anchorAt || action.createdAt);
    if (action.polarity === "negative") {
      const nextWindow = addDays(base, (Number(recurrence.recordedSuccessWindows || 0) + 1) * interval);
      const diff = dayDiff(nextWindow, today);
      const value = diff <= 0 ? 1 : diff;
      return {
        label: "Avoid for " + value + " more day" + (value === 1 ? "" : "s"),
        value: value,
        due: value <= 1,
        overdue: false
      };
    }
    const dueDate = addDays(base, interval);
    const diff = dayDiff(dueDate, today);
    if (diff >= 0) {
      const value = diff === 0 ? 1 : diff;
      return {
        label: String(value),
        value: value,
        due: value <= 1,
        overdue: false
      };
    }
    const overdue = Math.abs(diff);
    const currentWindow = overdue >= interval ? overdue % interval + 1 : overdue;
    return {
      label: "-" + currentWindow,
      value: -currentWindow,
      due: true,
      overdue: true
    };
  }

  function logAction(actionId, durationMinutes, source, eventAt) {
    refreshTimeBasedState();
    const action = findAction(actionId);
    if (!action || action.status === "archived") {
      setFlash("That Action is not available.", true);
      return false;
    }
    const stamp = eventAt || nowISO();
    const minutes = Math.max(0, Math.round(Number(durationMinutes) || 0));
    const category = findCategory(action.categoryId);
    const log = {
      id: uid("action_log"),
      actionId: action.id,
      actionNameSnapshot: action.name,
      categoryId: action.categoryId || null,
      categoryNameSnapshot: category ? category.name : "Uncategorised",
      polarity: action.polarity,
      outcome: action.polarity === "negative" ? "failure" : "success",
      durationMinutes: minutes,
      countsTowardCapacitySnapshot: Boolean(action.countsTowardCapacity),
      eventAt: stamp,
      createdAt: nowISO(),
      source: source || "app",
      reactions: {
        recurrenceApplied: false,
        repeatingSuccess: false,
        completedTaskIds: [],
        projectIds: [],
        advancedCycleIds: [],
        capacityMinutes: action.countsTowardCapacity ? minutes : 0
      }
    };

    const recurrence = action.recurrence;
    if (recurrence && recurrence.enabled && recurrence.status === "active" && action.status === "active") {
      log.reactions.recurrenceApplied = true;
      if (action.polarity === "positive") {
        recurrence.successfulLoops = Number(recurrence.successfulLoops || 0) + 1;
        recurrence.lastSuccessAt = stamp;
        recurrence.anchorAt = stamp;
        recurrence.recordedMissedWindows = 0;
        log.reactions.repeatingSuccess = true;
        if (recurrence.mode === "loops") {
          recurrence.remainingLoops = Math.max(0, Number(recurrence.remainingLoops || 0) - 1);
          if (recurrence.remainingLoops === 0) finishRecurrence(action, "loops_completed", stamp);
        }
      } else {
        recurrence.violationCount = Number(recurrence.violationCount || 0) + 1;
        recurrence.lastViolationAt = stamp;
        recurrence.anchorAt = stamp;
        recurrence.recordedSuccessWindows = 0;
      }
    }

    state.actionTasks.forEach(function(task) {
      if (task.status !== "active" || task.actionId !== action.id) return;
      const logDate = datePart(stamp);
      const qualifies = task.type === "one_time" ||
        task.type === "deadline" && (!task.targetDate || dayDiff(task.targetDate, logDate) >= 0) ||
        task.type === "specific_date" && task.targetDate === logDate;
      if (qualifies) {
        completeActionTask(task, log, "success");
        log.reactions.completedTaskIds.push(task.id);
      }
    });

    state.projects.forEach(function(project) {
      if (project.status !== "archived" && project.actionIds.includes(action.id)) {
        log.reactions.projectIds.push(project.id);
      }
    });

    state.cycles.forEach(function(cycle) {
      if (cycle.status !== "active") return;
      const current = currentCycleItem(cycle);
      if (current && current.kind === "action" && current.refId === action.id) {
        advanceCycle(cycle, "action_log", log.id, action.id);
        log.reactions.advancedCycleIds.push(cycle.id);
      }
    });

    state.actionLogs.push(log);
    appendHistory({
      timestamp: stamp,
      type: "action",
      event: "action_logged",
      objectType: "action",
      objectId: action.id,
      nameSnapshot: action.name,
      actionId: action.id,
      categoryId: action.categoryId,
      projectIds: log.reactions.projectIds,
      outcome: log.outcome,
      durationMinutes: minutes,
      description: action.polarity === "negative"
        ? "Violation logged: " + action.name + (minutes ? " • " + formatMinutes(minutes) : "")
        : "Logged " + action.name + (minutes ? " • " + formatMinutes(minutes) : ""),
      metadata: { actionLogId: log.id, reactions: clone(log.reactions) }
    });
    persist();
    setFlash(action.polarity === "negative"
      ? action.name + " violation recorded once."
      : action.name + " logged once across the system.");
    return true;
  }

  function capacityWindowStart() {
    return addDays(todayISO(), -(state.settings.capacity.periodDays - 1));
  }

  function capacityUsedMinutes(logs) {
    const start = capacityWindowStart();
    const source = logs || state.actionLogs;
    return source.filter(function(log) {
      const date = datePart(log.eventAt);
      return log.countsTowardCapacitySnapshot && dayDiff(date, start) >= 0 && dayDiff(todayISO(), date) >= 0;
    }).reduce(function(total, log) {
      return total + Number(log.durationMinutes || 0);
    }, 0);
  }

  function projectActivity(project) {
    const logs = state.actionLogs.filter(function(log) {
      return log.reactions && log.reactions.projectIds && log.reactions.projectIds.includes(project.id);
    });
    return {
      sessions: logs.length,
      minutes: logs.reduce(function(total, log) { return total + log.durationMinutes; }, 0),
      latest: logs.length ? logs.slice().sort(function(a, b) {
        return b.eventAt.localeCompare(a.eventAt);
      })[0].eventAt : null
    };
  }

  function deadlineText(value, status) {
    if (!value) return "No deadline";
    const diff = dayDiff(value, todayISO());
    if (diff < 0 && status !== "completed") {
      return Math.abs(diff) + " day" + (Math.abs(diff) === 1 ? "" : "s") + " past deadline";
    }
    if (diff === 0) return "Deadline today";
    return "Deadline " + formatDate(value);
  }

  function taskDateText(task) {
    if (task.type === "one_time") return "No deadline";
    if (!task.targetDate) return "No date";
    const diff = dayDiff(task.targetDate, todayISO());
    if (task.type === "specific_date") {
      if (diff === 0) return "Today";
      return "On " + formatDate(task.targetDate);
    }
    if (diff < 0) return Math.abs(diff) + " day" + (Math.abs(diff) === 1 ? "" : "s") + " overdue";
    if (diff === 0) return "Due today";
    return "Due " + formatDate(task.targetDate);
  }

  function quickTaskDateText(task) {
    const parts = [];
    if (task.date) parts.push("On " + formatDate(task.date));
    if (task.time) parts.push(task.time);
    if (task.deadline) parts.push("Deadline " + formatDate(task.deadline));
    return parts.length ? parts.join(" • ") : "No date";
  }

  function openLogger(actionId, source) {
    const action = findAction(actionId);
    if (!action) {
      setFlash("That Action no longer exists.", true);
      return;
    }
    ui.logger = { actionId: actionId, source: source || "app" };
    ui.flash = null;
  }

  function applyEmbeddedCommands() {
    if (!state.meta || !Array.isArray(state.meta.appliedCommandIds)) {
      state.meta = state.meta || {};
      state.meta.appliedCommandIds = [];
    }
    let changed = false;
    EMBEDDED_COMMANDS.forEach(function(command) {
      if (!command || !command.id || state.meta.appliedCommandIds.includes(command.id)) return;
      if (command.type === "log_action") {
        const normal = normalizeName(command.name || "").toLocaleLowerCase();
        const action = findAction(command.actionId) || state.actions.find(function(item) {
          return normalizeName(item.name).toLocaleLowerCase() === normal;
        });
        if (action) logAction(action.id, command.durationMinutes || 0, "conversation", command.eventAt);
      }
      if (command.type === "project_status") {
        const normal = normalizeName(command.name || "").toLocaleLowerCase();
        const project = findProject(command.projectId) || state.projects.find(function(item) {
          return normalizeName(item.name).toLocaleLowerCase() === normal;
        });
        if (project) setProjectStatus(project.id, command.status, "conversation");
      }
      state.meta.appliedCommandIds.push(command.id);
      changed = true;
    });
    if (changed) persist();
  }

  function navHtml() {
    const buttons = PAGES.map(function(pair) {
      const active = ui.page === pair[0];
      return '<button type="button" class="btn' + (active ? " btn-primary" : "") +
        '" data-page="' + pair[0] + '" aria-pressed="' + active + '">' + pair[1] + "</button>";
    }).join("");
    const options = PAGES.map(function(pair) {
      return '<option value="' + pair[0] + '"' + (ui.page === pair[0] ? " selected" : "") +
        ">" + pair[1] + "</option>";
    }).join("");
    return '<nav class="lc-nav" aria-label="Life Command sections">' + buttons + '</nav>' +
      '<div class="lc-mobile-nav"><label class="form-label" for="lc-page-select">Section</label>' +
      '<select class="form-select" id="lc-page-select">' + options + "</select></div>";
  }

  function flashHtml() {
    if (!ui.flash) return "";
    return '<div class="lc-flash ' + (ui.flash.error ? "text-destructive" : "viz-badge") +
      '" role="status">' + esc(ui.flash.text) + "</div>";
  }

  function renderLogger() {
    if (!ui.logger) return "";
    const action = findAction(ui.logger.actionId);
    if (!action) {
      ui.logger = null;
      return "";
    }
    return '<section class="card lc-card-stack lc-log-panel" aria-labelledby="logger-title">' +
      '<div class="lc-section-head"><div><h3 id="logger-title">' +
      (action.polarity === "negative" ? "Log violation" : "Log Action") +
      '</h3><p>' + esc(action.name) + '</p></div>' +
      '<button type="button" class="btn btn-ghost" data-action="logger-close">Close</button></div>' +
      '<div class="lc-actions" aria-label="Fast duration">' +
      [15, 30, 60, 120].map(function(minutes) {
        return '<button type="button" class="btn btn-primary" data-action="log-fast" data-minutes="' +
          minutes + '">' + formatMinutes(minutes) + "</button>";
      }).join("") +
      '<button type="button" class="btn" data-action="log-fast" data-minutes="0">No time</button></div>' +
      '<form id="custom-log-form" class="lc-form-grid">' +
      '<div><label class="form-label" for="log-hours">Hours</label>' +
      '<input class="form-control" id="log-hours" type="number" min="0" step="0.1" value="0"></div>' +
      '<div><label class="form-label" for="log-minutes">Minutes</label>' +
      '<input class="form-control" id="log-minutes" type="number" min="0" step="1" value="45"></div>' +
      '<div class="lc-span-all lc-actions"><button type="submit" class="btn">Log custom duration</button>' +
      '<span class="text-small text-muted" id="log-duration-preview">45m</span></div></form></section>';
  }

  function render() {
    refreshTimeBasedState();
    root.innerHTML = '<div class="lc-shell">' + navHtml() + flashHtml() + renderLogger() +
      '<main class="lc-page">' + renderPage() + "</main></div>";
  }

  function renderPage() {
    if (ui.page === "cycles") return renderCycles();
    if (ui.page === "actions") return renderActions();
    if (ui.page === "todo") return renderTodo();
    if (ui.page === "projects") return renderProjects();
    if (ui.page === "reviews") return renderReviews();
    if (ui.page === "analysis") return renderAnalysis();
    if (ui.page === "history") return renderHistory();
    if (ui.page === "settings") return renderSettings();
    return renderDashboard();
  }

  function actionOptions(selected, activeOnly) {
    return state.actions.filter(function(action) {
      return !activeOnly || action.status !== "archived";
    }).sort(function(a, b) {
      return a.name.localeCompare(b.name);
    }).map(function(action) {
      return '<option value="' + action.id + '"' + (selected === action.id ? " selected" : "") +
        ">" + esc(action.name) + "</option>";
    }).join("");
  }

  function categoryOptions(selected, includeAll) {
    let html = includeAll ? '<option value="all">All categories</option>' : '<option value="">Uncategorised</option>';
    html += state.categories.slice().sort(function(a, b) {
      return a.name.localeCompare(b.name);
    }).map(function(category) {
      return '<option value="' + category.id + '"' + (selected === category.id ? " selected" : "") +
        ">" + esc(category.name) + (category.status === "archived" ? " (Archived)" : "") + "</option>";
    }).join("");
    return html;
  }

  function cycleCard(cycle, dashboard) {
    const current = currentCycleItem(cycle);
    const next = nextCycleItem(cycle);
    const currentName = cycleItemName(current);
    const position = cycle.items.length ? (cycle.currentIndex || 0) + 1 : 0;
    let controls = "";
    if (current && current.kind === "action") {
      const action = findAction(current.refId);
      controls += action
        ? '<button type="button" class="btn btn-primary" data-action="open-log" data-id="' +
          action.id + '" data-source="cycle">Log ' + esc(action.name) + "</button>"
        : "";
    } else if (current && current.kind === "block") {
      const block = findBlock(current.refId);
      if (block) {
        controls += actionIdsForBlock(block).map(function(actionId) {
          return '<button type="button" class="btn" data-action="open-log" data-id="' +
            actionId + '" data-source="cycle_block">Log ' + esc(actionName(actionId)) + "</button>";
        }).join("");
        controls += '<button type="button" class="btn btn-primary" data-action="cycle-advance" data-id="' +
          cycle.id + '">Complete block</button>';
      }
    }
    if (!dashboard) {
      controls += '<button type="button" class="btn btn-ghost" data-action="cycle-toggle" data-id="' +
        cycle.id + '">' + (cycle.status === "active" ? "Pause" : "Activate") + "</button>";
    }
    return '<article class="card lc-card-stack"><div class="lc-section-head"><div><h3>' +
      esc(cycle.name) + '</h3><div class="lc-inline">' +
      categoryBadges(categoryIdsForEntity("cycle", cycle)) + '</div></div>' +
      '<span class="viz-badge">' + cap(cycle.status) + '</span></div>' +
      '<div><span class="text-small text-muted">CURRENT</span><p><strong>' +
      esc(currentName) + '</strong></p><div class="lc-meta text-small"><span>Next: ' +
      esc(cycleItemName(next)) + "</span><span>Position " + position + " of " + cycle.items.length +
      "</span></div></div><div class=\"lc-actions\">" + controls + "</div></article>";
  }

  function dueRepeatingActions() {
    return state.actions.filter(function(action) {
      return action.status === "active" && action.recurrence && action.recurrence.enabled &&
        action.recurrence.status === "active";
    }).sort(function(a, b) {
      return (recurrenceSnapshot(a).value || 9999) - (recurrenceSnapshot(b).value || 9999);
    });
  }

  function currentTodoItems() {
    const actionTasks = state.actionTasks.filter(function(task) { return task.status === "active"; }).map(function(task) {
      const date = task.targetDate || "9999-12-31";
      return { kind: "action", item: task, sortDate: date, name: actionName(task.actionId, task.actionNameSnapshot) };
    });
    const quickTasks = state.quickTasks.filter(function(task) { return task.status === "active"; }).map(function(task) {
      const date = task.deadline || task.date || "9999-12-31";
      return { kind: "quick", item: task, sortDate: date, name: task.name };
    });
    return actionTasks.concat(quickTasks).sort(function(a, b) {
      return a.sortDate.localeCompare(b.sortDate) || a.name.localeCompare(b.name);
    });
  }

  function renderDashboard() {
    const cycles = state.cycles.filter(function(cycle) { return cycle.status === "active"; });
    const repeating = dueRepeatingActions().filter(function(action) {
      return action.recurrence.intervalDays === 1 || recurrenceSnapshot(action).due;
    }).slice(0, 5);
    const todo = currentTodoItems().slice(0, 5);
    const projects = state.projects.filter(function(project) { return project.status === "active"; }).slice(0, 4);
    const recent = sortedHistory().slice(0, 5);
    const used = capacityUsedMinutes();
    const available = state.settings.capacity.availableMinutes;
    const remaining = available - used;
    const activeActions = state.actions.filter(function(action) { return action.status === "active"; });

    return '<section class="lc-section" aria-labelledby="dash-log"><div class="lc-section-head"><div>' +
      '<h2 id="dash-log">Quick Action log</h2><p class="lc-muted">One log updates every place using the Action.</p></div></div>' +
      '<form id="dashboard-log-form" class="lc-filter-row"><label class="sr-only" for="dashboard-action">Action</label>' +
      '<select class="form-select" id="dashboard-action">' +
      activeActions.map(function(action) {
        return '<option value="' + action.id + '">' + esc(action.name) +
          (action.polarity === "negative" ? " — Negative" : "") + "</option>";
      }).join("") + '</select><button type="submit" class="btn btn-primary">Choose duration</button></form></section>' +

      '<section class="lc-section" aria-labelledby="dash-cycles"><div class="lc-section-head"><div>' +
      '<h2 id="dash-cycles">Current cycles</h2><p class="lc-muted">Rolling position, never reset by missed days.</p></div>' +
      '<button type="button" class="btn btn-ghost" data-page="cycles">View all</button></div>' +
      (cycles.length ? '<div class="lc-cards">' + cycles.map(function(cycle) {
        return cycleCard(cycle, true);
      }).join("") + "</div>" : '<p class="lc-empty">No active Cycles.</p>') + "</section>" +

      '<section class="lc-section" aria-labelledby="dash-actions"><div class="lc-section-head"><h2 id="dash-actions">Due Actions</h2>' +
      '<button type="button" class="btn btn-ghost" data-page="actions">View all</button></div>' +
      (repeating.length ? repeating.map(function(action) {
        const snap = recurrenceSnapshot(action);
        return '<div class="lc-row"><div class="lc-row-main"><div class="lc-inline"><strong>' +
          esc(action.name) + '</strong><span class="viz-badge">' +
          (action.recurrence.intervalDays === 1 ? "Daily" : "Every " + action.recurrence.intervalDays + " days") +
          '</span></div><div class="lc-meta text-small"><span class="lc-countdown">' +
          (action.polarity === "negative" ? esc(snap.label) : "Countdown " + esc(snap.label)) +
          "</span></div></div><div class=\"lc-row-actions\"><button type=\"button\" class=\"btn btn-primary\" data-action=\"open-log\" data-id=\"" +
          action.id + '" data-source="dashboard">' + (action.polarity === "negative" ? "Log violation" : "Log") +
          "</button></div></div>";
      }).join("") : '<p class="lc-empty">Nothing repeating needs attention now.</p>') + "</section>" +

      '<section class="lc-section" aria-labelledby="dash-todo"><div class="lc-section-head"><h2 id="dash-todo">To-do</h2>' +
      '<button type="button" class="btn btn-ghost" data-page="todo">View all</button></div>' +
      (todo.length ? todo.map(function(entry) {
        if (entry.kind === "action") {
          const task = entry.item;
          return '<div class="lc-row"><div class="lc-row-main"><strong>' + esc(entry.name) +
            '</strong><div class="lc-meta text-small"><span>' + esc(taskDateText(task)) +
            '</span><span>Action task</span></div></div><button type="button" class="btn" data-action="open-log" data-id="' +
            task.actionId + '" data-source="todo">Log Action</button></div>';
        }
        return '<div class="lc-row"><div class="lc-row-main"><strong>' + esc(entry.item.name) +
          '</strong><div class="lc-meta text-small"><span>' + esc(quickTaskDateText(entry.item)) +
          '</span><span>Quick task</span></div></div><button type="button" class="btn" data-action="quick-complete" data-id="' +
          entry.item.id + '">Complete</button></div>';
      }).join("") : '<p class="lc-empty">No active To-do items.</p>') + "</section>" +

      '<section class="lc-section" aria-labelledby="dash-projects"><div class="lc-section-head"><h2 id="dash-projects">Projects</h2>' +
      '<button type="button" class="btn btn-ghost" data-page="projects">View all</button></div>' +
      (projects.length ? projects.map(function(project) {
        const activity = projectActivity(project);
        return '<div class="lc-row"><div class="lc-row-main"><strong>' + esc(project.name) +
          '</strong><progress class="lc-progress" max="100" value="' + project.progress +
          '" aria-label="' + esc(project.name) + " progress " + project.progress + '%"></progress>' +
          '<div class="lc-meta text-small"><span>' + project.progress + '%</span><span>' +
          activity.sessions + " session" + (activity.sessions === 1 ? "" : "s") + "</span><span>" +
          esc(deadlineText(project.deadline, project.status)) + "</span></div></div></div>";
      }).join("") : '<p class="lc-empty">No active Projects.</p>') + "</section>" +

      '<section class="lc-section" aria-labelledby="dash-capacity"><div class="lc-section-head"><div><h2 id="dash-capacity">Capacity</h2>' +
      '<p class="lc-muted">Automatically calculated from qualifying logs in the last ' +
      state.settings.capacity.periodDays + " days.</p></div></div><div class=\"viz-grid\">" +
      metricCard("Available", formatMinutes(available)) +
      metricCard("Used", formatMinutes(used)) +
      metricCard("Remaining", (remaining < 0 ? "−" : "") + formatMinutes(Math.abs(remaining))) +
      "</div></section>" +

      '<section class="lc-section" aria-labelledby="dash-history"><div class="lc-section-head"><h2 id="dash-history">Recent history</h2>' +
      '<button type="button" class="btn btn-ghost" data-page="history">View all</button></div>' +
      (recent.length ? recent.map(historyRow).join("") : '<p class="lc-empty">Logs and events will appear here.</p>') +
      "</section>";
  }

  function cycleFilters() {
    return '<div class="lc-filter-row"><label class="sr-only" for="cycle-status-filter">Status</label>' +
      '<select class="form-select" id="cycle-status-filter"><option value="active"' +
      (ui.cycleStatus === "active" ? " selected" : "") + '>Active</option><option value="paused"' +
      (ui.cycleStatus === "paused" ? " selected" : "") + '>Paused</option><option value="all"' +
      (ui.cycleStatus === "all" ? " selected" : "") + '>All</option></select>' +
      '<label class="sr-only" for="cycle-category-filter">Category</label><select class="form-select" id="cycle-category-filter">' +
      categoryOptions(ui.cycleCategory, true) + '</select><label class="sr-only" for="cycle-sort">Sort</label>' +
      '<select class="form-select" id="cycle-sort"><option value="position"' +
      (ui.cycleSort === "position" ? " selected" : "") + '>Current position</option><option value="name"' +
      (ui.cycleSort === "name" ? " selected" : "") + ">Name</option></select></div>";
  }

  function renderCycles() {
    let cycles = state.cycles.filter(function(cycle) {
      return cycle.status !== "archived" &&
        (ui.cycleStatus === "all" || cycle.status === ui.cycleStatus) &&
        (ui.cycleCategory === "all" || categoryIdsForEntity("cycle", cycle).includes(ui.cycleCategory));
    });
    cycles.sort(function(a, b) {
      return ui.cycleSort === "name"
        ? a.name.localeCompare(b.name)
        : (a.currentIndex || 0) - (b.currentIndex || 0);
    });
    return '<section class="lc-section" aria-labelledby="cycles-title"><div class="lc-section-head"><div>' +
      '<h2 id="cycles-title">Cycles</h2><p class="lc-muted">Use active rolling sequences here. Build them in Settings → Build → Cycles.</p>' +
      '</div><button type="button" class="btn btn-ghost" data-open-build="cycles">Open builder</button></div>' +
      cycleFilters() + (cycles.length
        ? '<div class="lc-cards">' + cycles.map(function(cycle) { return cycleCard(cycle, false); }).join("") + "</div>"
        : '<p class="lc-empty">No matching Cycles.</p>') + "</section>";
  }

  function recurrenceCard(action) {
    const recurrence = action.recurrence;
    const snap = recurrenceSnapshot(action);
    const modeText = recurrence.mode === "loops"
      ? recurrence.remainingLoops + " remaining of " + recurrence.totalLoops
      : recurrence.mode === "until"
        ? "Until " + formatDate(recurrence.repeatUntil)
        : "Unlimited";
    return '<article class="card lc-card-stack"><div class="lc-section-head"><div><div class="lc-inline"><h3>' +
      esc(action.name) + '</h3><span class="viz-badge">' +
      (action.polarity === "negative" ? "Negative" : "Positive") + '</span></div><div class="lc-inline">' +
      categoryBadges(categoryIdsForEntity("action", action)) + '</div></div><span class="viz-badge">' +
      cap(recurrence.status === "finished" ? "finished" : action.status) + '</span></div>' +
      '<div class="viz-grid"><div><span class="text-small text-muted">' +
      (action.polarity === "negative" ? "Safe-period countdown" : "Countdown") +
      '</span><div class="viz-stat-value lc-countdown">' + esc(snap.label) + '</div></div>' +
      '<div><span class="text-small text-muted">Interval</span><p>Every ' + recurrence.intervalDays +
      " day" + (recurrence.intervalDays === 1 ? "" : "s") + '</p></div></div>' +
      '<div class="lc-meta text-small"><span>' + esc(modeText) + '</span><span>Successful loops ' +
      Number(recurrence.successfulLoops || 0) + '</span><span>Missed loops ' +
      Number(recurrence.missedLoops || 0) + (action.polarity === "negative"
        ? '</span><span>Violations ' + Number(recurrence.violationCount || 0)
        : "") + '</span></div><div class="lc-actions">' +
      (recurrence.status === "active" && action.status !== "archived"
        ? '<button type="button" class="btn btn-primary" data-action="open-log" data-id="' +
          action.id + '" data-source="repeating">' +
          (action.polarity === "negative" ? "Log violation" : "Log Action") + "</button>"
        : "") +
      (action.status === "active"
        ? '<button type="button" class="btn btn-ghost" data-action="action-use-status" data-id="' +
          action.id + '" data-status="paused">Pause</button>'
        : action.status === "paused"
          ? '<button type="button" class="btn btn-ghost" data-action="action-use-status" data-id="' +
            action.id + '" data-status="active">Resume</button>'
          : "") + "</div></article>";
  }

  function renderActions() {
    let actions = state.actions.filter(function(action) {
      if (!action.recurrence || !action.recurrence.enabled) return false;
      if (ui.actionStatus === "finished") return action.recurrence.status === "finished";
      if (ui.actionStatus !== "all" && action.status !== ui.actionStatus) return false;
      if (ui.actionCategory !== "all" && action.categoryId !== ui.actionCategory) return false;
      return action.status !== "archived" || ui.actionStatus === "all";
    });
    actions.sort(function(a, b) {
      if (ui.actionSort === "name") return a.name.localeCompare(b.name);
      if (ui.actionSort === "interval") return a.recurrence.intervalDays - b.recurrence.intervalDays;
      return (recurrenceSnapshot(a).value || 9999) - (recurrenceSnapshot(b).value || 9999);
    });
    const daily = actions.filter(function(action) {
      return action.recurrence.intervalDays === 1 && action.recurrence.status !== "finished";
    });
    const repeating = actions.filter(function(action) {
      return action.recurrence.intervalDays > 1 && action.recurrence.status !== "finished";
    });
    const finished = actions.filter(function(action) { return action.recurrence.status === "finished"; });
    const filters = '<div class="lc-filter-row"><select class="form-select" id="action-status-filter">' +
      ["active", "paused", "finished", "all"].map(function(status) {
        return '<option value="' + status + '"' + (ui.actionStatus === status ? " selected" : "") +
          ">" + cap(status) + "</option>";
      }).join("") + '</select><select class="form-select" id="action-category-filter">' +
      categoryOptions(ui.actionCategory, true) + '</select><select class="form-select" id="action-sort">' +
      '<option value="countdown"' + (ui.actionSort === "countdown" ? " selected" : "") +
      '>Countdown</option><option value="name"' + (ui.actionSort === "name" ? " selected" : "") +
      '>Name</option><option value="interval"' + (ui.actionSort === "interval" ? " selected" : "") +
      ">Interval</option></select></div>";
    return '<section class="lc-section" aria-labelledby="actions-title"><div class="lc-section-head"><div>' +
      '<h2 id="actions-title">Repeating Actions</h2><p class="lc-muted">What reusable Actions are currently due.</p></div>' +
      '<button type="button" class="btn btn-ghost" data-open-build="actions">Open Action library</button></div>' +
      filters + "</section>" +
      '<section class="lc-section" aria-labelledby="daily-title"><h2 id="daily-title">Daily</h2>' +
      (daily.length ? '<div class="lc-cards">' + daily.map(recurrenceCard).join("") + "</div>" :
        '<p class="lc-empty">No matching daily Actions.</p>') + "</section>" +
      '<section class="lc-section" aria-labelledby="repeating-title"><h2 id="repeating-title">Repeating</h2>' +
      (repeating.length ? '<div class="lc-cards">' + repeating.map(recurrenceCard).join("") + "</div>" :
        '<p class="lc-empty">No matching repeating Actions.</p>') + "</section>" +
      (finished.length ? '<section class="lc-section" aria-labelledby="finished-title"><h2 id="finished-title">Succeeded / Finished</h2>' +
        '<div class="lc-cards">' + finished.map(recurrenceCard).join("") + "</div></section>" : "");
  }

  function renderTodoForm() {
    if (!ui.todoDraft) return "";
    const draft = ui.todoDraft;
    if (draft.kind === "action") {
      return '<form class="card lc-card-stack" id="action-task-form"><div class="lc-section-head"><h3>New Action task</h3>' +
        '<button type="button" class="btn btn-ghost" data-action="todo-cancel">Cancel</button></div>' +
        '<div class="lc-form-grid"><div><label class="form-label" for="task-action">Existing Action</label>' +
        '<select class="form-select" id="task-action">' + actionOptions(draft.actionId, true) + '</select></div>' +
        '<div><label class="form-label" for="task-type">Type</label><select class="form-select" id="task-type">' +
        '<option value="deadline"' + (draft.type === "deadline" ? " selected" : "") + '>Deadline</option>' +
        '<option value="one_time"' + (draft.type === "one_time" ? " selected" : "") + '>One-time / no deadline</option>' +
        '<option value="specific_date"' + (draft.type === "specific_date" ? " selected" : "") + '>Specific date</option></select></div>' +
        '<div><label class="form-label" for="task-target-date">Date</label><input class="form-control" id="task-target-date" type="date" value="' +
        esc(draft.targetDate || "") + '"' + (draft.type === "one_time" ? " disabled" : "") + '></div></div>' +
        '<div class="lc-actions"><button type="submit" class="btn btn-primary">Create Action task</button></div></form>';
    }
    return '<form class="card lc-card-stack" id="quick-task-form"><div class="lc-section-head"><h3>New Quick task</h3>' +
      '<button type="button" class="btn btn-ghost" data-action="todo-cancel">Cancel</button></div>' +
      '<div class="lc-form-grid"><div><label class="form-label" for="quick-name">Name</label>' +
      '<input class="form-control" id="quick-name" required value="' + esc(draft.name || "") + '"></div>' +
      '<div><label class="form-label" for="quick-date">Specific date (optional)</label>' +
      '<input class="form-control" id="quick-date" type="date" value="' + esc(draft.date || "") + '"></div>' +
      '<div><label class="form-label" for="quick-time">Time (optional)</label>' +
      '<input class="form-control" id="quick-time" type="time" value="' + esc(draft.time || "") + '"></div>' +
      '<div><label class="form-label" for="quick-deadline">Deadline (optional)</label>' +
      '<input class="form-control" id="quick-deadline" type="date" value="' + esc(draft.deadline || "") + '"></div></div>' +
      '<div class="lc-actions"><button type="submit" class="btn btn-primary">Create Quick task</button></div></form>';
  }

  function renderTodo() {
    let entries = state.actionTasks.map(function(task) {
      return { kind: "action", item: task, name: actionName(task.actionId, task.actionNameSnapshot), date: task.targetDate || "9999-12-31" };
    }).concat(state.quickTasks.map(function(task) {
      return { kind: "quick", item: task, name: task.name, date: task.deadline || task.date || "9999-12-31" };
    })).filter(function(entry) {
      const statusMatch = ui.todoStatus === "all" ||
        ui.todoStatus === "active" && entry.item.status === "active" ||
        ui.todoStatus === "resolved" && entry.item.status !== "active";
      const kindMatch = ui.todoKind === "all" || ui.todoKind === entry.kind;
      return statusMatch && kindMatch;
    });
    entries.sort(function(a, b) {
      return ui.todoSort === "name"
        ? a.name.localeCompare(b.name)
        : a.date.localeCompare(b.date) || a.name.localeCompare(b.name);
    });
    const filters = '<div class="lc-filter-row"><select class="form-select" id="todo-status-filter">' +
      '<option value="active"' + (ui.todoStatus === "active" ? " selected" : "") + '>Active</option>' +
      '<option value="resolved"' + (ui.todoStatus === "resolved" ? " selected" : "") + '>Finished / failed</option>' +
      '<option value="all"' + (ui.todoStatus === "all" ? " selected" : "") + '>All</option></select>' +
      '<select class="form-select" id="todo-kind-filter"><option value="all"' +
      (ui.todoKind === "all" ? " selected" : "") + '>All types</option><option value="action"' +
      (ui.todoKind === "action" ? " selected" : "") + '>Action tasks</option><option value="quick"' +
      (ui.todoKind === "quick" ? " selected" : "") + '>Quick tasks</option></select>' +
      '<select class="form-select" id="todo-sort"><option value="date"' +
      (ui.todoSort === "date" ? " selected" : "") + '>Date</option><option value="name"' +
      (ui.todoSort === "name" ? " selected" : "") + ">Name</option></select></div>";
    return '<section class="lc-section" aria-labelledby="todo-title"><div class="lc-section-head"><div>' +
      '<h2 id="todo-title">To-do</h2><p class="lc-muted">Temporary requirements. Action tasks reference the permanent Action without changing it.</p></div>' +
      '<div class="lc-actions"><button type="button" class="btn btn-primary" data-action="todo-new-action">Action task</button>' +
      '<button type="button" class="btn" data-action="todo-new-quick">Quick task</button></div></div>' +
      renderTodoForm() + filters + '<div>' +
      (entries.length ? entries.map(function(entry) {
        if (entry.kind === "action") {
          const task = entry.item;
          return '<div class="lc-row"><div class="lc-row-main"><div class="lc-inline"><strong>' +
            esc(entry.name) + '</strong><span class="viz-badge">' + cap(task.status) +
            '</span></div><div class="lc-meta text-small"><span>Action task</span><span>' +
            esc(taskDateText(task)) + '</span><span>' + esc(task.type.replace("_", " ")) +
            '</span></div></div><div class="lc-row-actions">' +
            (task.status === "active" && findAction(task.actionId)
              ? '<button type="button" class="btn btn-primary" data-action="open-log" data-id="' +
                task.actionId + '" data-source="todo">Log Action</button>'
              : "") +
            '<button type="button" class="btn btn-ghost" data-action="todo-remove" data-kind="action" data-id="' +
            task.id + '">Remove</button></div></div>';
        }
        const task = entry.item;
        return '<div class="lc-row"><div class="lc-row-main"><div class="lc-inline"><strong>' +
          esc(task.name) + '</strong><span class="viz-badge">' + cap(task.status) +
          '</span></div><div class="lc-meta text-small"><span>Quick task</span><span>' +
          esc(quickTaskDateText(task)) + '</span></div></div><div class="lc-row-actions">' +
          (task.status === "active"
            ? '<button type="button" class="btn btn-primary" data-action="quick-complete" data-id="' +
              task.id + '">Complete</button>'
            : "") +
          '<button type="button" class="btn btn-ghost" data-action="todo-remove" data-kind="quick" data-id="' +
          task.id + '">Remove</button></div></div>';
      }).join("") : '<p class="lc-empty">No matching To-do items.</p>') + "</div></section>";
  }

  function setProjectStatus(projectId, status, source) {
    const project = findProject(projectId);
    if (!project || !["active", "paused", "parked", "completed", "archived"].includes(status)) return false;
    const previous = project.status;
    if (previous === status) return true;
    project.status = status;
    project.updatedAt = nowISO();
    project.completedAt = status === "completed" ? nowISO() : null;
    appendHistory({
      type: "project",
      event: status === "completed" ? "project_completed" : "project_status_changed",
      objectType: "project",
      objectId: project.id,
      nameSnapshot: project.name,
      projectIds: [project.id],
      outcome: status === "completed" ? "success" : "neutral",
      description: project.name + " changed from " + cap(previous) + " → " + cap(status),
      metadata: { previousStatus: previous, nextStatus: status, source: source || "app" }
    });
    persist();
    setFlash(project.name + " is now " + status + ".");
    return true;
  }

  function projectCard(project) {
    const activity = projectActivity(project);
    const actions = project.actionIds.map(findAction).filter(Boolean);
    return '<article class="card lc-card-stack"><div class="lc-section-head"><div><h3>' +
      esc(project.name) + '</h3><div class="lc-inline">' +
      categoryBadges(categoryIdsForEntity("project", project)) + '</div></div><span class="viz-badge">' +
      cap(project.status) + '</span></div><p>' + esc(project.description) + '</p>' +
      '<progress class="lc-progress" max="100" value="' + project.progress + '" aria-label="' +
      esc(project.name) + " progress " + project.progress + '%"></progress><div class="lc-meta text-small">' +
      '<span>' + project.progress + '% progress</span><span>' + esc(deadlineText(project.deadline, project.status)) +
      '</span><span>' + activity.sessions + " Action log" + (activity.sessions === 1 ? "" : "s") +
      '</span><span>' + formatMinutes(activity.minutes) + " recorded</span></div>" +
      (actions.length ? '<div class="lc-actions">' + actions.map(function(action) {
        return '<button type="button" class="btn" data-action="open-log" data-id="' +
          action.id + '" data-source="project">Log ' + esc(action.name) + "</button>";
      }).join("") + "</div>" : '<p class="lc-empty">No Actions attached.</p>') +
      '<div class="lc-actions"><label class="sr-only" for="project-use-status-' + project.id +
      '">Project status</label><select class="form-select" id="project-use-status-' + project.id +
      '" data-project-use-status="' + project.id + '">' +
      ["active", "paused", "parked", "completed"].map(function(status) {
        return '<option value="' + status + '"' + (project.status === status ? " selected" : "") +
          ">" + cap(status) + "</option>";
      }).join("") + "</select></div></article>";
