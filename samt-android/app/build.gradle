plugins {
    id 'com.android.application'
}

android {
    namespace 'app.samt.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.samt.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += ['../web']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
