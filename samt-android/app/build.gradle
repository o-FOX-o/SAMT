plugins {
    id 'com.android.application'
}

def previewBuild = (System.getenv('SAMT_BUILD_NUMBER') ?: '0').toInteger()
def generatedWebAssets = layout.buildDirectory.dir('generated/samt-web')
def bundleWeb = tasks.register('bundleWeb', Exec) {
    workingDir rootProject.projectDir
    commandLine((System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'), 'run', 'build:web')
    inputs.dir rootProject.file('web')
    inputs.file rootProject.file('scripts/build-web.mjs')
    inputs.file rootProject.file('package.json')
    outputs.dir generatedWebAssets
}

android {
    namespace 'app.samt.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.samt.android'
        minSdk 26
        targetSdk 35
        versionCode 30000 + previewBuild
        versionName "0.3.${previewBuild}"
    }

    signingConfigs {
        preview {
            storeFile rootProject.file('signing/samt-preview.keystore')
            storePassword 'samt-preview'
            keyAlias 'samt-preview'
            keyPassword 'samt-preview'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preview
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.preview
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += [generatedWebAssets.get().asFile]
    }
}

tasks.named('preBuild').configure {
    dependsOn bundleWeb
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
