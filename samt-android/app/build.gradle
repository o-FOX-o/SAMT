plugins {
    id 'com.android.application'
}

def previewBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'app.samt.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.samt.android'
        minSdk 26
        targetSdk 35
        versionCode 20000 + previewBuild
        versionName "0.2.${previewBuild}"
    }

    signingConfigs {
        preview {
            storeFile rootProject.file('signing/samt-preview.keystore')
            storePassword 'samt-preview'
            keyAlias 'samt-preview'
            keyPassword 'samt-preview'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preview
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.preview
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += ['../web']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
